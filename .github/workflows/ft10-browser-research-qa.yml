name: FT-10 Browser Research QA

on:
  pull_request:
    branches: [main]
    paths:
      - 'artifacts/calcstride/src/lib/ft10-xlsx-pdf-spike.test.ts'
      - 'artifacts/calcstride/src/lib/ft09-sheetjs-loader.ts'
      - 'artifacts/calcstride/src/lib/xlsx-zip-preflight.ts'
      - 'artifacts/calcstride/package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/ft10-browser-research-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-research-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Run focused FT-10 conversion research suite
        working-directory: artifacts/calcstride
        run: pnpm exec tsx --test src/lib/ft10-xlsx-pdf-spike.test.ts

      - name: Create browser-local privacy and resource harness
        working-directory: artifacts/calcstride
        run: |
          cat > ft10-browser-qa.html <<'HTML'
          <!doctype html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"></head><body><main id="app">FT10 starting</main><script type="module" src="/src/ft10-browser-qa.ts"></script></body></html>
          HTML

          cat > src/ft10-browser-qa.ts <<'TS'
          import { loadFt09SheetJs } from '@/lib/ft09-sheetjs-loader';
          import { preflightXlsxZip } from '@/lib/xlsx-zip-preflight';

          const app = document.querySelector<HTMLElement>('#app')!;
          const mode = new URLSearchParams(location.search).get('mode') === 'mobile' ? 'mobile' : 'desktop';
          const sentinel = 'FT10_PRIVATE_SENTINEL_62917';
          const sentinelFile = `private-${sentinel}.xlsx`;
          const violations: string[] = [];
          const beforeLocal = JSON.stringify({...localStorage});
          const beforeSession = JSON.stringify({...sessionStorage});
          const beforeResources = performance.getEntriesByType('resource').map((entry) => entry.name);

          const containsSentinel = async (value: unknown): Promise<boolean> => {
            if (value == null) return false;
            if (typeof value === 'string') return value.includes(sentinel) || value.includes(sentinelFile);
            if (value instanceof URLSearchParams) return value.toString().includes(sentinel);
            if (value instanceof FormData) {
              for (const [, item] of value.entries()) {
                if (typeof item === 'string' && item.includes(sentinel)) return true;
                if (item instanceof File && (item.name.includes(sentinel) || (await item.text()).includes(sentinel))) return true;
              }
              return false;
            }
            if (value instanceof Blob) return (await value.text()).includes(sentinel);
            if (value instanceof ArrayBuffer) return new TextDecoder().decode(value).includes(sentinel);
            if (ArrayBuffer.isView(value)) return new TextDecoder().decode(value as ArrayBufferView<ArrayBuffer>).includes(sentinel);
            return false;
          };

          const originalFetch = window.fetch.bind(window);
          window.fetch = (async (input: RequestInfo | URL, init?: RequestInit) => {
            const request = input instanceof Request ? input : null;
            const url = request?.url ?? String(input);
            if (url.includes(sentinel) || await containsSentinel(init?.body)) violations.push(`fetch-egress:${url}`);
            return originalFetch(input, init);
          }) as typeof fetch;

          const OriginalXHR = window.XMLHttpRequest;
          class GuardedXHR extends OriginalXHR {
            override send(body?: Document | XMLHttpRequestBodyInit | null): void {
              void containsSentinel(body).then((found) => { if (found) violations.push('xhr-egress'); });
              super.send(body);
            }
          }
          window.XMLHttpRequest = GuardedXHR as typeof XMLHttpRequest;

          if (navigator.sendBeacon) {
            const originalBeacon = navigator.sendBeacon.bind(navigator);
            navigator.sendBeacon = ((url: string | URL, data?: BodyInit | null) => {
              void containsSentinel(data).then((found) => { if (String(url).includes(sentinel) || found) violations.push('beacon-egress'); });
              return originalBeacon(url, data);
            }) as typeof navigator.sendBeacon;
          }

          const originalSocketSend = WebSocket.prototype.send;
          WebSocket.prototype.send = function(data: string | ArrayBufferLike | Blob | ArrayBufferView) {
            void containsSentinel(data).then((found) => { if (found) violations.push('websocket-egress'); });
            return originalSocketSend.call(this, data);
          };

          const originalIndexedDbOpen = indexedDB.open.bind(indexedDB);
          indexedDB.open = ((...args: Parameters<IDBFactory['open']>) => {
            violations.push('indexeddb-open');
            return originalIndexedDbOpen(...args);
          }) as IDBFactory['open'];
          const originalCacheOpen = caches.open.bind(caches);
          caches.open = (async (...args: Parameters<CacheStorage['open']>) => {
            violations.push('cache-open');
            return originalCacheOpen(...args);
          }) as CacheStorage['open'];

          async function run() {
            const started = performance.now();
            await new Promise((resolve) => setTimeout(resolve, 50));
            const XLSX = await loadFt09SheetJs();
            const { jsPDF } = await import('jspdf');

            const rows = [['Account', 'Description', 'Amount'], ['00123', sentinel, -42.5], ['00456', '=2+2', 125.75]];
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, XLSX.utils.aoa_to_sheet(rows), 'Printable');
            const xlsxBuffer = XLSX.write(workbook, { type: 'array', bookType: 'xlsx', compression: true }) as ArrayBuffer;
            const xlsxBytes = new Uint8Array(xlsxBuffer);
            const preflight = preflightXlsxZip(xlsxBytes);
            if (!preflight.ok) throw new Error(`generated workbook failed ZIP preflight: ${preflight.reason}`);

            const reopened = XLSX.read(xlsxBytes, { type: 'array', raw: true, cellFormula: true });
            const values = XLSX.utils.sheet_to_json<unknown[]>(reopened.Sheets.Printable, { header: 1, raw: true, defval: '' });
            if (values[1]?.[0] !== '00123' || values[1]?.[1] !== sentinel) throw new Error('workbook value preservation failed');
            if (reopened.Sheets.Printable.B3?.f !== undefined) throw new Error('formula-looking text became executable formula');

            const pdf = new jsPDF({ unit: 'pt', format: 'a4' });
            let y = 48;
            for (const row of values) {
              pdf.text(row.map((cell) => String(cell)).join(' | '), 36, y, { maxWidth: 520 });
              y += 18;
            }
            const pdfBytes = new Uint8Array(pdf.output('arraybuffer'));
            if (pdfBytes.byteLength === 0 || pdfBytes.byteLength > 2 * 1024 * 1024) throw new Error(`PDF output size outside research ceiling: ${pdfBytes.byteLength}`);

            await new Promise((resolve) => setTimeout(resolve, 100));
            if (JSON.stringify({...localStorage}) !== beforeLocal || JSON.stringify({...sessionStorage}) !== beforeSession) violations.push('web-storage-write');
            if (location.href.includes(sentinel) || document.cookie.includes(sentinel)) violations.push('sentinel-in-page-state');
            if (violations.length) throw new Error(`privacy violations: ${violations.join(',')}`);

            const newResources = performance.getEntriesByType('resource').map((entry) => entry.name).filter((name) => !beforeResources.includes(name));
            const remote = newResources.filter((name) => {
              const url = new URL(name, location.href);
              return url.origin !== location.origin;
            });
            if (remote.length) throw new Error(`cross-origin runtime dependency detected: ${remote.join(',')}`);

            const elapsed = Math.round(performance.now() - started);
            app.textContent = `FT10_BROWSER_RESEARCH_PASS ${mode} ${innerWidth}x${innerHeight} ${xlsxBytes.byteLength}xlsx ${pdfBytes.byteLength}pdf ${preflight.entries}entries ${elapsed}ms`;
            document.documentElement.dataset.qa = 'pass';
          }

          run().catch((error) => {
            app.textContent = `FT10_BROWSER_RESEARCH_FAIL ${mode} ${error?.stack || error}`;
            document.documentElement.dataset.qa = 'fail';
          });
          TS

          cat > /tmp/ft10-browser-cdp.mjs <<'JS'
          import { spawn, spawnSync } from 'node:child_process';
          const [mode, width, height, portText] = process.argv.slice(2);
          const port = Number(portText);
          const candidates = [process.env.CHROME_BIN, 'google-chrome-stable', 'google-chrome', 'chromium', 'chromium-browser'].filter(Boolean);
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          async function main() {
            let chromeBin = '';
            for (const candidate of candidates) {
              const probe = spawnSync('which', [candidate], { encoding: 'utf8' });
              if (probe.status === 0 && probe.stdout.trim()) { chromeBin = probe.stdout.trim(); break; }
            }
            if (!chromeBin) throw new Error('No Chrome/Chromium executable found');
            const chrome = spawn(chromeBin, ['--headless=new', '--no-sandbox', '--disable-gpu', `--window-size=${width},${height}`, `--remote-debugging-port=${port}`, `--user-data-dir=/tmp/ft10-browser-${mode}`, 'about:blank'], { stdio: ['ignore', 'ignore', 'pipe'] });
            let diagnostics = '';
            chrome.stderr.on('data', (chunk) => { diagnostics += String(chunk); });
            async function targetSocket() {
              for (let attempt = 0; attempt < 80; attempt += 1) {
                try {
                  const targets = await fetch(`http://127.0.0.1:${port}/json/list`).then((response) => response.json());
                  const target = targets.find((item) => item.type === 'page');
                  if (target?.webSocketDebuggerUrl) return new WebSocket(target.webSocketDebuggerUrl);
                } catch {}
                await sleep(250);
              }
              throw new Error(`Chrome DevTools did not start. ${diagnostics}`);
            }
            let socket;
            try {
              socket = await targetSocket();
              await new Promise((resolve, reject) => { socket.addEventListener('open', resolve, { once: true }); socket.addEventListener('error', reject, { once: true }); });
              let id = 0;
              const pending = new Map();
              socket.addEventListener('message', (event) => {
                const message = JSON.parse(String(event.data));
                if (!message.id || !pending.has(message.id)) return;
                const handlers = pending.get(message.id); pending.delete(message.id);
                if (message.error) handlers.reject(new Error(message.error.message)); else handlers.resolve(message.result);
              });
              const command = (method, params = {}) => new Promise((resolve, reject) => { const requestId = ++id; pending.set(requestId, { resolve, reject }); socket.send(JSON.stringify({ id: requestId, method, params })); });
              await command('Page.enable');
              await command('Runtime.enable');
              await command('Emulation.setDeviceMetricsOverride', { width: Number(width), height: Number(height), deviceScaleFactor: 1, mobile: mode === 'mobile' });
              await command('Page.navigate', { url: `http://127.0.0.1:4177/ft10-browser-qa.html?mode=${mode}` });
              const deadline = Date.now() + 180_000;
              while (Date.now() < deadline) {
                const state = await command('Runtime.evaluate', { expression: 'document.documentElement.dataset.qa || ""', returnByValue: true });
                const value = state?.result?.value;
                if (value === 'pass' || value === 'fail') {
                  const body = await command('Runtime.evaluate', { expression: 'document.body.innerText', returnByValue: true });
                  console.log(body?.result?.value ?? '');
                  if (value === 'fail') throw new Error(body?.result?.value ?? 'FT-10 browser research gate failed');
                  return;
                }
                await sleep(250);
              }
              throw new Error(`Timed out waiting for FT-10 ${mode}. ${diagnostics}`);
            } finally {
              socket?.close();
              chrome.kill('SIGTERM');
            }
          }
          main().catch((error) => { console.error(error); process.exitCode = 1; });
          JS

      - name: Start Vite harness
        working-directory: artifacts/calcstride
        run: |
          pnpm exec vite --host 127.0.0.1 --port 4177 > /tmp/ft10-browser-vite.log 2>&1 &
          for i in {1..40}; do curl -fsS http://127.0.0.1:4177/ft10-browser-qa.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/ft10-browser-vite.log; exit 1

      - name: Desktop privacy and resource research gate
        run: node /tmp/ft10-browser-cdp.mjs desktop 1440 1200 9262

      - name: Mobile 390x844 privacy and resource research gate
        run: node /tmp/ft10-browser-cdp.mjs mobile 390 844 9263

      - name: Verify no FT-10 public exposure and production build remains green
        working-directory: artifacts/calcstride
        run: |
          if grep -R -n "xlsx-to-pdf" src --exclude='*.test.ts' --exclude='ft10-browser-qa.ts'; then
            echo 'FT-10 public/runtime route exposure detected before research gate approval'; exit 1
          fi
          pnpm run build
