name: QA Build Lifecycle Focus

on:
  push:
    branches:
      - qa/build-lifecycle-contract

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/calcstride exec tsx --test src/lib/build-lifecycle.test.ts
