name: Interest finalize sitemap
on:
  push:
    branches: [fix/interest-intent-consolidation]
permissions:
  contents: write
jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[interest-final-sitemap]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/interest-intent-consolidation
          fetch-depth: 0
      - name: Apply final contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('artifacts/calcstride/src/lib/site-audit.test.ts')
          s=p.read_text()
          s=s.replace('assert.equal(publishedToolCount, 162);','assert.equal(publishedToolCount, 161);',1)
          s=s.replace('assert.equal(localTools.length, 162);','assert.equal(localTools.length, 161);',1)
          s=s.replace('assert.equal(publishedTools.length, 163);','assert.equal(publishedTools.length, 162);',1)
          p.write_text(s)
          p=Path('artifacts/calcstride/scripts/generate-seo-files.ts')
          s=p.read_text()
          marker="import { articles } from '../src/lib/articles';\n"
          if "import { legacyRedirectPaths } from '../src/lib/redirects';" not in s:
              s=s.replace(marker,marker+"import { legacyRedirectPaths } from '../src/lib/redirects';\n",1)
          s=s.replace('const sitemapRoutes = [...new Set(publicRoutes.map(normalizeRoutePath))];',"const legacyPaths = new Set(legacyRedirectPaths.map(normalizeRoutePath));\nconst sitemapRoutes = [...new Set(publicRoutes.map(normalizeRoutePath))]\n  .filter((route) => !legacyPaths.has(route));",1)
          p.write_text(s)
          for name in ('interest-final-failure.txt','interest-focused-output.txt','interest-full-failure.txt','interest-test-output-2.txt','interest-test-output.txt'):
              q=Path(name)
              if q.exists(): q.unlink()
          Path('.github/workflows/one-time-interest-finalize-sitemap.yml').unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize Interest sitemap and registry contracts [interest-final-sitemap]"
          git push origin HEAD:fix/interest-intent-consolidation
