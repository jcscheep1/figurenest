name: One-time Fuel Cost metric repair

on:
  push:
    branches:
      - fix/fuel-cost-metric-breakdown

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Fix metric Fuel Cost per-distance breakdown'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/fuel-cost-metric-breakdown
          fetch-depth: 0
      - name: Apply focused repair and regression coverage
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          page = Path('artifacts/calcstride/src/pages/AutomotiveCalculatorPage.tsx')
          text = page.read_text()
          old_import = "import { getAutomotiveResetUnits } from '@/lib/automotive-reset-state';"
          new_import = old_import + "\nimport { fuelCostPerDisplayedDistance } from '@/lib/fuel-cost-distance';"
          old_formula = "formatCurrency((c / b) / distanceUnits[distanceUnit].miles, preferences.currency)"
          new_formula = "formatCurrency(fuelCostPerDisplayedDistance(c / b, distanceUnits[distanceUnit].miles), preferences.currency)"
          if text.count(old_import) != 1:
              raise SystemExit('Expected automotive reset import exactly once')
          if text.count(old_formula) != 1:
              raise SystemExit('Expected buggy Fuel Cost per-distance formula exactly once')
          text = text.replace(old_import, new_import, 1).replace(old_formula, new_formula, 1)
          page.write_text(text)

          Path('artifacts/calcstride/src/lib/fuel-cost-distance.ts').write_text("""export function fuelCostPerDisplayedDistance(costPerMile: number, milesPerDisplayedDistance: number): number {\n  return costPerMile * milesPerDisplayedDistance;\n}\n""")
          Path('artifacts/calcstride/src/lib/fuel-cost-distance.test.ts').write_text("""import assert from 'node:assert/strict';\nimport test from 'node:test';\nimport { fuelCostPerDisplayedDistance } from './fuel-cost-distance';\n\ntest('Fuel Cost keeps cost per mile unchanged for imperial distance', () => {\n  assert.equal(fuelCostPerDisplayedDistance(0.25, 1), 0.25);\n});\n\ntest('Fuel Cost converts cost per mile to the lower cost per kilometre', () => {\n  const milesPerKilometre = 1 / 1.609344;\n  const actual = fuelCostPerDisplayedDistance(0.25, milesPerKilometre);\n  assert.ok(Math.abs(actual - 0.1553427980593335) < 1e-12);\n});\n""")
          PY
          rm .github/workflows/fix-fuel-cost-metric-breakdown.yml
          git config user.name "FigureNest automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix metric Fuel Cost per-distance breakdown"
          git push origin HEAD:fix/fuel-cost-metric-breakdown
