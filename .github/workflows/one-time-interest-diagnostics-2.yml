name: One-time Interest diagnostics 2

on:
  push:
    branches:
      - fix/interest-intent-consolidation

permissions:
  contents: write

jobs:
  diagnose:
    if: ${{ !contains(github.event.head_commit.message, '[interest-diagnostics-2]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/interest-intent-consolidation
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc -b lib/api-client-react
      - name: Capture failures
        shell: bash
        run: |
          set +e
          pnpm --filter @workspace/calcstride test > interest-test-output-2.txt 2>&1
          echo "exit_status=$?" >> interest-test-output-2.txt
          rm .github/workflows/one-time-interest-diagnostics-2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Capture remaining Interest failure [interest-diagnostics-2]"
          git push origin HEAD:fix/interest-intent-consolidation
