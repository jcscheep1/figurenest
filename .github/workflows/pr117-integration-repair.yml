name: PR 117 integration repair

on:
  push:
    branches: [expansion/batch-1-business-marketing]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/batch-1-business-marketing
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Apply exact integration repairs
        run: |
          python - <<'PY'
          from pathlib import Path

          api = Path('artifacts/api-server/src/routes/catalog.ts')
          text = api.read_text()
          cable = '  { slug: "cable-fuse-size", name: "Cable & Fuse Size Calculator", description: "Estimate cable size, protective-device rating, design current, and voltage drop for common low-voltage circuits.", category: "Electrical", categorySlug: "electrical", href: "/calculators/electrical/cable-fuse-size", tags: ["cable size", "wire size", "fuse size", "breaker size", "electrical cable", "voltage drop", "230v", "400v"], featured: true, lastUpdated: CATALOG_LAST_UPDATED },\n'
          marker = '  {\n    slug: "vat",\n'
          assert 'slug: "cable-fuse-size"' not in text, 'API catalog already contains cable-fuse-size; abort rather than duplicate'
          assert marker in text, 'VAT insertion marker missing'
          text = text.replace(marker, cable + marker, 1)
          api.write_text(text)

          category = Path('artifacts/calcstride/src/lib/category-content.ts')
          text = category.read_text()
          marker = "      { slug: 'voltage-drop', description: 'Estimate conductor voltage loss from entered current, one-way length, resistance, and single- or three-phase circuit assumptions.' },\n"
          addition = "      { slug: 'cable-fuse-size', description: 'Estimate design current, cable cross-section, protective-device rating, and voltage drop for common low-voltage circuits, with metric or imperial cable-length input.' },\n"
          assert "{ slug: 'cable-fuse-size'" not in text, 'Electrical category content already contains cable-fuse-size; abort rather than duplicate'
          assert marker in text, 'Electrical category insertion marker missing'
          text = text.replace(marker, marker + addition, 1)
          category.write_text(text)

          audit = Path('artifacts/calcstride/src/lib/site-audit.test.ts')
          text = audit.read_text()
          old = "  assert.equal(publishedTools.length, publishedToolCount);\n  assert.equal(relatedToolGraph.size, publishedTools.length);"
          new = "  assert.equal(localTools.length, publishedToolCount);\n  assert.equal(relatedToolGraph.size, publishedTools.length);"
          assert old in text, 'Expected related-graph count assertion not found'
          text = text.replace(old, new, 1)
          audit.write_text(text)
          PY
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build workspace type dependency
        run: pnpm exec tsc -b lib/api-client-react
      - name: Generate SEO files
        run: pnpm --filter @workspace/calcstride generate:seo
      - name: Focused parity and site audit tests
        run: pnpm --filter @workspace/calcstride exec tsx --test src/lib/phase-four.test.ts src/lib/phase-three-c.test.ts src/lib/site-audit.test.ts
      - name: Typecheck
        run: pnpm --filter @workspace/calcstride typecheck
      - name: Full unit tests
        run: pnpm --filter @workspace/calcstride test
      - name: Production build
        run: pnpm --filter @workspace/calcstride build
      - name: Commit verified repair and remove helper workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/pr117-integration-repair.yml
          git add artifacts/api-server/src/routes/catalog.ts artifacts/calcstride/src/lib/category-content.ts artifacts/calcstride/src/lib/site-audit.test.ts artifacts/calcstride/public/sitemap.xml artifacts/calcstride/public/robots.txt
          git commit -m "Complete cable fuse catalog integration"
          git push origin HEAD:expansion/batch-1-business-marketing
