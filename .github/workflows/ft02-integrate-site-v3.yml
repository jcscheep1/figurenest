name: FT02 Integrate Site V3

on:
  push:
    branches: [expansion/ft-02-pdf-sign-edit-core]
    paths:
      - '.github/workflows/ft02-integrate-site-v3.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/ft-02-pdf-sign-edit-core
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Integrate FT-02 as a first-class File Tool
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1))

          app = 'artifacts/calcstride/src/App.tsx'
          replace_once(app,
            "const articlePages = import.meta.env.SSR ? await import('@/pages/ArticlePages') : null;\nconst notFoundPage = import.meta.env.SSR ? await import('@/pages/not-found') : null;",
            "const articlePages = import.meta.env.SSR ? await import('@/pages/ArticlePages') : null;\nconst fileToolPages = import.meta.env.SSR ? await import('@/pages/PdfSignEditPage') : null;\nconst notFoundPage = import.meta.env.SSR ? await import('@/pages/not-found') : null;")
          replace_once(app,
            "const ArticlePage = articlePages?.ArticlePage\n  ?? lazy(() => import('@/pages/ArticlePages').then(({ ArticlePage: page }) => ({ default: page })));\nconst NotFound = notFoundPage?.default ?? lazy(() => import('@/pages/not-found'));",
            "const ArticlePage = articlePages?.ArticlePage\n  ?? lazy(() => import('@/pages/ArticlePages').then(({ ArticlePage: page }) => ({ default: page })));\nconst PdfSignEditPage = fileToolPages?.PdfSignEditPage\n  ?? lazy(() => import('@/pages/PdfSignEditPage').then(({ PdfSignEditPage: page }) => ({ default: page })));\nconst NotFound = notFoundPage?.default ?? lazy(() => import('@/pages/not-found'));")
          replace_once(app,
            "        <Route path=\"/articles\" component={ArticleIndexPage} />",
            "        <Route path=\"/file-tools/pdf-sign-edit\" component={PdfSignEditPage} />\n        <Route path=\"/articles\" component={ArticleIndexPage} />")

          catalog = 'artifacts/calcstride/src/lib/catalog.ts'
          replace_once(catalog,
            "import { CATALOG_LAST_UPDATED } from '@/lib/catalog-metadata';",
            "import { CATALOG_LAST_UPDATED } from '@/lib/catalog-metadata';\nimport { FILE_TOOLS_CATEGORY, fileToolCatalog } from '@/lib/file-tools-catalog';")
          replace_once(catalog,
            "const phaseFourExpansionTools: Tool[] = phaseFourRoutes.map((entry) =>\n  tool(entry.slug, entry.name, entry.description, entry.category, entry.categorySlug, [...entry.tags], false, entry.href),\n);",
            "const phaseFourExpansionTools: Tool[] = phaseFourRoutes.map((entry) =>\n  tool(entry.slug, entry.name, entry.description, entry.category, entry.categorySlug, [...entry.tags], false, entry.href),\n);\nconst fileToolCatalogTools: Tool[] = fileToolCatalog.map((entry) =>\n  tool(entry.slug, entry.name, entry.description, entry.category, entry.categorySlug, [...entry.tags], entry.featured, entry.href),\n);")
          replace_once(catalog,
            "const allPublishedTools: Tool[] = [...coreTools, ...priorityOneExpansionTools, ...phaseTwoExpansionTools, ...phaseThreeAExpansionTools, ...phaseThreeBExpansionTools, ...phaseThreeCExpansionTools, ...phaseFourExpansionTools, ...constructionCatalogTools];",
            "const allPublishedTools: Tool[] = [...coreTools, ...priorityOneExpansionTools, ...phaseTwoExpansionTools, ...phaseThreeAExpansionTools, ...phaseThreeBExpansionTools, ...phaseThreeCExpansionTools, ...phaseFourExpansionTools, ...fileToolCatalogTools, ...constructionCatalogTools];")
          replace_once(catalog,
            "  { slug: 'education', name: 'Education', description: 'Check grades and weighted academic averages with clear, reproducible arithmetic.', accent: '#7b83c5' },\n];",
            "  { slug: 'education', name: 'Education', description: 'Check grades and weighted academic averages with clear, reproducible arithmetic.', accent: '#7b83c5' },\n  { ...FILE_TOOLS_CATEGORY },\n];")

          seo = 'artifacts/calcstride/src/lib/seo.ts'
          replace_once(seo,
            "import { categoryContent } from './category-content';",
            "import { categoryContent } from './category-content';\nimport { fileToolDefinitions, isFileToolSlug } from './file-tools-catalog';")
          replace_once(seo,
            "  education: { title: 'Education Calculators | FigureNest', description: 'Calculate points-earned course percentages and weighted GPA with free academic tools that show the arithmetic and grading-scale limits.' },\n};",
            "  education: { title: 'Education Calculators | FigureNest', description: 'Calculate points-earned course percentages and weighted GPA with free academic tools that show the arithmetic and grading-scale limits.' },\n  'file-tools': { title: 'Free PDF & File Tools | Private Browser Processing | FigureNest', description: 'Edit and sign PDFs with free FigureNest file tools designed to keep document content in your browser instead of sending files to a conversion server.' },\n};")
          replace_once(seo,
            "    const construction = getConstructionTool(tool.slug);",
            "    const construction = getConstructionTool(tool.slug);\n    const fileTool = isFileToolSlug(tool.slug) ? fileToolDefinitions[tool.slug] : undefined;")
          replace_once(seo,
            "    const description = phaseFourExpansion ? phaseFourExpansion.seoDescription : phaseThreeCExpansion",
            "    const description = fileTool ? fileTool.seoDescription : phaseFourExpansion ? phaseFourExpansion.seoDescription : phaseThreeCExpansion")
          replace_once(seo,
            "        name: phaseFourExpansion?.h1 ?? phaseThreeCExpansion?.h1 ?? phaseThreeBExpansion?.h1 ?? phaseThreeAExpansion?.h1 ?? phaseTwoExpansion?.h1 ?? priorityFinance?.title ?? concreteContent?.title ?? tool.name,",
            "        name: fileTool?.h1 ?? phaseFourExpansion?.h1 ?? phaseThreeCExpansion?.h1 ?? phaseThreeBExpansion?.h1 ?? phaseThreeAExpansion?.h1 ?? phaseTwoExpansion?.h1 ?? priorityFinance?.title ?? concreteContent?.title ?? tool.name,")
          replace_once(seo,
            "         { name: phaseFourExpansion?.h1 ?? phaseThreeCExpansion?.h1 ?? phaseThreeBExpansion?.h1 ?? phaseThreeAExpansion?.h1 ?? phaseTwoExpansion?.h1 ?? priorityFinance?.title ?? concreteContent?.title ?? tool.name, path },",
            "         { name: fileTool?.h1 ?? phaseFourExpansion?.h1 ?? phaseThreeCExpansion?.h1 ?? phaseThreeBExpansion?.h1 ?? phaseThreeAExpansion?.h1 ?? phaseTwoExpansion?.h1 ?? priorityFinance?.title ?? concreteContent?.title ?? tool.name, path },")
          replace_once(seo,
            "    if (phaseFourExpansion) {\n      nodes.push({ '@type': 'FAQPage', mainEntity: phaseFourExpansion.faqs.map((faq) => ({ '@type': 'Question', name: faq.question, acceptedAnswer: { '@type': 'Answer', text: faq.answer } })) });\n    }",
            "    if (phaseFourExpansion) {\n      nodes.push({ '@type': 'FAQPage', mainEntity: phaseFourExpansion.faqs.map((faq) => ({ '@type': 'Question', name: faq.question, acceptedAnswer: { '@type': 'Answer', text: faq.answer } })) });\n    }\n    if (fileTool) {\n      nodes.push({ '@type': 'FAQPage', mainEntity: fileTool.faqs.map((faq) => ({ '@type': 'Question', name: faq.question, acceptedAnswer: { '@type': 'Answer', text: faq.answer } })) });\n    }")
          replace_once(seo,
            "       || phaseThreeCExpansion || phaseFourExpansion,",
            "       || phaseThreeCExpansion || phaseFourExpansion || fileTool,")
          replace_once(seo,
            "      title: phaseFourExpansion?.seoTitle ?? phaseThreeCExpansion?.seoTitle ?? capability?.seoTitle ?? phaseThreeBExpansion?.seoTitle",
            "      title: fileTool?.seoTitle ?? phaseFourExpansion?.seoTitle ?? phaseThreeCExpansion?.seoTitle ?? capability?.seoTitle ?? phaseThreeBExpansion?.seoTitle")
          replace_once(seo,
            "      description: phaseFourExpansion?.seoDescription ?? phaseThreeCExpansion?.seoDescription ?? capability?.seoDescription ?? phaseThreeBExpansion?.seoDescription",
            "      description: fileTool?.seoDescription ?? phaseFourExpansion?.seoDescription ?? phaseThreeCExpansion?.seoDescription ?? capability?.seoDescription ?? phaseThreeBExpansion?.seoDescription")
          replace_once(seo,
            "      h1: phaseFourExpansion?.h1 ?? phaseThreeCExpansion?.h1 ?? phaseThreeBExpansion?.h1",
            "      h1: fileTool?.h1 ?? phaseFourExpansion?.h1 ?? phaseThreeCExpansion?.h1 ?? phaseThreeBExpansion?.h1")

          api = 'artifacts/api-server/src/routes/catalog.ts'
          replace_once(api,
            'import { phaseFourRoutes } from "../../../calcstride/src/lib/phase-four-routes";',
            'import { phaseFourRoutes } from "../../../calcstride/src/lib/phase-four-routes";\nimport { FILE_TOOLS_CATEGORY, fileToolCatalog } from "../../../calcstride/src/lib/file-tools-catalog";')
          replace_once(api,
            "catalogTools.push(...phaseFourRoutes.map((entry) => ({\n  slug: entry.slug,\n  name: entry.name,\n  description: entry.description,\n  category: entry.category,\n  categorySlug: entry.categorySlug,\n  href: entry.href,\n  tags: [...entry.tags],\n  featured: false,\n  lastUpdated: CATALOG_LAST_UPDATED,\n})));",
            "catalogTools.push(...phaseFourRoutes.map((entry) => ({\n  slug: entry.slug,\n  name: entry.name,\n  description: entry.description,\n  category: entry.category,\n  categorySlug: entry.categorySlug,\n  href: entry.href,\n  tags: [...entry.tags],\n  featured: false,\n  lastUpdated: CATALOG_LAST_UPDATED,\n})));\ncatalogTools.push(...fileToolCatalog.map((entry) => ({\n  slug: entry.slug,\n  name: entry.name,\n  description: entry.description,\n  category: entry.category,\n  categorySlug: entry.categorySlug,\n  href: entry.href,\n  tags: [...entry.tags],\n  featured: entry.featured,\n  lastUpdated: CATALOG_LAST_UPDATED,\n})));" )
          replace_once(api,
            '  { slug: "education", name: "Education", description: "Check grades and weighted academic averages with clear, reproducible arithmetic.", accent: "#7b83c5" },\n].map((category) => ({',
            '  { slug: "education", name: "Education", description: "Check grades and weighted academic averages with clear, reproducible arithmetic.", accent: "#7b83c5" },\n  { ...FILE_TOOLS_CATEGORY },\n].map((category) => ({')

          category = Path('artifacts/calcstride/src/lib/category-content.ts')
          category_text = category.read_text()
          category_text = category_text.replace("'printing-design' | 'health' | 'education',", "'printing-design' | 'health' | 'education' | 'file-tools',", 1)
          file_tools_block = """  'file-tools': {
    introduction: [
      'PDF and file tasks often involve contracts, forms, invoices, IDs, or other documents that should not need to leave your device just to make a small edit. FigureNest File Tools are designed around local browser processing wherever the format can be handled reliably without uploading the document to a conversion server.',
      'PDF Sign & Edit is the first tool in this category. It renders the selected PDF in your browser, lets you place fill-and-sign items, and creates the edited download locally. Browser limits, encrypted documents, malformed files, and complex document features can still prevent a file from being processed, so keep the original copy.',
    ],
    questionsAnswered: [
      'Can I add text, initials, a date, a check mark, or a signature to a PDF without uploading the document?',
      'What file and page limits apply when editing a PDF in the browser?',
      'Why can an encrypted, malformed, or unusually complex PDF fail even when it opens elsewhere?',
      'How should I protect the original document when exporting a flattened edited copy?',
    ],
    toolDescriptions: [
      { slug: 'pdf-sign-edit', description: 'Open a PDF locally, place text, initials, dates, check marks, drawn or uploaded signatures, then export a flattened edited copy from the browser.' },
    ],
    choosingTools: [
      'Use PDF Sign & Edit when the goal is to fill or sign an existing PDF while keeping the document content in the browser. Keep a separate original file because the exported copy is flattened for dependable viewing rather than intended as a fully editable source document.',
      'If the task is conversion rather than signing, use a dedicated converter once that format is available in this category. FigureNest will distinguish reliable browser-native conversions from best-effort formats instead of implying perfect Office or PDF fidelity.',
    ],
    unitCurrencyGuidance: [
      'File tools do not use measurement or currency preferences. Security and privacy matter instead: verify the selected file type, stay within the stated device limits, keep the original document, and do not rely on a browser export as a substitute for a legally required signing platform or identity-verification process.',
      'The current PDF editor processes document bytes in the browser tab and does not send file names or document contents to FigureNest for editing. Normal page requests can still occur for the website itself, but they must not contain the selected document or its contents.',
    ],
    relatedGuides: [],
    faqs: [
      { question: 'Does FigureNest upload my PDF to edit it?', answer: 'The PDF Sign & Edit tool is designed to process the selected document in your browser rather than upload the PDF to a FigureNest conversion server.' },
      { question: 'Can I edit a password-protected PDF?', answer: 'No. Password-protected or encrypted PDFs are rejected by this release instead of asking you to send a password or document to a server.' },
      { question: 'Will the downloaded PDF remain fully editable?', answer: 'No. Added marks are flattened into the exported PDF for dependable viewing. Keep the original document if you may need to edit the source again.' },
      { question: 'Is a drawn signature the same as a verified digital signature?', answer: 'No. This tool places a visual signature mark. It does not create a certificate-backed digital signature or verify a signer’s identity.' },
    ],
  },
"""
          if "  'file-tools': {" not in category_text:
              marker = '\n};'
              idx = category_text.rfind(marker)
              if idx < 0:
                  raise SystemExit('category-content.ts: final object terminator not found')
              category_text = category_text[:idx] + '\n' + file_tools_block + category_text[idx:]
          category.write_text(category_text)

          units = 'artifacts/calcstride/src/lib/units-preferences.ts'
          replace_once(units,
            "export const toolApplicability: Record<string, ToolApplicability> = {\n  percentage:",
            "export const toolApplicability: Record<string, ToolApplicability> = {\n  'pdf-sign-edit': unitless(),\n  percentage:")

          related = 'artifacts/calcstride/src/lib/related-tools.ts'
          replace_once(related,
            "  ['dpi-ppi', 'image-scaling'],\n  ['pixels-to-cm', 'length'],",
            "  ['dpi-ppi', 'image-scaling'],\n  ['pdf-sign-edit', 'image-scaling'],\n  ['pdf-sign-edit', 'dpi-ppi'],\n  ['pdf-sign-edit', 'pixels-to-cm'],\n  ['pixels-to-cm', 'length'],")

          directory_test = 'artifacts/calcstride/src/lib/calculator-directory.test.ts'
          replace_once(directory_test,
            "test('directory destinations use valid calculator or converter route shapes', () => {\n  for (const tool of localTools) {\n    assert.match(tool.href, /^\\/(?:calculators\\/[^/]+\\/[^/]+|converters\\/[^/]+)$/);\n  }\n});",
            "test('directory destinations use valid calculator, converter, or file-tool route shapes', () => {\n  for (const tool of localTools) {\n    assert.match(tool.href, /^\\/(?:calculators\\/[^/]+\\/[^/]+|converters\\/[^/]+|file-tools\\/[^/]+)$/);\n  }\n});")

          site_test = 'artifacts/calcstride/src/lib/site-audit.test.ts'
          replace_once(site_test,
            "const expandedCategories = ['electrical', 'technology', 'science-engineering', 'health', 'education'] as const;",
            "const expandedCategories = ['electrical', 'technology', 'science-engineering', 'health', 'education', 'file-tools'] as const;")
          replace_once(site_test,
            "for (const item of localTools) { const expected = item.href.startsWith('/converters/') ? `/converters/${item.slug}` : `/calculators/${item.categorySlug}/${item.slug}`; assert.equal(item.href, expected, `${item.name} has a mismatched destination`); }",
            "for (const item of localTools) { const expected = item.href.startsWith('/converters/') ? `/converters/${item.slug}` : item.href.startsWith('/file-tools/') ? `/file-tools/${item.slug}` : `/calculators/${item.categorySlug}/${item.slug}`; assert.equal(item.href, expected, `${item.name} has a mismatched destination`); }")
          replace_once(site_test,
            "'src/pages/FinanceCalculatorPage.tsx']; const allowed",
            "'src/pages/FinanceCalculatorPage.tsx', 'src/pages/PdfSignEditPage.tsx']; const allowed")

          page = 'artifacts/calcstride/src/pages/PdfSignEditPage.tsx'
          replace_once(page,
            "import { fileToolDefinitions } from '@/lib/file-tools-catalog';",
            "import { fileToolDefinitions } from '@/lib/file-tools-catalog';\nimport { getRelatedTools } from '@/lib/related-tools';")
          replace_once(page,
            "  const deviceClass = currentDeviceClass();",
            "  const deviceClass = currentDeviceClass();\n  const relatedTools = useMemo(() => getRelatedTools('pdf-sign-edit', 3), []);")
          replace_once(page,
            "      <section className=\"file-tool-content\">\n        <article>",
            "      <section className=\"file-tool-content\">\n        <article>")
          replace_once(page,
            "      </section>\n    </main>\n  </Shell>;",
            "      </section>\n\n      <section className=\"section-block\" aria-labelledby=\"pdf-related-tools\">\n        <div className=\"section-heading\"><div><div className=\"eyebrow\">RELATED TOOLS</div><h2 id=\"pdf-related-tools\">Useful image and sizing tools.</h2></div></div>\n        <div className=\"tool-list-grid\">{relatedTools.map((tool) => <Link key={tool.slug} href={tool.href} className=\"home-article-card\"><span className=\"mono\">{tool.category}</span><h3>{tool.name}</h3><p>Open this related FigureNest tool.</p></Link>)}</div>\n      </section>\n    </main>\n  </Shell>;")

          core_test = 'artifacts/calcstride/src/lib/pdf-sign-edit-core.test.ts'
          p = Path(core_test)
          text = p.read_text()
          privacy_test = """

test('FT-02 page keeps selected document data away from network and persistence APIs', () => {
  const source = readFileSync(new URL('../pages/PdfSignEditPage.tsx', import.meta.url), 'utf8');
  for (const forbidden of ['fetch(', 'XMLHttpRequest', 'sendBeacon', 'WebSocket', 'localStorage', 'sessionStorage', 'indexedDB', 'caches.', 'console.']) {
    assert.equal(source.includes(forbidden), false, forbidden);
  }
  assert.match(source, /useWorkerFetch: false/);
  assert.match(source, /pdf\.worker\.min\.mjs\?url/);
});
"""
          if "FT-02 page keeps selected document data away" not in text:
              p.write_text(text + privacy_test)

          Path('.github/workflows/ft02-integrate-site-v2.yml').unlink(missing_ok=True)
          Path('.github/workflows/ft02-integrate-site-v3.yml').unlink(missing_ok=True)
          PY
      - name: Validate integrated release
        run: |
          pnpm exec tsc -b lib/api-client-react
          pnpm --filter @workspace/calcstride typecheck
          pnpm --filter @workspace/calcstride generate:seo
          pnpm --filter @workspace/calcstride test
          pnpm --filter @workspace/calcstride build
          pnpm --filter @workspace/api-server typecheck
      - name: Commit verified integration
        run: |
          git config user.name "FigureNest Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Integrate PDF Sign & Edit as first-class File Tool"
          git push origin HEAD:expansion/ft-02-pdf-sign-edit-core
