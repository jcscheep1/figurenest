name: Student Loan focused verification

on:
  push:
    branches: [audit/student-loan-required-blank-20260910]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace type dependency
        run: pnpm exec tsc -b lib/api-client-react

      - name: Focused Student Loan regression
        run: pnpm --filter @workspace/calcstride exec tsx --test src/lib/student-loan-validation.test.ts

      - name: Typecheck
        run: pnpm --filter @workspace/calcstride typecheck

      - name: Build
        run: pnpm --filter @workspace/calcstride build
