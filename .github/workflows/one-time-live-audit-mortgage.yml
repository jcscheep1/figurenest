name: One-time live audit Mortgage Calculator

on:
  push:
    paths:
      - '.github/workflows/one-time-live-audit-mortgage.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Selenium
        run: pip install 'selenium==4.35.0'
      - name: Audit production Mortgage behavior
        shell: python
        run: |
          import time
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.common.keys import Keys
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC

          options = webdriver.ChromeOptions()
          options.add_argument('--headless=new')
          options.add_argument('--no-sandbox')
          options.add_argument('--disable-dev-shm-usage')
          options.add_argument('--window-size=1440,1600')
          driver = webdriver.Chrome(options=options)
          wait = WebDriverWait(driver, 20)
          failures=[]

          def type_input(key,value):
              css=f'[data-testid="input-finance-{key}"]'
              el=wait.until(EC.presence_of_element_located((By.CSS_SELECTOR,css)))
              driver.execute_script('arguments[0].scrollIntoView({block:"center"})',el)
              driver.execute_script('arguments[0].focus()',el)
              el=driver.find_element(By.CSS_SELECTOR,css)
              el.send_keys(Keys.CONTROL,'a'); el.send_keys(Keys.BACKSPACE)
              if value!='': el.send_keys(value)
              el.send_keys(Keys.TAB); time.sleep(.35)

          def check(name,fn):
              try: fn(); print('PASS:',name)
              except Exception as exc: failures.append(f'{name}: {exc}'); print('FAIL:',name,exc)

          try:
              driver.get('https://figurenest.com/calculators/finance/mortgage')
              wait.until(EC.presence_of_element_located((By.CSS_SELECTOR,'[data-testid="input-finance-price"]')))
              consent=driver.find_elements(By.CSS_SELECTOR,'.consent-panel .consent-choice')
              if consent:
                  consent[0].click(); wait.until(EC.invisibility_of_element_located((By.CSS_SELECTOR,'.consent-panel')))

              def normal():
                  for k,v in [('price','360000'),('down','72000'),('rate','6.5'),('years','30'),('tax','4500'),('insurance','1800')]: type_input(k,v)
                  panel=driver.find_element(By.CSS_SELECTOR,'.advanced-result')
                  assert 'has-error' not in panel.get_attribute('class'),panel.text
                  assert '$2,345.36' in panel.text,panel.text
                  b=driver.find_element(By.CSS_SELECTOR,'.advanced-breakdown').text
                  assert '$1,820.36' in b and '$655,328.13' in b and '$367,328.13' in b,b
              check('normal mortgage with tax and insurance',normal)

              def zero_rate():
                  type_input('rate','0')
                  panel=driver.find_element(By.CSS_SELECTOR,'.advanced-result')
                  assert 'has-error' not in panel.get_attribute('class'),panel.text
                  assert '$1,325.00' in panel.text,panel.text
              check('zero-rate boundary',zero_rate)

              def blank_required():
                  for k,v in [('price','360000'),('down','72000'),('rate','6.5'),('years','30'),('tax','4500'),('insurance','1800')]: type_input(k,v)
                  type_input('rate','')
                  panel=driver.find_element(By.CSS_SELECTOR,'.advanced-result')
                  assert 'has-error' in panel.get_attribute('class'),'blank rate produced '+panel.text
              check('blank required input rejected',blank_required)

              def down_above_price():
                  type_input('rate','6.5'); type_input('price','100000'); type_input('down','100001')
                  panel=driver.find_element(By.CSS_SELECTOR,'.advanced-result')
                  assert 'has-error' in panel.get_attribute('class'),panel.text
              check('down payment above price rejected',down_above_price)

              def fractional_term():
                  type_input('price','360000'); type_input('down','72000'); type_input('years','30.01')
                  panel=driver.find_element(By.CSS_SELECTOR,'.advanced-result')
                  assert 'has-error' in panel.get_attribute('class'),'CONFIRMED DEFECT: fractional-month mortgage term accepted: '+panel.text
              check('non-month-aligned mortgage term rejected',fractional_term)

              def advanced_baseline():
                  type_input('years','30')
                  buttons=driver.find_elements(By.CSS_SELECTOR,'.calculator-mode-options button'); assert len(buttons)==2
                  driver.execute_script('arguments[0].click()',buttons[1]); time.sleep(.35)
                  body=driver.find_element(By.CSS_SELECTOR,'.decision-expansion-body')
                  assert 'Estimated all-in monthly cost' in body.text and '$2,345.36' in body.text,body.text
                  assert '30 yr 0 mo' in body.text,body.text
              check('advanced baseline matches Basic',advanced_baseline)

              if failures: raise AssertionError('\n'.join(failures))
          finally: driver.quit()
