name: One-time live verify repaired Mortgage Calculator

on:
  push:
    paths:
      - '.github/workflows/one-time-live-audit-mortgage.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Selenium
        run: pip install 'selenium==4.35.0'
      - name: Verify repaired production Mortgage behavior
        shell: python
        run: |
          import time
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.common.keys import Keys
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC

          options = webdriver.ChromeOptions()
          options.add_argument('--headless=new')
          options.add_argument('--no-sandbox')
          options.add_argument('--disable-dev-shm-usage')
          options.add_argument('--window-size=1440,1600')
          driver = webdriver.Chrome(options=options)
          wait = WebDriverWait(driver, 20)

          def type_input(key, value):
              css = f'[data-testid="input-finance-{key}"]'
              el = wait.until(EC.presence_of_element_located((By.CSS_SELECTOR, css)))
              driver.execute_script('arguments[0].scrollIntoView({block:"center"})', el)
              driver.execute_script('arguments[0].focus()', el)
              el = driver.find_element(By.CSS_SELECTOR, css)
              el.send_keys(Keys.CONTROL, 'a')
              el.send_keys(Keys.BACKSPACE)
              if value != '': el.send_keys(value)
              el.send_keys(Keys.TAB)
              time.sleep(0.35)

          def defaults():
              for key, value in [('price','360000'),('down','72000'),('rate','6.5'),('years','30'),('tax','4500'),('insurance','1800')]:
                  type_input(key, value)

          try:
              driver.get('https://figurenest.com/calculators/finance/mortgage')
              wait.until(EC.presence_of_element_located((By.CSS_SELECTOR, '[data-testid="input-finance-price"]')))
              consent = driver.find_elements(By.CSS_SELECTOR, '.consent-panel .consent-choice')
              if consent:
                  consent[0].click()
                  wait.until(EC.invisibility_of_element_located((By.CSS_SELECTOR, '.consent-panel')))

              defaults()
              panel = driver.find_element(By.CSS_SELECTOR, '.advanced-result')
              assert 'has-error' not in panel.get_attribute('class'), panel.text
              assert '$2,345.36' in panel.text, panel.text
              breakdown = driver.find_element(By.CSS_SELECTOR, '.advanced-breakdown').text
              assert '$1,820.36' in breakdown and '$655,328.13' in breakdown and '$367,328.13' in breakdown, breakdown
              print('PASS: Mortgage normal case preserved')

              type_input('rate', '0')
              panel = driver.find_element(By.CSS_SELECTOR, '.advanced-result')
              assert 'has-error' not in panel.get_attribute('class') and '$1,325.00' in panel.text, panel.text
              print('PASS: Mortgage zero-rate boundary preserved')

              defaults(); type_input('rate', '')
              panel = driver.find_element(By.CSS_SELECTOR, '.advanced-result')
              assert 'has-error' in panel.get_attribute('class'), panel.text
              print('PASS: Mortgage blank required input rejected')

              defaults(); type_input('price', '100000'); type_input('down', '100001')
              panel = driver.find_element(By.CSS_SELECTOR, '.advanced-result')
              assert 'has-error' in panel.get_attribute('class'), panel.text
              print('PASS: Mortgage down payment above price rejected')

              defaults(); type_input('years', '30.01')
              panel = driver.find_element(By.CSS_SELECTOR, '.advanced-result')
              assert 'has-error' in panel.get_attribute('class'), panel.text
              assert 'whole number of months' in panel.text.lower(), panel.text
              print('PASS: Mortgage 30.01-year non-month-aligned term rejected')

              years = driver.find_element(By.CSS_SELECTOR, '[data-testid="input-finance-years"]')
              assert years.get_attribute('step') == '0.08333333333333333', years.get_attribute('step')
              type_input('years', '30.5')
              panel = driver.find_element(By.CSS_SELECTOR, '.advanced-result')
              assert 'has-error' not in panel.get_attribute('class'), panel.text
              print('PASS: Mortgage 30.5 years / 366 months accepted and UI step is one month')

              defaults()
              buttons = driver.find_elements(By.CSS_SELECTOR, '.calculator-mode-options button')
              assert len(buttons) == 2
              driver.execute_script('arguments[0].click()', buttons[1]); time.sleep(0.35)
              body = driver.find_element(By.CSS_SELECTOR, '.decision-expansion-body')
              assert 'Estimated all-in monthly cost' in body.text and '$2,345.36' in body.text and '30 yr 0 mo' in body.text, body.text
              print('PASS: Mortgage Advanced baseline matches Basic')

              type_input('years', '30.01')
              panel = driver.find_element(By.CSS_SELECTOR, '.advanced-result')
              assert 'has-error' in panel.get_attribute('class'), panel.text
              body = driver.find_element(By.CSS_SELECTOR, '.decision-expansion-body')
              assert 'Check that fees, extra payment and balloon amount are valid.' in body.text, body.text
              print('PASS: Mortgage Advanced rejects the same non-month-aligned term')
          finally:
              driver.quit()
