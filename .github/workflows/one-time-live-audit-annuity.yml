name: One-time Annuity production audit

on:
  push:
    paths:
      - '.github/workflows/one-time-live-audit-annuity.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install selenium
      - run: python scripts/one-time-live-audit-annuity.py
      # rerun with exact valid-range result contract
