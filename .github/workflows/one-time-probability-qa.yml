name: One-time probability QA
on:
  push:
    branches: [qa/probability-boundaries-20260909]
    paths:
      - .github/workflows/one-time-probability-qa.yml
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/probability-boundaries-20260909
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Capture focused probability tests
        shell: bash
        run: |
          set +e
          pnpm --filter @workspace/calcstride exec node --import tsx --test src/lib/probability-calculator.test.ts > /tmp/probability-output.txt 2>&1
          status=$?
          echo "exit_code=$status" > QA-PROBABILITY-DIAGNOSTIC.txt
          cat /tmp/probability-output.txt >> QA-PROBABILITY-DIAGNOSTIC.txt
          exit 0
      - name: Commit diagnostic
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add QA-PROBABILITY-DIAGNOSTIC.txt
          git commit -m 'chore: record probability QA diagnostic'
          git push
