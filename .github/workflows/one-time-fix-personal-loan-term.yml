name: One-time Personal Loan term repair

on:
  push:
    branches: [audit/personal-loan-term-contract]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[personal-loan-repair]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/personal-loan-term-contract
      - name: Extend whole-month validation to Personal Loan
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('artifacts/calcstride/src/lib/priority-one-expansion.ts')
          text = path.read_text()
          old = "if(slug==='home-equity-loan'){if(n[2]<=0)"
          new = "if(slug==='home-equity-loan'||slug==='personal-loan'){if(n[2]<=0)"
          if old not in text:
              raise SystemExit('Expected Home Equity validation anchor not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/calcstride/src/lib/priority-one-expansion.ts
          git commit -m "[personal-loan-repair] Validate Personal Loan repayment term"
          git push
