name: FT-10 Publication Browser QA

on:
  pull_request:
    branches: [main]
    paths:
      - 'artifacts/calcstride/src/pages/XlsxToPdfPage.tsx'
      - 'artifacts/calcstride/src/lib/ft10-xlsx-pdf.ts'
      - 'artifacts/calcstride/src/lib/ft10-xlsx-pdf.test.ts'
      - 'artifacts/calcstride/src/lib/xlsx-zip-preflight.ts'
      - 'artifacts/calcstride/src/lib/ft09-sheetjs-loader.ts'
      - 'artifacts/calcstride/package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/ft10-publication-browser-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publication-browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Run focused FT-10 engine suites
        working-directory: artifacts/calcstride
        run: pnpm exec tsx --test src/lib/ft10-xlsx-pdf.test.ts src/lib/ft10-xlsx-pdf-spike.test.ts

      - name: Create actual-page browser harness
        working-directory: artifacts/calcstride
        run: |
          cat > ft10-publication-qa.html <<'HTML'
          <!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"></head><body><div id="root"></div><script type="module" src="/src/ft10-publication-qa.tsx"></script></body></html>
          HTML
          cat > src/ft10-publication-qa.tsx <<'TSX'
          import React from 'react';
          import { createRoot } from 'react-dom/client';
          import { XlsxToPdfPage } from '@/pages/XlsxToPdfPage';
          import { loadFt09SheetJs } from '@/lib/ft09-sheetjs-loader';

          const sentinel = 'FT10_PUBLICATION_PRIVATE_58123';
          const violations: string[] = [];
          const beforeLocal = JSON.stringify({...localStorage});
          const beforeSession = JSON.stringify({...sessionStorage});
          const originalFetch = window.fetch.bind(window);
          window.fetch = (async (input: RequestInfo | URL, init?: RequestInit) => {
            const url = input instanceof Request ? input.url : String(input);
            const body = typeof init?.body === 'string' ? init.body : '';
            if (url.includes(sentinel) || body.includes(sentinel)) violations.push('fetch-egress');
            return originalFetch(input, init);
          }) as typeof fetch;
          const OriginalXHR = window.XMLHttpRequest;
          class GuardedXHR extends OriginalXHR {
            override send(body?: Document | XMLHttpRequestBodyInit | null): void {
              if (typeof body === 'string' && body.includes(sentinel)) violations.push('xhr-egress');
              super.send(body);
            }
          }
          window.XMLHttpRequest = GuardedXHR as typeof XMLHttpRequest;
          if (navigator.sendBeacon) {
            const originalBeacon = navigator.sendBeacon.bind(navigator);
            navigator.sendBeacon = ((url: string | URL, data?: BodyInit | null) => {
              if (String(url).includes(sentinel) || (typeof data === 'string' && data.includes(sentinel))) violations.push('beacon-egress');
              return originalBeacon(url, data);
            }) as typeof navigator.sendBeacon;
          }
          const originalIndexedDbOpen = indexedDB.open.bind(indexedDB);
          indexedDB.open = ((...args: Parameters<IDBFactory['open']>) => { violations.push('indexeddb-open'); return originalIndexedDbOpen(...args); }) as IDBFactory['open'];
          const originalCacheOpen = caches.open.bind(caches);
          caches.open = (async (...args: Parameters<CacheStorage['open']>) => { violations.push('cache-open'); return originalCacheOpen(...args); }) as CacheStorage['open'];

          const waitFor = async (predicate: () => boolean, label: string, timeout = 30000) => {
            const deadline = Date.now() + timeout;
            while (Date.now() < deadline) {
              if (predicate()) return;
              await new Promise((resolve) => setTimeout(resolve, 50));
            }
            throw new Error(`Timed out waiting for ${label}`);
          };

          async function run() {
            createRoot(document.getElementById('root')!).render(<XlsxToPdfPage />);
            await waitFor(() => !!document.querySelector('input[type=file]'), 'file input');

            const XLSX = await loadFt09SheetJs();
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, XLSX.utils.aoa_to_sheet([
              ['Account', 'Description', 'Amount'],
              ['00123', sentinel, -42.5],
              ['00456', '=2+2', 125.75],
            ]), 'Printable');
            XLSX.utils.book_append_sheet(workbook, XLSX.utils.aoa_to_sheet([['second']]), 'Other');
            const raw = XLSX.write(workbook, { type: 'array', bookType: 'xlsx', compression: true }) as ArrayBuffer;
            const file = new File([raw], `private-${sentinel}.xlsx`, { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
            const input = document.querySelector<HTMLInputElement>('input[type=file]')!;
            const transfer = new DataTransfer();
            transfer.items.add(file);
            input.files = transfer.files;
            input.dispatchEvent(new Event('change', { bubbles: true }));

            await waitFor(() => document.querySelector('[data-file-job-status="ready"]') !== null, 'local workbook inspection');
            if (!document.body.innerText.includes('Printable') || !document.body.innerText.includes(sentinel)) throw new Error('actual-page preview did not expose selected workbook values');

            const selects = [...document.querySelectorAll<HTMLSelectElement>('select')];
            if (selects.length < 3) throw new Error('worksheet/orientation/page-size controls missing');
            selects[1].value = 'landscape'; selects[1].dispatchEvent(new Event('change', { bubbles: true }));
            selects[2].value = 'letter'; selects[2].dispatchEvent(new Event('change', { bubbles: true }));

            const createButton = [...document.querySelectorAll<HTMLButtonElement>('button')].find((button) => button.textContent?.includes('Create PDF'));
            if (!createButton) throw new Error('Create PDF control missing');
            createButton.click();
            await waitFor(() => document.body.innerText.includes('Your searchable PDF is ready'), 'PDF completion');
            if (!document.body.innerText.includes('Download PDF')) throw new Error('PDF download control missing');

            await new Promise((resolve) => setTimeout(resolve, 100));
            if (JSON.stringify({...localStorage}) !== beforeLocal || JSON.stringify({...sessionStorage}) !== beforeSession) violations.push('web-storage-write');
            if (violations.length) throw new Error(`privacy violations: ${violations.join(',')}`);
            document.documentElement.dataset.qa = 'pass';
            document.title = `FT10_PUBLICATION_PASS ${innerWidth}x${innerHeight}`;
          }

          run().catch((error) => {
            document.documentElement.dataset.qa = 'fail';
            document.body.dataset.error = String(error?.stack || error);
            document.title = 'FT10_PUBLICATION_FAIL';
          });
          TSX

          cat > /tmp/ft10-publication-cdp.mjs <<'JS'
          import { spawn, spawnSync } from 'node:child_process';
          const [width, height, portText] = process.argv.slice(2);
          const port = Number(portText);
          const candidates = [process.env.CHROME_BIN, 'google-chrome-stable', 'google-chrome', 'chromium', 'chromium-browser'].filter(Boolean);
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          let chromeBin = '';
          for (const candidate of candidates) {
            const probe = spawnSync('which', [candidate], { encoding: 'utf8' });
            if (probe.status === 0 && probe.stdout.trim()) { chromeBin = probe.stdout.trim(); break; }
          }
          if (!chromeBin) throw new Error('No Chrome/Chromium executable found');
          const chrome = spawn(chromeBin, ['--headless=new','--no-sandbox','--disable-gpu',`--window-size=${width},${height}`,`--remote-debugging-port=${port}`,`--user-data-dir=/tmp/ft10-publication-${port}`,'about:blank'], { stdio: ['ignore','ignore','pipe'] });
          const deadline = Date.now() + 120000;
          let socket;
          try {
            let wsUrl = '';
            for (let i = 0; i < 80 && !wsUrl; i += 1) {
              try { const targets = await fetch(`http://127.0.0.1:${port}/json/list`).then((r) => r.json()); wsUrl = targets.find((t) => t.type === 'page')?.webSocketDebuggerUrl || ''; } catch {}
              if (!wsUrl) await sleep(250);
            }
            if (!wsUrl) throw new Error('Chrome DevTools did not start');
            socket = new WebSocket(wsUrl);
            await new Promise((resolve, reject) => { socket.addEventListener('open', resolve, { once: true }); socket.addEventListener('error', reject, { once: true }); });
            let id = 0; const pending = new Map();
            socket.addEventListener('message', (event) => { const message = JSON.parse(String(event.data)); if (!message.id || !pending.has(message.id)) return; const p = pending.get(message.id); pending.delete(message.id); message.error ? p.reject(new Error(message.error.message)) : p.resolve(message.result); });
            const command = (method, params = {}) => new Promise((resolve, reject) => { const requestId = ++id; pending.set(requestId, { resolve, reject }); socket.send(JSON.stringify({ id: requestId, method, params })); });
            await command('Page.enable'); await command('Runtime.enable');
            await command('Emulation.setDeviceMetricsOverride', { width: Number(width), height: Number(height), deviceScaleFactor: 1, mobile: Number(width) <= 390 });
            await command('Page.navigate', { url: 'http://127.0.0.1:4178/ft10-publication-qa.html' });
            while (Date.now() < deadline) {
              const state = await command('Runtime.evaluate', { expression: 'document.documentElement.dataset.qa || ""', returnByValue: true });
              const value = state?.result?.value;
              if (value === 'pass') { const title = await command('Runtime.evaluate', { expression: 'document.title', returnByValue: true }); console.log(title?.result?.value); process.exitCode = 0; break; }
              if (value === 'fail') { const error = await command('Runtime.evaluate', { expression: 'document.body.dataset.error || document.body.innerText', returnByValue: true }); throw new Error(error?.result?.value || 'FT-10 publication browser gate failed'); }
              await sleep(250);
            }
            if (Date.now() >= deadline) throw new Error('Timed out waiting for FT-10 publication browser gate');
          } finally { socket?.close(); chrome.kill('SIGTERM'); }
          JS

      - name: Start Vite publication harness
        working-directory: artifacts/calcstride
        run: |
          pnpm exec vite --host 127.0.0.1 --port 4178 > /tmp/ft10-publication-vite.log 2>&1 &
          for i in {1..40}; do curl -fsS http://127.0.0.1:4178/ft10-publication-qa.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/ft10-publication-vite.log; exit 1

      - name: Desktop actual-page publication gate
        run: node /tmp/ft10-publication-cdp.mjs 1440 1200 9272

      - name: Mobile 390x844 actual-page publication gate
        run: node /tmp/ft10-publication-cdp.mjs 390 844 9273

      - name: Keep public wiring closed until publication commit
        working-directory: artifacts/calcstride
        run: |
          if grep -R -n "xlsx-to-pdf" src --exclude='*.test.ts' --exclude='XlsxToPdfPage.tsx' --exclude='ft10-publication-qa.tsx' --exclude='ft10-browser-qa.ts'; then
            echo 'FT-10 public wiring detected before publication commit'; exit 1
          fi
          pnpm run build
