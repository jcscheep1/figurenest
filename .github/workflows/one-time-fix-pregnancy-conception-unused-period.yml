name: One-time Pregnancy Conception input repair

on:
  push:
    branches:
      - audit/pregnancy-conception-unused-period
    paths:
      - '.github/workflows/one-time-fix-pregnancy-conception-unused-period.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply guarded Pregnancy Conception repair
        run: python scripts/one-time-fix-pregnancy-conception-unused-period.py
      - name: Build workspace type dependency
        run: pnpm exec tsc -b lib/api-client-react
      - name: Run focused regression
        run: pnpm --filter @workspace/calcstride test -- pregnancy-conception-input-contract-regression.test.ts
      - name: Typecheck calculator app
        run: pnpm --filter @workspace/calcstride typecheck
      - name: Build calculator app
        run: pnpm --filter @workspace/calcstride build
      - name: Remove one-time repair scaffolding
        run: rm scripts/one-time-fix-pregnancy-conception-unused-period.py .github/workflows/one-time-fix-pregnancy-conception-unused-period.yml
      - name: Commit passing Pregnancy Conception repair
        run: |
          git config user.name 'FigureNest Repair Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Remove unused Pregnancy Conception period-length input [skip ci]'
          git push origin HEAD:audit/pregnancy-conception-unused-period
