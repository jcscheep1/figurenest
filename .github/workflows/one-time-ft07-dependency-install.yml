name: One-time FT-07 dependency install

on:
  push:
    paths:
      - '.github/workflows/one-time-ft07-dependency-install.yml'

permissions:
  contents: write

jobs:
  install-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/ft-07-docx-pdf-gate
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install existing workspace
        run: pnpm install --frozen-lockfile
      - name: Add exact FT-07 route-lazy candidates
        run: pnpm --filter @workspace/calcstride add mammoth@1.12.2 dompurify@3.4.15 jspdf@4.2.1 html2canvas@1.4.1 --save-exact
      - name: Verify exact pins
        run: |
          node - <<'NODE'
          const p = require('./artifacts/calcstride/package.json');
          const expected = {
            mammoth: '1.12.2',
            dompurify: '3.4.15',
            jspdf: '4.2.1',
            html2canvas: '1.4.1',
          };
          for (const [name, version] of Object.entries(expected)) {
            if (p.dependencies?.[name] !== version) throw new Error(`${name} expected ${version}, got ${p.dependencies?.[name]}`);
          }
          NODE
      - name: Run FT-07 hostile package tests
        run: pnpm --filter @workspace/calcstride exec tsx --test src/lib/docx-package-preflight.test.ts
      - name: Typecheck
        run: pnpm --filter @workspace/calcstride typecheck
      - name: Build
        run: pnpm --filter @workspace/calcstride build
      - name: Commit verified lockfile and remove one-time workflow
        run: |
          git config user.name 'FigureNest Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/one-time-ft07-dependency-install.yml
          git add artifacts/calcstride/package.json pnpm-lock.yaml
          git diff --cached --quiet && exit 0
          git commit -m 'Pin FT-07 DOCX to PDF spike dependencies'
          git push origin HEAD:expansion/ft-07-docx-pdf-gate
