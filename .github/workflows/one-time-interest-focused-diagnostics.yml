name: One-time Interest focused diagnostics

on:
  push:
    branches:
      - fix/interest-intent-consolidation

permissions:
  contents: write

jobs:
  diagnose:
    if: ${{ !contains(github.event.head_commit.message, '[interest-focused-diagnostics]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/interest-intent-consolidation
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc -b lib/api-client-react
      - name: Capture focused assertion
        shell: bash
        run: |
          set +e
          cd artifacts/calcstride
          pnpm exec tsx --test src/lib/interest-intent-consolidation.test.ts > ../../interest-focused-output.txt 2>&1
          echo "exit_status=$?" >> ../../interest-focused-output.txt
          cd ../..
          rm .github/workflows/one-time-interest-focused-diagnostics.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Capture focused Interest assertion [interest-focused-diagnostics]"
          git push origin HEAD:fix/interest-intent-consolidation
