name: Validate FigureNest

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace type dependency
        run: pnpm exec tsc -b lib/api-client-react

      - name: Typecheck
        run: pnpm --filter @workspace/calcstride typecheck

      - name: Generate SEO files
        run: pnpm --filter @workspace/calcstride generate:seo

      - name: Unit tests
        run: pnpm --filter @workspace/calcstride test

      - name: Build
        run: pnpm --filter @workspace/calcstride build

      - name: Audit production robots and sitemap
        if: github.event_name == 'workflow_dispatch'
        run: pnpm --filter @workspace/calcstride exec tsx scripts/audit-production-indexing.ts
