name: FT-07 Browser Publication Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'artifacts/calcstride/src/lib/docx-**'
      - 'artifacts/calcstride/src/workers/docx-**'
      - 'artifacts/calcstride/package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/ft07-browser-publication.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-publication:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create branch-only browser harness
        working-directory: artifacts/calcstride
        run: |
          cat > docx-qa.html <<'HTML'
          <!doctype html><html><body><main id="app"></main><script type="module" src="/src/docx-qa.ts"></script></body></html>
          HTML
          cat > src/docx-qa.ts <<'TS'
          import { DOCX_PUBLICATION_FIXTURES } from './lib/docx-publication-fixtures';
          import { convertDocxToSanitizedHtml, exportSanitizedPreviewToPdf } from './lib/docx-to-pdf-spike';
          import * as pdfjs from 'pdfjs-dist/legacy/build/pdf.mjs';
          import pdfWorkerUrl from 'pdfjs-dist/legacy/build/pdf.worker.min.mjs?url';

          pdfjs.GlobalWorkerOptions.workerSrc = pdfWorkerUrl;
          const app = document.querySelector<HTMLElement>('#app')!;
          const mode = new URLSearchParams(location.search).get('mode') === 'mobile' ? 'mobile' : 'desktop';
          const sentinel = 'FT07_SENTINEL_FILE_NAME_7391';
          const violations: string[] = [];
          const originalFetch = window.fetch.bind(window);
          window.fetch = (async (input: RequestInfo | URL, init?: RequestInit) => {
            const request = input instanceof Request ? input : null;
            const requestUrl = request?.url ?? String(input);
            const requestMethod = (init?.method ?? request?.method ?? 'GET').toUpperCase();
            const requestOrigin = new URL(requestUrl, location.href).origin;
            if (requestOrigin !== location.origin || requestMethod !== 'GET' || init?.body != null) violations.push(`fetch:${requestMethod}:${requestUrl}`);
            return originalFetch(input, init);
          }) as typeof fetch;
          const OriginalXHR = window.XMLHttpRequest;
          class GuardedXHR extends OriginalXHR {
            override send(body?: Document | XMLHttpRequestBodyInit | null): void {
              if (body != null) violations.push('xhr-body');
              super.send(body);
            }
          }
          window.XMLHttpRequest = GuardedXHR as typeof XMLHttpRequest;
          const originalBeacon = navigator.sendBeacon?.bind(navigator);
          if (originalBeacon) navigator.sendBeacon = ((url: string | URL, data?: BodyInit | null) => {
            violations.push(`beacon:${String(url)}`);
            return originalBeacon(url, data);
          }) as typeof navigator.sendBeacon;
          const originalSocketSend = WebSocket.prototype.send;
          WebSocket.prototype.send = function(data: string | ArrayBufferLike | Blob | ArrayBufferView) {
            if (typeof data !== 'string' || data.includes(sentinel)) violations.push('websocket-file-send');
            return originalSocketSend.call(this, data);
          };
          const originalIndexedDbOpen = indexedDB.open.bind(indexedDB);
          indexedDB.open = ((...args: Parameters<IDBFactory['open']>) => {
            violations.push('indexeddb-open');
            return originalIndexedDbOpen(...args);
          }) as IDBFactory['open'];
          addEventListener('submit', () => violations.push('form-submit'), {capture: true});
          const storageSnapshot = () => `${JSON.stringify({...localStorage})}${JSON.stringify({...sessionStorage})}`;

          async function run() {
            const beforeStorage = storageSnapshot();
            const results: string[] = [];
            for (const fixture of DOCX_PUBLICATION_FIXTURES) {
              const startedAt = performance.now();
              const file = new File([fixture.bytes], `${sentinel}-${fixture.id}.docx`, {type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
              const converted = await convertDocxToSanitizedHtml(file, mode);
              const preview = document.createElement('article');
              preview.style.width = mode === 'mobile' ? '360px' : '760px';
              preview.innerHTML = converted.html;
              document.body.append(preview);
              try {
                for (const expected of fixture.expectedText) if (!preview.textContent?.includes(expected)) throw new Error(`${fixture.id} missing ${expected}`);
                const pdfBlob = await exportSanitizedPreviewToPdf(preview);
                const pdfBytes = new Uint8Array(await pdfBlob.arrayBuffer());
                if (pdfBytes.length < 100 || String.fromCharCode(...pdfBytes.slice(0,5)) !== '%PDF-') throw new Error(`${fixture.id} invalid PDF`);
                const loadingTask = pdfjs.getDocument({data: pdfBytes, disableWorker: true});
                const opened = await loadingTask.promise;
                if (opened.numPages < 1) throw new Error(`${fixture.id} reopen failed`);
                results.push(`${fixture.id}:${opened.numPages}p:${pdfBytes.length}b:${Math.round(performance.now() - startedAt)}ms`);
                await loadingTask.destroy();
              } finally {
                preview.remove();
              }
            }
            const afterStorage = storageSnapshot();
            if (beforeStorage !== afterStorage || afterStorage.includes(sentinel)) violations.push('storage');
            if (violations.length) throw new Error(`privacy violations: ${violations.join(',')}`);
            app.textContent = `FT07_BROWSER_PASS ${mode} ${results.join(' ')}`;
            document.documentElement.dataset.qa = 'pass';
          }
          run().catch((error) => { app.textContent = `FT07_BROWSER_FAIL ${mode} ${error?.stack || error}`; document.documentElement.dataset.qa = 'fail'; });
          TS
          cat > /tmp/ft07-cdp-runner.mjs <<'JS'
          import { spawn, spawnSync } from 'node:child_process';
          const [mode, width, height, portText] = process.argv.slice(2);
          const port = Number(portText);
          const candidates = [process.env.CHROME_BIN, 'google-chrome-stable', 'google-chrome', 'chromium', 'chromium-browser'].filter(Boolean);
          let chromeBin = '';
          for (const candidate of candidates) {
            const probe = spawnSync('which', [candidate], {encoding: 'utf8'});
            if (probe.status === 0 && probe.stdout.trim()) {
              chromeBin = probe.stdout.trim();
              break;
            }
          }
          if (!chromeBin) throw new Error(`No Chrome/Chromium executable found. Tried: ${candidates.join(', ')}`);
          console.log(`FT07_BROWSER_CHROME ${chromeBin}`);
          const chrome = spawn(chromeBin, [
            '--headless=new', '--no-sandbox', '--disable-gpu',
            `--window-size=${width},${height}`,
            `--remote-debugging-port=${port}`,
            `--user-data-dir=/tmp/ft07-chrome-${mode}`,
            'about:blank',
          ], {stdio: ['ignore', 'ignore', 'pipe']});
          let diagnostics = '';
          chrome.stderr.on('data', (chunk) => { diagnostics += String(chunk); });
          chrome.on('error', (error) => { diagnostics += `spawn-error:${error.stack || error}`; });
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          async function connect() {
            for (let attempt = 0; attempt < 60; attempt += 1) {
              try {
                const targets = await fetch(`http://127.0.0.1:${port}/json/list`).then((response) => response.json());
                const target = targets.find((candidate) => candidate.type === 'page');
                if (target?.webSocketDebuggerUrl) return new WebSocket(target.webSocketDebuggerUrl);
              } catch {}
              await sleep(250);
            }
            throw new Error(`Chrome DevTools did not start using ${chromeBin}. ${diagnostics}`);
          }
          let socket;
          try {
            socket = await connect();
            await new Promise((resolve, reject) => {
              socket.addEventListener('open', resolve, {once: true});
              socket.addEventListener('error', reject, {once: true});
            });
            let sequence = 0;
            const pending = new Map();
            socket.addEventListener('message', (event) => {
              const message = JSON.parse(String(event.data));
              if (!message.id || !pending.has(message.id)) return;
              const {resolve, reject} = pending.get(message.id);
              pending.delete(message.id);
              if (message.error) reject(new Error(message.error.message));
              else resolve(message.result);
            });
            const command = (method, params = {}) => new Promise((resolve, reject) => {
              const id = ++sequence;
              pending.set(id, {resolve, reject});
              socket.send(JSON.stringify({id, method, params}));
            });
            await command('Page.enable');
            await command('Runtime.enable');
            await command('Page.navigate', {url: `http://127.0.0.1:4173/docx-qa.html?mode=${mode}`});
            const deadline = Date.now() + 120_000;
            let completed = false;
            while (Date.now() < deadline) {
              let state;
              try {
                state = await command('Runtime.evaluate', {expression: 'document.documentElement.dataset.qa || ""', returnByValue: true});
              } catch {
                await sleep(250);
                continue;
              }
              const value = state?.result?.value;
              if (value === 'pass' || value === 'fail') {
                const body = await command('Runtime.evaluate', {expression: 'document.body.innerText', returnByValue: true});
                const output = body?.result?.value ?? '';
                console.log(output);
                if (value === 'fail') throw new Error(output);
                completed = true;
                break;
              }
              await sleep(250);
            }
            if (!completed) throw new Error(`Timed out waiting for FT07 browser ${mode} result. ${diagnostics}`);
          } finally {
            socket?.close();
            chrome.kill('SIGTERM');
          }
          JS
      - name: Start Vite harness
        working-directory: artifacts/calcstride
        run: |
          pnpm exec vite --host 127.0.0.1 --port 4173 > /tmp/ft07-vite.log 2>&1 &
          echo $! > /tmp/ft07-vite.pid
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/docx-qa.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/ft07-vite.log; exit 1
      - name: Desktop fixtures → sanitized preview → PDF → reopen + privacy
        run: node /tmp/ft07-cdp-runner.mjs desktop 1440 1200 9222
      - name: Mobile fixtures → sanitized preview → PDF → reopen + privacy
        run: node /tmp/ft07-cdp-runner.mjs mobile 390 844 9223
      - name: Record bundle evidence
        working-directory: artifacts/calcstride
        run: |
          pnpm run build:client
          echo 'Largest DOCX-related chunks:'
          find dist -type f -name '*.js' -printf '%s %p\n' | sort -nr | head -20
