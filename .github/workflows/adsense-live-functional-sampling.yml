name: AdSense Live Functional Sampling

on:
  pull_request:
    branches: [main]
    paths:
      - 'artifacts/calcstride/**'
      - 'scripts/adsense-live-functional-sampling.mjs'
      - 'scripts/adsense-cross-cluster-functional-sampling.mjs'
      - '.github/workflows/adsense-live-functional-sampling.yml'
      - 'docs/adsense/LIVE_FUNCTIONAL_SAMPLING.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop-mobile-sampling:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc -b lib/api-client-react
      - run: pnpm --filter @workspace/calcstride build
      - name: Start production server
        working-directory: artifacts/calcstride
        run: |
          PORT=4177 pnpm run serve:production > /tmp/adsense-live-server.log 2>&1 &
          for i in {1..60}; do curl -fsS http://127.0.0.1:4177/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/adsense-live-server.log
          exit 1
      - name: Desktop cross-cluster sampling
        id: cross_desktop
        shell: bash
        run: |
          set -o pipefail
          for attempt in 1 2; do
            rm -rf /tmp/figurenest-adsense-cross-cluster-desktop
            node scripts/adsense-cross-cluster-functional-sampling.mjs desktop 1440 1200 9260 2>&1 | tee /tmp/adsense-cross-desktop.log && exit 0
            if grep -q 'Chrome DevTools did not start' /tmp/adsense-cross-desktop.log && [ "$attempt" -lt 2 ]; then
              echo 'Chrome startup failed before QA; retrying desktop cross-cluster sampler once.'
              sleep 2
              continue
            fi
            exit 1
          done
      - name: Mobile cross-cluster sampling
        id: cross_mobile
        if: always()
        shell: bash
        run: |
          set -o pipefail
          for attempt in 1 2; do
            rm -rf /tmp/figurenest-adsense-cross-cluster-mobile
            node scripts/adsense-cross-cluster-functional-sampling.mjs mobile 390 844 9261 2>&1 | tee /tmp/adsense-cross-mobile.log && exit 0
            if grep -q 'Chrome DevTools did not start' /tmp/adsense-cross-mobile.log && [ "$attempt" -lt 2 ]; then
              echo 'Chrome startup failed before QA; retrying mobile cross-cluster sampler once.'
              sleep 2
              continue
            fi
            exit 1
          done
      - name: Desktop 1440x1200 sampling
        id: broad_desktop
        if: always()
        shell: bash
        run: |
          set -o pipefail
          for attempt in 1 2; do
            rm -rf /tmp/figurenest-adsense-desktop
            node scripts/adsense-live-functional-sampling.mjs desktop 1440 1200 9250 2>&1 | tee /tmp/adsense-broad-desktop.log && exit 0
            if grep -q 'Chrome DevTools did not start' /tmp/adsense-broad-desktop.log && [ "$attempt" -lt 2 ]; then
              echo 'Chrome startup failed before QA; retrying broad desktop sampler once.'
              sleep 2
              continue
            fi
            exit 1
          done
      - name: Mobile 390x844 sampling
        id: broad_mobile
        if: always()
        shell: bash
        run: |
          set -o pipefail
          for attempt in 1 2; do
            rm -rf /tmp/figurenest-adsense-mobile
            node scripts/adsense-live-functional-sampling.mjs mobile 390 844 9251 2>&1 | tee /tmp/adsense-broad-mobile.log && exit 0
            if grep -q 'Chrome DevTools did not start' /tmp/adsense-broad-mobile.log && [ "$attempt" -lt 2 ]; then
              echo 'Chrome startup failed before QA; retrying broad mobile sampler once.'
              sleep 2
              continue
            fi
            exit 1
          done
      - name: Preserve cross-cluster diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adsense-cross-cluster-diagnostics-${{ github.run_id }}
          path: |
            /tmp/adsense-cross-desktop.log
            /tmp/adsense-cross-mobile.log
            /tmp/adsense-broad-desktop.log
            /tmp/adsense-broad-mobile.log
            /tmp/adsense-live-server.log
          if-no-files-found: warn
          retention-days: 7
      - name: Report complete functional sampling gate
        if: always()
        run: |
          echo "cross-desktop=${{ steps.cross_desktop.outcome }}"
          echo "cross-mobile=${{ steps.cross_mobile.outcome }}"
          echo "broad-desktop=${{ steps.broad_desktop.outcome }}"
          echo "broad-mobile=${{ steps.broad_mobile.outcome }}"
          echo "GitHub Actions will fail this job natively if any sampler step failed."
