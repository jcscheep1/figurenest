name: FT-09 Browser Research QA

on:
  pull_request:
    branches: [main]
    paths:
      - 'artifacts/calcstride/src/lib/ft09-sheetjs-loader.ts'
      - 'artifacts/calcstride/src/lib/ft09-sheetjs-loader.test.ts'
      - 'artifacts/calcstride/src/lib/ft09-sheetjs-research.test.ts'
      - 'artifacts/calcstride/src/lib/csv-spreadsheet-safety.ts'
      - 'artifacts/calcstride/src/lib/xlsx-zip-preflight.ts'
      - 'artifacts/calcstride/package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/ft09-browser-research-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-research-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Create FT-09 browser research harness
        working-directory: artifacts/calcstride
        run: |
          cat > ft09-browser-qa.html <<'HTML'
          <!doctype html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"></head><body><main id="app">FT09 starting</main><script type="module" src="/src/ft09-browser-qa.ts"></script></body></html>
          HTML

          cat > src/ft09-browser-qa.ts <<'TS'
          import { loadFt09SheetJs } from '@/lib/ft09-sheetjs-loader';
          import { quoteCsvCell } from '@/lib/csv-spreadsheet-safety';
          import { preflightXlsxZip } from '@/lib/xlsx-zip-preflight';

          const app = document.querySelector<HTMLElement>('#app')!;
          const mode = new URLSearchParams(location.search).get('mode') === 'mobile' ? 'mobile' : 'desktop';
          const sentinel = 'FT09_PRIVATE_SENTINEL_8421';
          const violations: string[] = [];
          const beforeStorage = `${JSON.stringify({...localStorage})}${JSON.stringify({...sessionStorage})}`;

          const containsSentinel = async (value: unknown): Promise<boolean> => {
            if (value == null) return false;
            if (typeof value === 'string') return value.includes(sentinel);
            if (value instanceof URLSearchParams) return value.toString().includes(sentinel);
            if (value instanceof FormData) {
              for (const [, item] of value.entries()) {
                if (typeof item === 'string' && item.includes(sentinel)) return true;
                if (item instanceof File && item.name.includes(sentinel)) return true;
              }
              return false;
            }
            if (value instanceof Blob) return (await value.text()).includes(sentinel);
            if (value instanceof ArrayBuffer) return new TextDecoder().decode(value).includes(sentinel);
            if (ArrayBuffer.isView(value)) return new TextDecoder().decode(value as ArrayBufferView<ArrayBuffer>).includes(sentinel);
            return false;
          };

          const originalFetch = window.fetch.bind(window);
          window.fetch = (async (input: RequestInfo | URL, init?: RequestInit) => {
            const request = input instanceof Request ? input : null;
            const url = request?.url ?? String(input);
            if (url.includes(sentinel) || await containsSentinel(init?.body)) violations.push(`fetch-document-egress:${url}`);
            return originalFetch(input, init);
          }) as typeof fetch;

          const OriginalXHR = window.XMLHttpRequest;
          class GuardedXHR extends OriginalXHR {
            override send(body?: Document | XMLHttpRequestBodyInit | null): void {
              void containsSentinel(body).then((found) => { if (found) violations.push('xhr-document-egress'); });
              super.send(body);
            }
          }
          window.XMLHttpRequest = GuardedXHR as typeof XMLHttpRequest;

          if (navigator.sendBeacon) {
            const originalBeacon = navigator.sendBeacon.bind(navigator);
            navigator.sendBeacon = ((url: string | URL, data?: BodyInit | null) => {
              void containsSentinel(data).then((found) => { if (String(url).includes(sentinel) || found) violations.push('beacon-document-egress'); });
              return originalBeacon(url, data);
            }) as typeof navigator.sendBeacon;
          }

          const originalSocketSend = WebSocket.prototype.send;
          WebSocket.prototype.send = function(data: string | ArrayBufferLike | Blob | ArrayBufferView) {
            void containsSentinel(data).then((found) => { if (found) violations.push('websocket-document-egress'); });
            return originalSocketSend.call(this, data);
          };

          const originalIndexedDbOpen = indexedDB.open.bind(indexedDB);
          indexedDB.open = ((...args: Parameters<IDBFactory['open']>) => {
            violations.push('indexeddb-open-during-conversion');
            return originalIndexedDbOpen(...args);
          }) as IDBFactory['open'];
          const originalCacheOpen = caches.open.bind(caches);
          caches.open = (async (...args: Parameters<CacheStorage['open']>) => {
            violations.push('cache-open-during-conversion');
            return originalCacheOpen(...args);
          }) as CacheStorage['open'];

          const isXlsxDependencyResource = (name: string): boolean => {
            const path = new URL(name, location.href).pathname;
            return path.includes('/node_modules/.vite/deps/xlsx')
              || /\/node_modules\/xlsx(?:\/|$)/i.test(path)
              || /\/node_modules\/\.pnpm\/xlsx@/i.test(path);
          };
          const xlsxResources = () => performance.getEntriesByType('resource')
            .map((entry) => entry.name)
            .filter(isXlsxDependencyResource);

          async function run() {
            const started = performance.now();
            await new Promise((resolve) => setTimeout(resolve, 100));
            const beforeLazy = xlsxResources();
            if (beforeLazy.length) throw new Error(`SheetJS dependency loaded before FT-09 loader invocation: ${beforeLazy.join(',')}`);

            const XLSX = await loadFt09SheetJs();
            await new Promise((resolve) => setTimeout(resolve, 50));
            const afterLazy = xlsxResources();
            if (!afterLazy.length) throw new Error('No lazy SheetJS dependency resource observed after loader invocation');

            const sourceRows = [
              ['id', 'name', 'payload', 'negative'],
              ['00123', 'Zoë', sentinel, '-1'],
              ['00456', '李', '=2+2', '-0.25'],
              ['00789', 'Line one\nLine two', '+SUM(A1:A2)', '-1e6'],
            ];
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, XLSX.utils.aoa_to_sheet(sourceRows), 'Data');
            const xlsxBytes = XLSX.write(workbook, { type: 'array', bookType: 'xlsx', compression: true }) as ArrayBuffer;
            const bytes = new Uint8Array(xlsxBytes);

            const zip = preflightXlsxZip(bytes);
            if (!zip.ok) throw new Error(`generated XLSX failed ZIP preflight: ${zip.reason}`);
            const forcedReject = preflightXlsxZip(bytes, {
              maxEntries: 1,
              maxCompressedBytes: bytes.length + 1,
              maxUncompressedBytes: 1,
              maxEntryUncompressedBytes: 1,
              maxCompressionRatio: 1,
            });
            if (forcedReject.ok) throw new Error('hostile/resource-limit ZIP fixture did not fail closed');

            const reopened = XLSX.read(bytes, { type: 'array', raw: true, cellFormula: true });
            if (reopened.Sheets.Data.C3?.f !== undefined) throw new Error('formula-looking text became an executable formula');
            const reopenedRows = XLSX.utils.sheet_to_json<unknown[]>(reopened.Sheets.Data, { header: 1, raw: true, defval: '' });
            if (reopenedRows[1]?.[0] !== '00123' || reopenedRows[1]?.[2] !== sentinel) throw new Error('round-trip value preservation failed');

            const csv = reopenedRows.map((row) => row.map(quoteCsvCell).join(',')).join('\r\n');
            if (!csv.includes("'=2+2") || !csv.includes("'+SUM(A1:A2)") || !csv.includes(',-1\r\n') || !csv.includes(',-0.25\r\n')) {
              throw new Error('CSV formula-injection or negative-number safety contract failed');
            }

            await new Promise((resolve) => setTimeout(resolve, 50));
            const afterStorage = `${JSON.stringify({...localStorage})}${JSON.stringify({...sessionStorage})}`;
            if (afterStorage !== beforeStorage || afterStorage.includes(sentinel)) violations.push('web-storage-document-persistence');
            if (violations.length) throw new Error(`privacy violations: ${violations.join(',')}`);

            app.textContent = `FT09_BROWSER_RESEARCH_PASS ${mode} ${bytes.length}xlsx ${zip.entries}entries ${zip.uncompressedBytes}unzipped ${afterLazy.length}lazyResources ${Math.round(performance.now() - started)}ms ${innerWidth}x${innerHeight}`;
            document.documentElement.dataset.qa = 'pass';
          }

          run().catch((error) => {
            app.textContent = `FT09_BROWSER_RESEARCH_FAIL ${mode} ${error?.stack || error}`;
            document.documentElement.dataset.qa = 'fail';
          });
          TS

          cat > /tmp/ft09-browser-cdp.mjs <<'JS'
          import { spawn, spawnSync } from 'node:child_process';
          const [mode, width, height, portText] = process.argv.slice(2);
          const port = Number(portText);
          const candidates = [process.env.CHROME_BIN, 'google-chrome-stable', 'google-chrome', 'chromium', 'chromium-browser'].filter(Boolean);
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          async function main() {
            let chromeBin = '';
            for (const candidate of candidates) {
              const probe = spawnSync('which', [candidate], { encoding: 'utf8' });
              if (probe.status === 0 && probe.stdout.trim()) { chromeBin = probe.stdout.trim(); break; }
            }
            if (!chromeBin) throw new Error('No Chrome/Chromium executable found');
            const chrome = spawn(chromeBin, ['--headless=new', '--no-sandbox', '--disable-gpu', `--window-size=${width},${height}`, `--remote-debugging-port=${port}`, `--user-data-dir=/tmp/ft09-browser-${mode}`, 'about:blank'], { stdio: ['ignore', 'ignore', 'pipe'] });
            let diagnostics = '';
            chrome.stderr.on('data', (chunk) => { diagnostics += String(chunk); });
            async function targetSocket() {
              for (let attempt = 0; attempt < 80; attempt += 1) {
                try {
                  const targets = await fetch(`http://127.0.0.1:${port}/json/list`).then((response) => response.json());
                  const target = targets.find((item) => item.type === 'page');
                  if (target?.webSocketDebuggerUrl) return new WebSocket(target.webSocketDebuggerUrl);
                } catch {}
                await sleep(250);
              }
              throw new Error(`Chrome DevTools did not start. ${diagnostics}`);
            }
            let socket;
            try {
              socket = await targetSocket();
              await new Promise((resolve, reject) => { socket.addEventListener('open', resolve, { once: true }); socket.addEventListener('error', reject, { once: true }); });
              let id = 0;
              const pending = new Map();
              socket.addEventListener('message', (event) => {
                const message = JSON.parse(String(event.data));
                if (!message.id || !pending.has(message.id)) return;
                const handlers = pending.get(message.id); pending.delete(message.id);
                if (message.error) handlers.reject(new Error(message.error.message)); else handlers.resolve(message.result);
              });
              const command = (method, params = {}) => new Promise((resolve, reject) => { const requestId = ++id; pending.set(requestId, { resolve, reject }); socket.send(JSON.stringify({ id: requestId, method, params })); });
              await command('Page.enable');
              await command('Runtime.enable');
              await command('Emulation.setDeviceMetricsOverride', { width: Number(width), height: Number(height), deviceScaleFactor: 1, mobile: mode === 'mobile' });
              await command('Page.navigate', { url: `http://127.0.0.1:4176/ft09-browser-qa.html?mode=${mode}` });
              const deadline = Date.now() + 180_000;
              while (Date.now() < deadline) {
                const state = await command('Runtime.evaluate', { expression: 'document.documentElement.dataset.qa || ""', returnByValue: true });
                const value = state?.result?.value;
                if (value === 'pass' || value === 'fail') {
                  const body = await command('Runtime.evaluate', { expression: 'document.body.innerText', returnByValue: true });
                  console.log(body?.result?.value ?? '');
                  if (value === 'fail') throw new Error(body?.result?.value ?? 'FT-09 browser research gate failed');
                  return;
                }
                await sleep(250);
              }
              throw new Error(`Timed out waiting for FT-09 ${mode}. ${diagnostics}`);
            } finally {
              socket?.close();
              chrome.kill('SIGTERM');
            }
          }
          main().catch((error) => { console.error(error); process.exitCode = 1; });
          JS

      - name: Start Vite harness
        working-directory: artifacts/calcstride
        run: |
          pnpm exec vite --host 127.0.0.1 --port 4176 > /tmp/ft09-browser-vite.log 2>&1 &
          for i in {1..40}; do curl -fsS http://127.0.0.1:4176/ft09-browser-qa.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/ft09-browser-vite.log; exit 1

      - name: Desktop lazy-load, privacy and resource research gate
        run: node /tmp/ft09-browser-cdp.mjs desktop 1440 1200 9252

      - name: Mobile 390x844 lazy-load, privacy and resource research gate
        run: node /tmp/ft09-browser-cdp.mjs mobile 390 844 9253

      - name: Verify loader stays dynamic and production build remains green
        working-directory: artifacts/calcstride
        run: |
          grep -F "import('xlsx')" src/lib/ft09-sheetjs-loader.ts
          if grep -R -n -E "^import .* from ['\"]xlsx['\"]|^import ['\"]xlsx['\"]" src --exclude='*.test.ts' --exclude='ft09-browser-qa.ts'; then
            echo 'Static production SheetJS import detected'; exit 1
          fi
          pnpm run build
          find dist -type f -printf '%s %p\n' | sort -nr | head -30
