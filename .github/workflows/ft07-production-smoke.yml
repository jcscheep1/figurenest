name: FT-07 Production Smoke
on:
  push:
    branches: [expansion/ft-08-pdf-docx-research]
    paths: ['.github/workflows/ft07-production-smoke.yml']
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - name: Wait for production edge convergence
        run: sleep 5
      - name: Verify production routes, SEO and crawl surfaces
        shell: bash
        run: |
          set -euo pipefail
          fetch() { curl --fail --silent --show-error --location --retry 3 --retry-delay 2 "$1"; }
          home="$(fetch https://figurenest.com/)"
          docx="$(fetch https://figurenest.com/file-tools/docx-to-pdf/)"
          pdftext="$(fetch https://figurenest.com/file-tools/pdf-to-text/)"
          pct="$(fetch https://figurenest.com/calculators/finance/percentage/)"
          robots="$(fetch https://figurenest.com/robots.txt)"
          sitemap="$(fetch https://figurenest.com/sitemap.xml)"

          grep -Fqi 'FigureNest' <<<"$home"
          grep -Fqi 'Convert DOCX to PDF' <<<"$docx"
          grep -Fqi 'application/ld+json' <<<"$docx"
          grep -Fqi 'canonical' <<<"$docx"
          grep -Fqi 'PDF to Text' <<<"$pdftext"
          grep -Fqi 'Percentage' <<<"$pct"
          grep -Fqi 'sitemap' <<<"$robots"
          grep -Fq 'https://figurenest.com/file-tools/docx-to-pdf/' <<<"$sitemap"
          grep -Fq 'https://figurenest.com/file-tools/pdf-to-text/' <<<"$sitemap"
          grep -Fq 'https://figurenest.com/calculators/finance/percentage/' <<<"$sitemap"

          echo 'Production smoke PASS: homepage, FT-07, existing PDF tool, representative calculator, robots, sitemap, canonical marker and schema marker all verified.'
