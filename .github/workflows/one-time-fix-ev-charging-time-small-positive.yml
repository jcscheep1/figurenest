name: One-time EV Charging Time precision repair

on:
  push:
    branches:
      - audit/ev-charging-time-small-positive

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/ev-charging-time-small-positive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/one-time-fix-ev-charging-time-small-positive.mjs
      - name: Commit repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add artifacts/calcstride/src/lib/core-calculators.ts
          git diff --cached --quiet && exit 0
          git commit -m "Preserve small positive EV charging times"
          git push
