name: One-time unit baseline diagnostic
on:
  push:
    branches: [qa/unit-baseline-diagnostic-20260909]
    paths:
      - .github/workflows/one-time-unit-baseline-diagnostic.yml
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/unit-baseline-diagnostic-20260909
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run unit suite and capture failures
        shell: bash
        run: |
          set +e
          pnpm --filter @workspace/calcstride test > /tmp/unit-output.txt 2>&1
          status=$?
          echo "exit_code=$status" > QA-UNIT-DIAGNOSTIC.txt
          echo "--- failures ---" >> QA-UNIT-DIAGNOSTIC.txt
          grep -B 2 -A 12 '^not ok ' /tmp/unit-output.txt >> QA-UNIT-DIAGNOSTIC.txt || true
          echo "--- summary ---" >> QA-UNIT-DIAGNOSTIC.txt
          grep -E '^# (tests|pass|fail|cancelled|skipped|todo|duration_ms)' /tmp/unit-output.txt >> QA-UNIT-DIAGNOSTIC.txt || true
          exit 0
      - name: Commit diagnostic
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add QA-UNIT-DIAGNOSTIC.txt
          git commit -m 'chore: record unit-test diagnostic'
          git push
