name: One-time unit baseline diagnostic
on:
  push:
    branches: [qa/unit-baseline-diagnostic-20260909]
permissions:
  contents: write
jobs:
  diagnose:
    if: github.event.head_commit.message != 'chore: record unit-test diagnostic'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/unit-baseline-diagnostic-20260909
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run unit suite and capture failure
        shell: bash
        run: |
          set +e
          pnpm --filter @workspace/calcstride test > /tmp/unit-output.txt 2>&1
          status=$?
          echo "exit_code=$status" > QA-UNIT-DIAGNOSTIC.txt
          echo "--- tail ---" >> QA-UNIT-DIAGNOSTIC.txt
          tail -n 220 /tmp/unit-output.txt >> QA-UNIT-DIAGNOSTIC.txt
          exit 0
      - name: Commit diagnostic
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add QA-UNIT-DIAGNOSTIC.txt
          git commit -m 'chore: record unit-test diagnostic'
          git push
