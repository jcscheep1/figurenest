name: One-time enhance tire size comparison

on:
  push:
    branches:
      - audit/tire-size-reference-comparison

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/tire-size-reference-comparison
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Expand reference tire inputs and add regression
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          phase = Path('artifacts/calcstride/src/lib/phase-four.ts')
          text = phase.read_text()
          old_def = "'tire-size':make('tire-size','Tire Size Calculator','Automotive & EV','automotive','/calculators/automotive/tire-size',[n('width','Section width (mm)','225',100,500),n('aspect','Aspect ratio (%)','45',20,100),n('rim','Rim diameter (in)','17',10,30),n('reference','Reference tire diameter (in)','25',10,50)],'diameter = rim + 2 × width × aspect ÷ 25.4 ÷ 100'"
          new_def = "'tire-size':make('tire-size','Tire Size Calculator','Automotive & EV','automotive','/calculators/automotive/tire-size',[n('width','New tire section width (mm)','225',100,500),n('aspect','New tire aspect ratio (%)','45',20,100),n('rim','New tire rim diameter (in)','17',10,30),n('referenceWidth','Reference tire section width (mm)','225',100,500),n('referenceAspect','Reference tire aspect ratio (%)','45',20,100),n('referenceRim','Reference tire rim diameter (in)','17',10,30)],'diameter = rim + 2 × width × aspect ÷ 25.4 ÷ 100; compare new diameter with a reference tire derived from its own sidewall dimensions'"
          if old_def not in text:
              raise SystemExit('tire-size definition anchor not found')
          text = text.replace(old_def, new_def, 1)

          old_calc = "if(slug==='tire-size'){const dia=x[2]+2*x[0]*x[1]/2540,circ=dia*Math.PI,delta=dia/x[3];return one(`${dia.toFixed(2)} in diameter`,'Calculated tire geometry; verify fitment with vehicle and tire professionals.',[{label:'Circumference',value:`${circ.toFixed(2)} in`},{label:'Revolutions per mile',value:(63360/circ).toFixed(1)},{label:'Speedometer delta',value:`${((delta-1)*100).toFixed(2)}%`},{label:'When speedometer indicates 60 mph',value:`actual ≈ ${(60*delta).toFixed(1)} mph`}]);}"
          new_calc = "if(slug==='tire-size'){const dia=x[2]+2*x[0]*x[1]/2540,referenceDia=x[5]+2*x[3]*x[4]/2540,circ=dia*Math.PI,delta=dia/referenceDia;return one(`${dia.toFixed(2)} in diameter`,'Calculated tire geometry compared with the entered reference tire; verify fitment with vehicle and tire professionals.',[{label:'Reference tire diameter',value:`${referenceDia.toFixed(2)} in`},{label:'Circumference',value:`${circ.toFixed(2)} in`},{label:'Revolutions per mile',value:(63360/circ).toFixed(1)},{label:'Diameter / speedometer delta',value:`${((delta-1)*100).toFixed(2)}%`},{label:'When speedometer indicates 60 mph',value:`actual ≈ ${(60*delta).toFixed(1)} mph`}]);}"
          if old_calc not in text:
              raise SystemExit('tire-size calculation anchor not found')
          phase.write_text(text.replace(old_calc, new_calc, 1))

          tests = Path('artifacts/calcstride/src/lib/phase-four.test.ts')
          test_text = tests.read_text()
          old_call = "calculatePhaseFour('tire-size', ['225', '45', '17', '25'])"
          new_call = "calculatePhaseFour('tire-size', ['225', '45', '17', '225', '45', '17'])"
          if old_call not in test_text:
              raise SystemExit('existing tire-size test anchor not found')
          tests.write_text(test_text.replace(old_call, new_call, 1))

          regression = Path('artifacts/calcstride/src/lib/tire-size-reference-comparison-regression.test.ts')
          regression.write_text("""import assert from 'node:assert/strict';
          import test from 'node:test';
          import { calculatePhaseFour, phaseFourDefinitions } from './phase-four';

          test('tire size compares two complete sidewall sizes instead of requiring a precomputed reference diameter', () => {
            const definition = phaseFourDefinitions['tire-size'];
            assert.deepEqual(definition.fields.map((field) => field.key), [
              'width', 'aspect', 'rim', 'referenceWidth', 'referenceAspect', 'referenceRim',
            ]);

            const same = calculatePhaseFour('tire-size', ['225', '45', '17', '225', '45', '17']);
            assert.equal(same.error, undefined);
            assert.equal(same.primary, '24.97 in diameter');
            assert.ok(same.details.some((detail) => detail.label === 'Reference tire diameter' && detail.value === '24.97 in'));
            assert.ok(same.details.some((detail) => detail.label === 'Diameter / speedometer delta' && detail.value === '0.00%'));
            assert.ok(same.details.some((detail) => detail.label === 'When speedometer indicates 60 mph' && detail.value === 'actual ≈ 60.0 mph'));

            const plusSize = calculatePhaseFour('tire-size', ['235', '40', '18', '225', '45', '17']);
            assert.equal(plusSize.error, undefined);
            assert.equal(plusSize.primary, '25.40 in diameter');
            assert.ok(plusSize.details.some((detail) => detail.label === 'Reference tire diameter' && detail.value === '24.97 in'));
            assert.ok(plusSize.details.some((detail) => detail.label === 'Diameter / speedometer delta' && detail.value === '1.72%'));
            assert.ok(plusSize.details.some((detail) => detail.label === 'When speedometer indicates 60 mph' && detail.value === 'actual ≈ 61.0 mph'));
          });
          """)
          PY
          rm .github/workflows/one-time-enhance-tire-size-comparison.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Expand Tire Size reference comparison"
          git push origin HEAD:audit/tire-size-reference-comparison
