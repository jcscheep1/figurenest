name: PR117 one-time QA repair

on:
  push:
    branches:
      - expansion/batch-1-business-marketing

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/batch-1-business-marketing
      - name: Apply evidence-backed QA repairs
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'marker missing in {path}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1))

          business = 'artifacts/calcstride/src/lib/business-calculators.ts'
          additions = [
              ("        interpretation: 'Attributed revenue is below advertising spend, but the full business decision still depends on attribution quality and downstream customer value.',\n      },\n    ],\n    edgeCases:",
               "        interpretation: 'Attributed revenue is below advertising spend, but the full business decision still depends on attribution quality and downstream customer value.',\n      },\n      {\n        title: 'Scaled campaign',\n        inputs: '$12,500 advertising spend and $62,500 attributed revenue',\n        working: '$62,500 ÷ $12,500',\n        result: '5.00× ROAS and 500% ROAS',\n        interpretation: 'The larger campaign returns five units of attributed revenue per unit of ad spend; profitability still depends on margin and non-advertising costs.',\n      },\n    ],\n    edgeCases:"),
              ("        interpretation: 'The result is meaningful only if the lead and sale counts use the same funnel definition and time window.',\n      },\n    ],\n    edgeCases:",
               "        interpretation: 'The result is meaningful only if the lead and sale counts use the same funnel definition and time window.',\n      },\n      {\n        title: 'Signup funnel',\n        inputs: '2,400 eligible visitors and 72 completed signups',\n        working: '72 ÷ 2,400 × 100',\n        result: '3% conversion rate',\n        interpretation: 'Three of every one hundred eligible visitors completed the defined signup action under this denominator and time window.',\n      },\n    ],\n    edgeCases:"),
              ("        interpretation: 'A higher CPC can still be economically stronger if the traffic converts better or produces higher-value customers.',\n      },\n    ],\n    edgeCases:",
               "        interpretation: 'A higher CPC can still be economically stronger if the traffic converts better or produces higher-value customers.',\n      },\n      {\n        title: 'Low-cost social traffic',\n        inputs: '$840 spend and 2,100 clicks',\n        working: '$840 ÷ 2,100',\n        result: '$0.40 average CPC',\n        interpretation: 'The average click cost is forty cents; conversion quality and customer value still determine whether that traffic is useful.',\n      },\n    ],\n    edgeCases:"),
              ("        interpretation: 'The higher exposure cost may or may not be justified by better audience fit, placement quality, reach, or downstream results.',\n      },\n    ],\n    edgeCases:",
               "        interpretation: 'The higher exposure cost may or may not be justified by better audience fit, placement quality, reach, or downstream results.',\n      },\n      {\n        title: 'Broad awareness buy',\n        inputs: '$1,800 spend and 900,000 impressions',\n        working: '$1,800 ÷ 900,000 × 1,000',\n        result: '$2.00 CPM',\n        interpretation: 'The campaign paid two dollars per thousand delivered impressions, without implying anything about unique reach or conversions.',\n      },\n    ],\n    edgeCases:"),
              ("        interpretation: 'Compare this channel CAC with a consistently defined benchmark and with the value created by customers from the same channel.',\n      },\n    ],\n    edgeCases:",
               "        interpretation: 'Compare this channel CAC with a consistently defined benchmark and with the value created by customers from the same channel.',\n      },\n      {\n        title: 'Referral acquisition cohort',\n        inputs: '$9,600 acquisition spend and 80 new customers',\n        working: '$9,600 ÷ 80',\n        result: '$120.00 CAC',\n        interpretation: 'The cohort averages $120 of acquisition spend per new customer before retention, contribution margin, and lifetime value are considered.',\n      },\n    ],\n    edgeCases:"),
          ]
          for old, new in additions:
              replace(business, old, new)

          growth = Path('artifacts/calcstride/src/lib/business-growth-calculators.ts')
          text = growth.read_text()
          old = "  if (slug === 'conversion-rate') {\n    if (a <= 0) return invalid('Visitors or opportunities must be greater than zero');"
          new = "  if (slug === 'conversion-rate') {\n    if (!Number.isInteger(a) || !Number.isInteger(b)) return invalid('Opportunity and conversion counts must be whole numbers');\n    if (a <= 0) return invalid('Visitors or opportunities must be greater than zero');"
          if old not in text: raise SystemExit('conversion whole-number marker missing')
          text = text.replace(old, new, 1)
          old = "  if (slug === 'cpc') {\n    if (b <= 0) return invalid('Clicks must be greater than zero');"
          new = "  if (slug === 'cpc') {\n    if (!Number.isInteger(b)) return invalid('Clicks must be a whole number');\n    if (b <= 0) return invalid('Clicks must be greater than zero');"
          text = text.replace(old, new, 1)
          old = "  if (slug === 'cpm') {\n    if (b <= 0) return invalid('Impressions must be greater than zero');"
          new = "  if (slug === 'cpm') {\n    if (!Number.isInteger(b)) return invalid('Impressions must be a whole number');\n    if (b <= 0) return invalid('Impressions must be greater than zero');"
          text = text.replace(old, new, 1)
          old = "  if (b <= 0) return invalid('New customers acquired must be greater than zero');"
          new = "  if (!Number.isInteger(b)) return invalid('New customers acquired must be a whole number');\n  if (b <= 0) return invalid('New customers acquired must be greater than zero');"
          text = text.replace(old, new, 1)
          growth.write_text(text)

          tests = Path('artifacts/calcstride/src/lib/business-growth-calculators.test.ts')
          text = tests.read_text()
          marker = "test('blank, negative, nonnumeric, and oversized values are rejected', () => {"
          whole = "test('count inputs require whole numbers while monetary inputs may use decimals', () => {\n  assert.ok(calculateBusinessGrowth('conversion-rate', ['100.5', '10']).error);\n  assert.ok(calculateBusinessGrowth('conversion-rate', ['100', '10.5']).error);\n  assert.ok(calculateBusinessGrowth('cpc', ['100.50', '10.5']).error);\n  assert.ok(calculateBusinessGrowth('cpm', ['100.50', '1000.5']).error);\n  assert.ok(calculateBusinessGrowth('customer-acquisition-cost', ['100.50', '2.5']).error);\n  assert.equal(calculateBusinessGrowth('cpc', ['100.50', '3']).error, undefined);\n});\n\n"
          if whole not in text:
              if marker not in text: raise SystemExit('business test marker missing')
              text = text.replace(marker, whole + marker, 1)
          tests.write_text(text)

          seo = Path('artifacts/calcstride/src/lib/seo-capabilities.ts')
          text = seo.read_text()
          marker = "  vat: {\n    seoTitle: 'VAT Calculator — Add or Remove Tax | FigureNest',"
          entries = "  roas: {\n    seoTitle: 'ROAS Calculator — Return on Ad Spend | FigureNest',\n    seoDescription: 'Calculate ROAS with EUR, USD, GBP, or ZAR formatting from ad spend and attributed revenue; currency selection is not live FX conversion.',\n    visibleNote: businessMoneyNote,\n  },\n  cpc: {\n    seoTitle: 'CPC Calculator — Cost Per Click | FigureNest',\n    seoDescription: 'Calculate CPC with EUR, USD, GBP, or ZAR formatting from advertising spend and clicks; currency selection is not live FX conversion.',\n    visibleNote: businessMoneyNote,\n  },\n  cpm: {\n    seoTitle: 'CPM Calculator — Cost Per 1,000 Impressions | FigureNest',\n    seoDescription: 'Calculate CPM with EUR, USD, GBP, or ZAR formatting from advertising spend and impressions; currency selection is not live FX conversion.',\n    visibleNote: businessMoneyNote,\n  },\n  'customer-acquisition-cost': {\n    seoTitle: 'Customer Acquisition Cost Calculator — CAC | FigureNest',\n    seoDescription: 'Calculate CAC with EUR, USD, GBP, or ZAR formatting from acquisition spend and new customers; currency selection is not live FX conversion.',\n    visibleNote: businessMoneyNote,\n  },\n"
          if marker not in text: raise SystemExit('seo capability insertion marker missing')
          text = text.replace(marker, entries + marker, 1)
          seo.write_text(text)

          api = Path('artifacts/api-server/src/routes/catalog.ts')
          text = api.read_text()
          marker = '  {\n    slug: "vat",\n    name: "VAT Calculator",'
          entries = '''  {
    slug: "roas",
    name: "ROAS Calculator",
    description: "Calculate return on ad spend from advertising cost and attributed revenue.",
    category: "Business",
    categorySlug: "business",
    href: "/calculators/business/roas",
    tags: ["roas", "return on ad spend", "advertising", "marketing"],
    featured: false,
    lastUpdated: CATALOG_LAST_UPDATED,
  },
  {
    slug: "conversion-rate",
    name: "Conversion Rate Calculator",
    description: "Calculate the percentage of visitors, leads, or opportunities that convert.",
    category: "Business",
    categorySlug: "business",
    href: "/calculators/business/conversion-rate",
    tags: ["conversion rate", "conversions", "marketing", "sales"],
    featured: false,
    lastUpdated: CATALOG_LAST_UPDATED,
  },
  {
    slug: "cpc",
    name: "CPC Calculator",
    description: "Calculate average advertising cost per click from spend and recorded clicks.",
    category: "Business",
    categorySlug: "business",
    href: "/calculators/business/cpc",
    tags: ["cpc", "cost per click", "advertising", "marketing"],
    featured: false,
    lastUpdated: CATALOG_LAST_UPDATED,
  },
  {
    slug: "cpm",
    name: "CPM Calculator",
    description: "Calculate advertising cost per one thousand impressions from spend and impressions.",
    category: "Business",
    categorySlug: "business",
    href: "/calculators/business/cpm",
    tags: ["cpm", "cost per thousand", "impressions", "advertising"],
    featured: false,
    lastUpdated: CATALOG_LAST_UPDATED,
  },
  {
    slug: "customer-acquisition-cost",
    name: "Customer Acquisition Cost Calculator",
    description: "Calculate average customer acquisition cost from acquisition spend and new customers.",
    category: "Business",
    categorySlug: "business",
    href: "/calculators/business/customer-acquisition-cost",
    tags: ["cac", "customer acquisition cost", "marketing", "customers"],
    featured: false,
    lastUpdated: CATALOG_LAST_UPDATED,
  },
'''
          if marker not in text: raise SystemExit('API catalog insertion marker missing')
          text = text.replace(marker, entries + marker, 1)
          api.write_text(text)

          category = Path('artifacts/calcstride/src/lib/category-content.ts')
          text = category.read_text()
          marker = "      { slug: 'break-even', description: 'Estimate the sales volume and revenue needed to cover fixed costs using the price and variable-cost assumptions entered.' },\n"
          entries = marker + "      { slug: 'roas', description: 'Compare attributed advertising revenue with ad spend as a revenue-efficiency multiple and percentage.' },\n      { slug: 'conversion-rate', description: 'Measure completed conversions as a percentage of a consistently defined opportunity, visitor, lead, or click count.' },\n      { slug: 'cpc', description: 'Calculate average advertising spend per recorded click for a consistent campaign scope and reporting period.' },\n      { slug: 'cpm', description: 'Standardize advertising spend as cost per one thousand delivered impressions for media-cost comparisons.' },\n      { slug: 'customer-acquisition-cost', description: 'Average a defined acquisition-cost pool across the new customers acquired in the corresponding period.' },\n"
          if marker not in text: raise SystemExit('business category marker missing')
          text = text.replace(marker, entries, 1)
          category.write_text(text)

          integration = Path('artifacts/calcstride/src/lib/business-growth-integration.test.ts')
          text = integration.read_text()
          if "from './category-content'" not in text:
              text = text.replace("import {", "import { categoryContent } from './category-content';\nimport {", 1)
          marker = "test('Batch 1 Business tools are registered in the shared catalog', () => {"
          newtest = "test('Batch 1 Business tools are described by the existing Business category guide', () => {\n  const described = new Set(categoryContent.business.toolDescriptions.map((item) => item.slug));\n  for (const slug of businessGrowthSlugs) assert.ok(described.has(slug), slug);\n});\n\n"
          if newtest not in text:
              if marker not in text: raise SystemExit('integration test insertion marker missing')
              text = text.replace(marker, newtest + marker, 1)
          integration.write_text(text)

          replace('artifacts/calcstride/src/lib/phase-four.test.ts',
                  '  assert.equal(publishedTools.length, 163);',
                  '  assert.equal(publishedTools.length, catalogTools.length);')
          replace('artifacts/calcstride/src/lib/phase-three-c.test.ts',
                  '  assert.equal(publishedTools.length, 163);',
                  '  assert.equal(publishedTools.length, catalogTools.length);')
          replace('artifacts/calcstride/src/lib/site-audit.test.ts',
                  "  assert.equal(publishedToolCount, 163);\n  assert.equal(publishedToolCount, new Set(canonicalHrefs).size);\n  assert.equal(localTools.length, 163);",
                  "  assert.equal(publishedToolCount, new Set(canonicalHrefs).size);\n  assert.equal(localTools.length, publishedToolCount);")
          replace('artifacts/calcstride/src/lib/site-audit.test.ts',
                  '  assert.equal(publishedTools.length, 163);',
                  '  assert.equal(publishedTools.length, publishedToolCount);')

          Path('.github/workflows/pr117-qa-diagnostic.yml').unlink(missing_ok=True)
          Path('.github/workflows/pr117-one-time-qa-repair.yml').unlink(missing_ok=True)

      - name: Commit repair
        run: |
          git config user.name "figurenest-qa"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "qa: repair Business expansion integration contracts"
          git push origin HEAD:expansion/batch-1-business-marketing
