name: One-time Interest API parity

on:
  push:
    branches:
      - fix/interest-intent-consolidation

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[interest-api-parity]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/interest-intent-consolidation
          fetch-depth: 0
      - name: Align public API and registry contracts
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          api = Path('artifacts/api-server/src/routes/catalog.ts')
          text = api.read_text()
          old = 'catalogTools.push(...priorityOneExpansionSlugs.map((slug) => {'
          new = 'catalogTools.push(...priorityOneExpansionSlugs.filter((slug) => slug !== "interest").map((slug) => {'
          if old not in text:
              raise SystemExit('API priority-one publication insertion point not found')
          api.write_text(text.replace(old, new, 1))

          for relative in [
              'artifacts/calcstride/src/lib/phase-four.test.ts',
              'artifacts/calcstride/src/lib/phase-three-c.test.ts',
          ]:
              path = Path(relative)
              text = path.read_text()
              old = 'assert.equal(publishedTools.length, 163);'
              new = 'assert.equal(publishedTools.length, 162);'
              if old not in text:
                  raise SystemExit(f'Expected publishedTools count not found in {relative}')
              path.write_text(text.replace(old, new, 1))

          diagnostic = Path('interest-full-failure.txt')
          if diagnostic.exists():
              diagnostic.unlink()
          Path('.github/workflows/one-time-interest-api-parity.yml').unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Align Interest consolidation across API and registry contracts [interest-api-parity]"
          git push origin HEAD:fix/interest-intent-consolidation
