name: FT-09 Guarded Publication Wiring

on:
  push:
    branches: [expansion/ft-09-csv-xlsx-gate]
    paths:
      - '.github/workflows/ft09-guarded-publication-wiring.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wire-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/ft-09-csv-xlsx-gate
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Atomically wire FT-09 publication surfaces
        run: |
          python <<'PY'
          from pathlib import Path

          app_path = Path('artifacts/calcstride/src/App.tsx')
          app = app_path.read_text()

          ssr_anchor = "const pdfToDocxPages = import.meta.env.SSR ? await import('@/pages/PdfToDocxPage') : null;\n"
          ssr_insert = ssr_anchor + "const csvXlsxPages = import.meta.env.SSR ? await import('@/pages/CsvXlsxPages') : null;\n"
          if "const csvXlsxPages =" not in app:
              if ssr_anchor not in app:
                  raise SystemExit('App SSR anchor changed; refusing blind edit')
              app = app.replace(ssr_anchor, ssr_insert, 1)

          lazy_anchor = "const PdfToDocxPage = pdfToDocxPages?.PdfToDocxPage\n  ?? lazy(() => import('@/pages/PdfToDocxPage').then(({ PdfToDocxPage: page }) => ({ default: page })));\n"
          lazy_insert = lazy_anchor + "const CsvToXlsxPage = csvXlsxPages?.CsvToXlsxPage\n  ?? lazy(() => import('@/pages/CsvXlsxPages').then(({ CsvToXlsxPage: page }) => ({ default: page })));\nconst XlsxToCsvPage = csvXlsxPages?.XlsxToCsvPage\n  ?? lazy(() => import('@/pages/CsvXlsxPages').then(({ XlsxToCsvPage: page }) => ({ default: page })));\n"
          if "const CsvToXlsxPage =" not in app:
              if lazy_anchor not in app:
                  raise SystemExit('App lazy-page anchor changed; refusing blind edit')
              app = app.replace(lazy_anchor, lazy_insert, 1)

          route_anchor = '        <Route path="/file-tools/pdf-to-docx" component={PdfToDocxPage} />\n'
          route_insert = route_anchor + '        <Route path="/file-tools/csv-to-xlsx" component={CsvToXlsxPage} />\n        <Route path="/file-tools/xlsx-to-csv" component={XlsxToCsvPage} />\n'
          if 'path="/file-tools/csv-to-xlsx"' not in app:
              if route_anchor not in app:
                  raise SystemExit('App file-route anchor changed; refusing blind edit')
              app = app.replace(route_anchor, route_insert, 1)

          app_path.write_text(app)

          catalog_path = Path('artifacts/calcstride/src/lib/file-tools-catalog.ts')
          catalog = catalog_path.read_text()
          marker = "  'pdf-to-text': {\n"
          if "  'csv-to-xlsx': {" not in catalog:
              if marker not in catalog:
                  raise SystemExit('File-tool catalog anchor changed; refusing blind edit')
              definitions = """  'csv-to-xlsx': {
    slug: 'csv-to-xlsx',
    name: 'CSV to XLSX',
    description: 'Convert a UTF-8 CSV table into an Excel-compatible XLSX workbook locally in your browser without uploading spreadsheet data.',
    category: FILE_TOOLS_CATEGORY.name,
    categorySlug: FILE_TOOLS_CATEGORY.slug,
    href: '/file-tools/csv-to-xlsx',
    tags: ['csv to xlsx', 'csv to excel', 'spreadsheet converter', 'private csv converter', 'browser spreadsheet tool'],
    featured: false,
    h1: 'Convert CSV to XLSX',
    seoTitle: 'Free CSV to XLSX Converter | Private Browser | FigureNest',
    seoDescription: 'Convert UTF-8 CSV to XLSX locally in your browser. Choose a delimiter and worksheet name, preview the table, and download without uploading your data.',
    privacySummary: 'The CSV, filename, parsed values and generated XLSX stay in this browser tab. FigureNest does not upload spreadsheet content or conversion output.',
    limitations: [
      'CSV contains one flat table. It does not contain workbook formulas, styles, charts, multiple worksheets or Excel print settings, so those features cannot be created from the source CSV.',
      'This release accepts UTF-8 CSV input and lets you choose comma, semicolon, tab or pipe delimiters. Very large or malformed tables are rejected by local workbook-shape limits.',
      'Values that look like spreadsheet formulas remain inert text in the generated workbook; FigureNest does not execute formulas or macros.',
      'Leading zeros are preserved as text where the CSV parser reads text values. Date and number interpretation can differ from Excel locale-specific import behavior.',
    ],
    faqs: [
      { question: 'Does FigureNest upload my CSV?', answer: 'No. The selected CSV is read and converted in your browser. File bytes, names, cell values and the generated XLSX are not sent to a FigureNest conversion server.' },
      { question: 'Can CSV preserve Excel formatting or formulas?', answer: 'No. CSV is a flat text table and has no workbook styles, formulas, charts or multiple sheets. This converter creates a new XLSX worksheet from the CSV values.' },
      { question: 'Which delimiters are supported?', answer: 'Choose comma, semicolon, tab or pipe before conversion. The preview lets you check the selected source before creating the XLSX.' },
      { question: 'Are formula-looking values safe?', answer: 'Yes. Values beginning like spreadsheet formulas are kept as inert text; this tool does not evaluate formulas, macros or external workbook code.' },
    ],
    relatedRoutes: ['/file-tools/xlsx-to-csv', '/file-tools/docx-to-pdf', '/privacy'],
  },
  'xlsx-to-csv': {
    slug: 'xlsx-to-csv',
    name: 'XLSX to CSV',
    description: 'Export one worksheet from an XLSX workbook as injection-safe CSV locally in your browser without uploading workbook data.',
    category: FILE_TOOLS_CATEGORY.name,
    categorySlug: FILE_TOOLS_CATEGORY.slug,
    href: '/file-tools/xlsx-to-csv',
    tags: ['xlsx to csv', 'excel to csv', 'spreadsheet converter', 'private xlsx converter', 'browser excel tool'],
    featured: false,
    h1: 'Convert XLSX to CSV',
    seoTitle: 'Free XLSX to CSV Converter | Private Browser | FigureNest',
    seoDescription: 'Convert one XLSX worksheet to injection-safe CSV locally in your browser. Choose the sheet, preview the result, and download without uploading the workbook.',
    privacySummary: 'The XLSX workbook, filename, worksheet values and generated CSV stay in this browser tab. FigureNest does not upload spreadsheet content or conversion output.',
    limitations: [
      'CSV can contain only one flat table. Choose one worksheet per export; formulas, styles, charts, merged-cell formatting, multiple sheets and workbook print settings are not preserved.',
      'The workbook must pass local OOXML/ZIP safety checks and worksheet count, row, column and populated-range limits before parsing or export.',
      'Formula cells are not recalculated or executed. Export uses stored cell values only and spreadsheet-injection-looking text is neutralized in the CSV output.',
      'Dates and formatted numeric cells are exported according to the locally parsed workbook values rather than reproducing every Excel locale or display-format rule.',
    ],
    faqs: [
      { question: 'Does FigureNest upload my XLSX workbook?', answer: 'No. ZIP safety inspection, workbook parsing, worksheet selection and CSV generation run locally in your browser. Workbook bytes, names and cell contents are not sent to a FigureNest conversion server.' },
      { question: 'Can I export every worksheet into one CSV?', answer: 'No. CSV represents one flat table, so this release exports one selected worksheet at a time. Choose another sheet and convert again if you need more than one CSV.' },
      { question: 'Does the converter calculate Excel formulas?', answer: 'No. FigureNest never executes or recalculates formulas or macros. CSV export uses the stored worksheet values available in the workbook.' },
      { question: 'How is spreadsheet injection handled?', answer: 'Formula-leading text is neutralized in the generated CSV while genuine negative numbers remain numeric-looking values.' },
    ],
    relatedRoutes: ['/file-tools/csv-to-xlsx', '/file-tools/docx-to-pdf', '/privacy'],
  },
"""
              catalog = catalog.replace(marker, definitions + marker, 1)
          catalog_path.write_text(catalog)
          PY

      - name: Generate SEO and sitemap
        working-directory: artifacts/calcstride
        run: pnpm run generate:seo

      - name: Focused FT-09 tests
        working-directory: artifacts/calcstride
        run: pnpm exec tsx --test src/lib/ft09-converter.test.ts src/lib/csv-spreadsheet-safety.test.ts src/lib/xlsx-zip-preflight.test.ts

      - name: Typecheck
        working-directory: artifacts/calcstride
        run: pnpm run typecheck

      - name: Production build
        working-directory: artifacts/calcstride
        run: pnpm run build

      - name: Commit verified publication wiring
        run: |
          git config user.name 'FigureNest Pipeline'
          git config user.email 'actions@users.noreply.github.com'
          git add -u
          git add artifacts/calcstride/src/App.tsx artifacts/calcstride/src/lib/file-tools-catalog.ts
          if git diff --cached --quiet; then
            echo 'No publication changes to commit'; exit 0
          fi
          git commit -m 'feat(file-tools): publish CSV XLSX converters'
          git push origin HEAD:expansion/ft-09-csv-xlsx-gate
