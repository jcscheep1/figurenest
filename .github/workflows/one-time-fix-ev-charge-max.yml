name: One-time fix EV charge maximum

on:
  pull_request:
    types: [opened]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'audit/ev-charging-cost-charge-max'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/ev-charging-cost-charge-max
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply guarded repair and regression
        run: |
          python3 - <<'PY'
          from pathlib import Path

          page = Path('artifacts/calcstride/src/pages/AutomotiveCalculatorPage.tsx')
          text = page.read_text()
          old = '''                      min="0"\n                      step="any"\n                      value={values[index]}'''
          new = '''                      min="0"\n                      max={slug === 'ev-charging-cost' && field.key === 'charge' ? 100 : undefined}\n                      step="any"\n                      value={values[index]}'''
          if text.count(old) != 1:
              raise SystemExit(f'Expected one automotive input contract anchor, found {text.count(old)}')
          page.write_text(text.replace(old, new, 1))

          test_file = Path('artifacts/calcstride/src/lib/ev-charging-cost-charge-boundary-regression.test.ts')
          test_file.write_text("""import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import test from 'node:test';
          import { calculateCore } from './core-calculators';

          const pageSource = readFileSync(new URL('../pages/AutomotiveCalculatorPage.tsx', import.meta.url), 'utf8');

          test('EV Charging Cost exposes and enforces the 0-100% charge-added contract', () => {
            const normal = calculateCore('ev-charging-cost', ['75', '80', '0.32']);
            assert.equal(normal.primary, '$19.20');
            assert.equal(normal.details?.[0].value, '60 kWh');

            const full = calculateCore('ev-charging-cost', ['75', '100', '0.32']);
            assert.equal(full.primary, '$24.00');
            assert.equal(full.error, undefined);

            const zero = calculateCore('ev-charging-cost', ['75', '0', '0.32']);
            assert.equal(zero.primary, '$0.00');
            assert.equal(zero.error, undefined);

            assert.match(calculateCore('ev-charging-cost', ['75', '100.01', '0.32']).error ?? '', /cannot exceed 100%/i);
            assert.ok(calculateCore('ev-charging-cost', ['75', '', '0.32']).error);
            assert.match(pageSource, /max=\{slug === 'ev-charging-cost' && field\.key === 'charge' \? 100 : undefined\}/);
          });
          """)
          PY
      - name: Focused regression
        run: pnpm --filter @workspace/calcstride exec tsx --test src/lib/ev-charging-cost-charge-boundary-regression.test.ts
      - name: Calcstride typecheck
        run: pnpm --filter @workspace/calcstride typecheck
      - name: Calcstride production build
        run: pnpm --filter @workspace/calcstride build
      - name: Commit verified repair
        run: |
          rm .github/workflows/one-time-fix-ev-charge-max.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add artifacts/calcstride/src/pages/AutomotiveCalculatorPage.tsx artifacts/calcstride/src/lib/ev-charging-cost-charge-boundary-regression.test.ts .github/workflows/one-time-fix-ev-charge-max.yml
          git commit -m "Fix EV charging percentage input boundary"
          git push origin HEAD:audit/ev-charging-cost-charge-max
