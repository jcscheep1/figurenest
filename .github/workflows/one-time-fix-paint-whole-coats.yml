name: One-time Paint whole-coat repair

on:
  push:
    paths:
      - '.github/workflows/one-time-fix-paint-whole-coats.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/paint-whole-coats
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply guarded Paint repair
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('artifacts/calcstride/src/lib/construction.ts')
          text = path.read_text()
          old = """    if (!Number.isFinite(parsed) || parsed < 0 || (!item.allowZero && parsed === 0)) return errorResult(`${item.label} must be greater than zero.`);\n    if (hardened) {\n"""
          new = """    if (!Number.isFinite(parsed) || parsed < 0 || (!item.allowZero && parsed === 0)) return errorResult(`${item.label} must be greater than zero.`);\n    if (slug === 'paint' && item.key === 'coats' && !Number.isInteger(parsed)) {\n      return errorResult('Number of coats must be a whole number.');\n    }\n    if (hardened) {\n"""
          if old not in text:
              raise SystemExit('Guard target not found; refusing unsafe edit')
          if text.count(old) != 1:
              raise SystemExit('Guard target is not unique; refusing unsafe edit')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Build workspace type dependency
        run: pnpm exec tsc -b lib/api-client-react
      - name: Run focused Paint regression
        run: pnpm --filter @workspace/calcstride exec tsx --test src/lib/paint-whole-coats-regression.test.ts
      - name: Typecheck calculator app
        run: pnpm --filter @workspace/calcstride typecheck
      - name: Build calculator app
        run: pnpm --filter @workspace/calcstride build
      - name: Commit passing repair
        run: |
          git config user.name 'FigureNest Repair Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add artifacts/calcstride/src/lib/construction.ts artifacts/calcstride/src/lib/paint-whole-coats-regression.test.ts
          git diff --cached --quiet && exit 0
          git commit -m 'Require whole coats in Paint Calculator'
          git push origin HEAD:audit/paint-whole-coats
