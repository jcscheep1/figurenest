name: One-time finance production verifier

on:
  push:
    paths:
      - '.github/workflows/one-time-live-verify-finance.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Selenium
        run: pip install selenium
      - name: Verify deployed finance calculators in Chrome
        run: python scripts/one-time-live-verify-finance.py
      # rerun after binding Compound to stable input test ids
