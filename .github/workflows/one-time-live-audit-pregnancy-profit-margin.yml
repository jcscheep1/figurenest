name: One-time live verify Profit Margin and audit Break-Even

on:
  push:
    paths:
      - '.github/workflows/one-time-live-audit-pregnancy-profit-margin.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Selenium
        run: pip install 'selenium==4.35.0'
      - name: Audit production behavior
        shell: python
        run: |
          import time
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.common.keys import Keys
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC

          options = webdriver.ChromeOptions()
          options.add_argument('--headless=new')
          options.add_argument('--no-sandbox')
          options.add_argument('--disable-dev-shm-usage')
          options.add_argument('--window-size=1440,1600')
          driver = webdriver.Chrome(options=options)
          wait = WebDriverWait(driver, 20)

          def type_input(css, value):
              el = wait.until(EC.element_to_be_clickable((By.CSS_SELECTOR, css)))
              driver.execute_script('arguments[0].scrollIntoView({block:"center"})', el)
              el.click()
              el.send_keys(Keys.CONTROL, 'a')
              el.send_keys(value)
              el.send_keys(Keys.TAB)
              time.sleep(0.35)

          try:
              # Live closure gate for repaired Profit Margin high-loss case.
              driver.get('https://figurenest.com/calculators/business/profit-margin')
              wait.until(EC.presence_of_element_located((By.CSS_SELECTOR, '[data-testid="input-business-cost"]')))
              type_input('[data-testid="input-business-cost"]', '2000')
              type_input('[data-testid="input-business-price"]', '1')
              panel = driver.find_element(By.CSS_SELECTOR, '.advanced-result')
              assert 'has-error' not in panel.get_attribute('class'), panel.text
              assert '-199,900%' in panel.text, panel.text
              breakdown = driver.find_element(By.CSS_SELECTOR, '.advanced-breakdown').text
              assert 'Gross loss' in breakdown and '$1,999.00' in breakdown and '-99.95%' in breakdown, breakdown
              print('PASS: FN-005-M Profit Margin repaired high-loss case = -199,900%')

              # Next audit target: Break-Even normal case.
              driver.get('https://figurenest.com/calculators/business/break-even')
              wait.until(EC.presence_of_element_located((By.CSS_SELECTOR, '[data-testid="input-business-fixed"]')))
              type_input('[data-testid="input-business-fixed"]', '12000')
              type_input('[data-testid="input-business-price"]', '80')
              type_input('[data-testid="input-business-variable"]', '32')
              panel = driver.find_element(By.CSS_SELECTOR, '.advanced-result')
              assert 'has-error' not in panel.get_attribute('class'), panel.text
              assert '250 units' in panel.text, panel.text
              breakdown = driver.find_element(By.CSS_SELECTOR, '.advanced-breakdown').text
              assert '$48.00' in breakdown and '$20,000.00' in breakdown, breakdown
              print('PASS: Break-Even normal case = 250 units')

              # Invalid contribution margin must reject price <= variable cost.
              type_input('[data-testid="input-business-price"]', '32')
              type_input('[data-testid="input-business-variable"]', '32')
              panel = driver.find_element(By.CSS_SELECTOR, '.advanced-result')
              assert 'has-error' in panel.get_attribute('class'), panel.text
              assert 'must exceed variable cost' in panel.text.lower(), panel.text
              print('PASS: Break-Even rejects non-positive contribution margin')

              # Fractional exact break-even must round required sellable units up.
              type_input('[data-testid="input-business-fixed"]', '100')
              type_input('[data-testid="input-business-price"]', '10')
              type_input('[data-testid="input-business-variable"]', '4')
              panel = driver.find_element(By.CSS_SELECTOR, '.advanced-result')
              assert 'has-error' not in panel.get_attribute('class'), panel.text
              assert '17 units' in panel.text, panel.text
              breakdown = driver.find_element(By.CSS_SELECTOR, '.advanced-breakdown').text
              assert '$6.00' in breakdown and '$166.67' in breakdown and '$170.00' in breakdown, breakdown
              print('PASS: Break-Even rounds 16.666... exact units up to 17')
          finally:
              driver.quit()
