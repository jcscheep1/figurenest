name: Repair concrete waste units

on:
  push:
    branches:
      - audit/concrete-waste-breakdown-units

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/concrete-waste-breakdown-units
      - name: Apply minimal repair
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('artifacts/calcstride/src/lib/construction.ts')
          s = p.read_text()
          old = "{ label: 'Waste allowance', value: `${format(adjusted - baseVolume)} volume` },"
          new = "{ label: 'Waste allowance', value: outputVolume(adjusted - baseVolume) },"
          if old not in s:
              raise SystemExit('target formatter not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add artifacts/calcstride/src/lib/construction.ts
          git commit -m "Fix concrete waste breakdown units"
          git push origin HEAD:audit/concrete-waste-breakdown-units
