name: FT02 Install PDF Dependencies

on:
  push:
    branches: [expansion/ft-02-pdf-sign-edit-core]
    paths:
      - '.github/workflows/ft02-install-pdf-dependencies.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: expansion/ft-02-pdf-sign-edit-core
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked baseline
        run: pnpm install --frozen-lockfile

      - name: Add exact browser PDF engines
        run: pnpm --filter @workspace/calcstride add --save-exact pdf-lib@1.17.1 pdfjs-dist@6.3.289

      - name: Remove one-time workflow and commit lockfile
        run: |
          rm .github/workflows/ft02-install-pdf-dependencies.yml
          git config user.name "FigureNest Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add artifacts/calcstride/package.json pnpm-lock.yaml .github/workflows/ft02-install-pdf-dependencies.yml
          git commit -m "Install FT-02 PDF dependencies"
          git push origin HEAD:expansion/ft-02-pdf-sign-edit-core
