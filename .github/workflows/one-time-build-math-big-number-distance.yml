name: One-time Math Big Number and Distance build

on:
  push:
    paths:
      - '.github/workflows/one-time-build-math-big-number-distance.yml'

permissions:
  contents: write

jobs:
  build-mini-cluster:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply guarded Math mini-cluster
        run: python scripts/one-time-add-math-big-number-distance.py
      - name: Build workspace type dependency
        run: pnpm exec tsc -b lib/api-client-react
      - name: Generate SEO files
        run: pnpm --filter @workspace/calcstride generate:seo
      - name: Focused Math mini-cluster and site-audit tests
        run: pnpm --filter @workspace/calcstride exec tsx --test src/lib/math-mini-cluster.test.ts src/lib/phase-three-b.test.ts src/lib/site-audit.test.ts
      - name: Typecheck
        run: pnpm --filter @workspace/calcstride typecheck
      - name: Full unit tests
        run: pnpm --filter @workspace/calcstride test
      - name: Production build
        run: pnpm --filter @workspace/calcstride build
      - name: Static built-site audit
        run: pnpm --filter @workspace/calcstride audit:static
      - name: Commit verified mini-cluster
        run: |
          rm -f scripts/one-time-add-math-big-number-distance.py .github/workflows/one-time-build-math-big-number-distance.yml math-mini-cluster-build-diagnostics.txt
          git config user.name 'FigureNest Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Add Big Number and Distance calculators'
          git push origin HEAD:expansion/math-big-number-distance
