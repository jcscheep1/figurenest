name: VA Mortgage repair

on:
  push:
    branches:
      - fix/va-mortgage-down-payment-validation

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/va-mortgage-down-payment-validation
          fetch-depth: 0
      - name: Repair VA mortgage down-payment validation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('artifacts/calcstride/src/lib/priority-one-expansion.ts')
          text = path.read_text()
          old = " if(slug==='va-mortgage'){const loan=(n[0]-n[1])*(1+n[4]/100);return {primary:money(payment(loan,n[2],n[3])),summary:'Estimated principal and interest.',details:[{label:'Financed funding fee',value:money(loan-(n[0]-n[1]))}]};}"
          new = " if(slug==='va-mortgage'){const base=n[0]-n[1];if(base<0)return bad('Down payment cannot exceed home price.');const loan=base*(1+n[4]/100);return {primary:money(payment(loan,n[2],n[3])),summary:'Estimated principal and interest.',details:[{label:'Financed funding fee',value:money(loan-base)}]};}"
          if old not in text:
              raise SystemExit('Expected VA mortgage implementation not found; refusing broad rewrite')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/calcstride/src/lib/priority-one-expansion.ts
          git diff --cached --quiet && exit 0
          git commit -m 'Validate VA mortgage down payment'
          git push origin HEAD:fix/va-mortgage-down-payment-validation
