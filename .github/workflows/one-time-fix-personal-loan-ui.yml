name: One-time Personal Loan term UI repair

on:
  push:
    branches: [audit/personal-loan-term-ui]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[personal-loan-ui-repair]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/personal-loan-term-ui
      - name: Align Personal Loan term metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('artifacts/calcstride/src/lib/priority-one-expansion.ts')
          text = path.read_text()
          old = "['personal-loan','Personal Loan Calculator','finance','Estimate a fixed personal loan payment.','monthly amortization formula',moneyFields],"
          new = "['personal-loan','Personal Loan Calculator','finance','Estimate a fixed personal loan payment.','monthly amortization formula',[moneyFields[0],moneyFields[1],{...moneyFields[2],min:1/12,step:String(1/12)}]],"
          if old not in text:
              raise SystemExit('Expected Personal Loan definition anchor not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/calcstride/src/lib/priority-one-expansion.ts
          git commit -m "[personal-loan-ui-repair] Align Personal Loan monthly term input"
          git push
