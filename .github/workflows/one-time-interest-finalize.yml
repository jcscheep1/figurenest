name: One-time Interest consolidation finalize

on:
  push:
    branches:
      - fix/interest-intent-consolidation

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[interest-consolidation-finalized]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/interest-intent-consolidation
          fetch-depth: 0
      - name: Update directory registry contract and clean diagnostics
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          test = Path('artifacts/calcstride/src/lib/calculator-directory.test.ts')
          text = test.read_text()
          old = '  assert.equal(localTools.length, 162);'
          new = '  assert.equal(localTools.length, 161);'
          if old not in text:
              raise SystemExit('Expected published-tool count assertion was not found')
          test.write_text(text.replace(old, new, 1))
          diagnostic = Path('interest-test-output.txt')
          if diagnostic.exists():
              diagnostic.unlink()
          Path('.github/workflows/one-time-interest-finalize.yml').unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize Interest consolidation registry contract [interest-consolidation-finalized]"
          git push origin HEAD:fix/interest-intent-consolidation
