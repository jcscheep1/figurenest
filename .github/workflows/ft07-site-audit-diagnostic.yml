name: FT-07 Site Audit Diagnostic
on:
  push:
    branches: [expansion/ft-07-docx-pdf-gate]
    paths: ['.github/workflows/ft07-site-audit-diagnostic.yml']
permissions:
  contents: read
jobs:
  isolate:
    name: ${{ matrix.label }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: API tool catalog parity, check: api-tools }
          - { label: API category parity, check: api-categories }
          - { label: File-tools guide coverage, check: guide }
          - { label: Meta description safety, check: meta }
          - { label: Tool-count parity, check: counts }
          - { label: Related-tool graph, check: related }
          - { label: Sitemap exact parity, check: sitemap }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/ft-07-docx-pdf-gate
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply publication metadata candidate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          cat=Path('artifacts/calcstride/src/lib/file-tools-catalog.ts')
          c=cat.read_text(); marker="  'pdf-to-text': {"
          entry="""  'docx-to-pdf': {\n    slug: 'docx-to-pdf', name: 'DOCX to PDF', description: 'Convert a DOCX document to a best-effort PDF locally in your browser, with a sanitized preview before download and no document upload.', category: FILE_TOOLS_CATEGORY.name, categorySlug: FILE_TOOLS_CATEGORY.slug, href: '/file-tools/docx-to-pdf', tags: ['docx to pdf', 'word to pdf', 'document to pdf', 'private docx converter', 'browser word converter'], featured: false, h1: 'Convert DOCX to PDF', seoTitle: 'Free DOCX to PDF Converter | Private Browser | FigureNest', seoDescription: 'Convert DOCX to PDF locally in your browser. Preview the sanitized best-effort layout before download without uploading your document.', privacySummary: 'The DOCX, filename, extracted document content, preview and generated PDF remain in this browser tab and are not uploaded to a FigureNest conversion server.', limitations: ['Conversion is best-effort rather than a pixel-perfect copy of Microsoft Word.'], faqs: [{ question: 'Does FigureNest upload my DOCX?', answer: 'No. Conversion runs locally in your browser.' }], relatedRoutes: ['/file-tools/pdf-sign-edit', '/file-tools/pdf-to-text', '/file-tools/image-to-pdf'],\n  },\n"""
          if "'docx-to-pdf': {" not in c: c=c.replace(marker, entry+marker)
          cat.write_text(c)
          guide=Path('artifacts/calcstride/src/lib/file-tools-category-content.ts'); g=guide.read_text()
          if "slug: 'docx-to-pdf'" not in g:
              needle="    { slug: 'pdf-to-text', description: 'Extract the PDF text layer from selected pages locally, preview the result, and download a UTF-8 TXT file with clear page separators.' },"
              assert needle in g, 'stable PDF-to-text guide marker missing'
              g=g.replace(needle, needle+"\n    { slug: 'docx-to-pdf', description: 'Convert a DOCX file locally to a sanitized best-effort browser preview, then create and download a PDF without uploading document bytes, names, or extracted content.' },")
          guide.write_text(g)
          PY
      - run: pnpm --filter @workspace/calcstride generate:seo
      - name: Run direct assertion
        env:
          CHECK: ${{ matrix.check }}
        working-directory: artifacts/calcstride
        run: |
          cat > src/lib/ft07-diagnostic.ts <<'TS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import { catalogCategories, catalogTools } from '../../../api-server/src/routes/catalog';
          import { localCategories, localTools, publishedToolCount, publishedTools } from './catalog';
          import { categoryContent } from './category-content';
          import { getSeoForPath, publicRouteKeys } from './seo';
          import { relatedToolGraph, getRelatedTools } from './related-tools';
          import { toPublicPath } from './public-url';
          const check = process.env.CHECK;
          const toolShape=(x:any)=>({slug:x.slug,name:x.name,description:x.description,category:x.category,categorySlug:x.categorySlug,href:x.href,featured:x.featured,lastUpdated:x.lastUpdated});
          const catShape=(x:any)=>({slug:x.slug,name:x.name,description:x.description,accent:x.accent,toolCount:x.toolCount});
          if(check==='api-tools') assert.deepEqual(localTools.map(toolShape).sort((a,b)=>a.slug.localeCompare(b.slug)), catalogTools.map(toolShape).sort((a,b)=>a.slug.localeCompare(b.slug)));
          if(check==='api-categories') assert.deepEqual(localCategories.map(catShape).sort((a,b)=>a.slug.localeCompare(b.slug)), catalogCategories.map(catShape).sort((a,b)=>a.slug.localeCompare(b.slug)));
          if(check==='guide'){const described=new Set(categoryContent['file-tools'].toolDescriptions.map(x=>x.slug)); for(const tool of publishedTools.filter(x=>x.categorySlug==='file-tools')) assert.ok(described.has(tool.slug),tool.slug);}
          if(check==='meta'){const d=publicRouteKeys.map(p=>getSeoForPath(p).description); for(const [i,x] of d.entries()){assert.ok(x.length>=70&&x.length<=160,`${publicRouteKeys[i]}:${x.length}`); assert.match(x,/[.!?]$/);} assert.equal(new Set(d).size,d.length);}
          if(check==='counts'){assert.equal(localTools.length,publishedToolCount); assert.equal(localCategories.reduce((n,x)=>n+x.toolCount,0),publishedToolCount);}
          if(check==='related'){assert.equal(relatedToolGraph.size,publishedTools.length); for(const t of publishedTools) assert.ok(getRelatedTools(t.slug).length>=2,t.slug);}
          if(check==='sitemap'){const xml=fs.readFileSync('public/sitemap.xml','utf8'); const got=[...xml.matchAll(/<loc>https:\/\/figurenest\.com([^<]*)<\/loc>/g)].map(m=>m[1]||'/').sort(); const expected=[...new Set(publicRouteKeys.map(toPublicPath))].sort(); assert.deepEqual(got,expected);}
          TS
          pnpm exec tsx src/lib/ft07-diagnostic.ts
          rm src/lib/ft07-diagnostic.ts
