name: FT-07 Site Audit Diagnostic
on:
  push:
    branches: [expansion/ft-07-docx-pdf-gate]
    paths: ['.github/workflows/ft07-site-audit-diagnostic.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/ft-07-docx-pdf-gate
      - name: Repair applicability registry and retrigger publication
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          units=Path('artifacts/calcstride/src/lib/units-preferences.ts')
          s=units.read_text()
          old="  'pdf-sign-edit': unitless(), 'pdf-to-image': unitless(), 'image-to-pdf': unitless(), 'pdf-to-text': unitless(),"
          new="  'pdf-sign-edit': unitless(), 'pdf-to-image': unitless(), 'image-to-pdf': unitless(), 'pdf-to-text': unitless(), 'docx-to-pdf': unitless(),"
          assert old in s, 'expected File Tools applicability marker missing'
          units.write_text(s.replace(old,new,1))

          publish=Path('.github/workflows/ft07-publish-surface.yml')
          p=publish.read_text()
          first=p.splitlines()[0]
          p=p.replace(first, '# retrigger: DOCX applicability registry repaired; rerun complete publication gate', 1)
          publish.write_text(p)
          PY
          rm -f FT07_SITE_AUDIT_DIAGNOSTIC.md FT07_FULL_TEST_DIAGNOSTIC.md
          rm -f .github/workflows/ft07-full-test-diagnostic.yml .github/workflows/ft07-fix-publish-command.yml
          rm -f .github/workflows/ft07-site-audit-diagnostic.yml
      - name: Commit repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'FT-07: classify DOCX to PDF and clean diagnostics'
          git pull --rebase origin expansion/ft-07-docx-pdf-gate
          git push origin HEAD:expansion/ft-07-docx-pdf-gate
