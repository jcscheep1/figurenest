name: FT08 Gate
on: push
permissions:
  contents: write
jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm add --filter @workspace/calcstride --save-exact docx@9.7.1
      - run: pnpm exec tsc -b lib/api-client-react
      - run: pnpm --filter @workspace/calcstride typecheck
      - run: pnpm --filter @workspace/calcstride test
      - run: pnpm --filter @workspace/calcstride build:client
      - name: Persist verified research dependency
        run: |
          rm .github/workflows/ft08-dependency-gate.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add artifacts/calcstride/package.json pnpm-lock.yaml .github/workflows/ft08-dependency-gate.yml
          git commit -m 'FT-08: pin DOCX generator for research spike'
          git pull --rebase origin expansion/ft-08-pdf-docx-research
          git push origin HEAD:expansion/ft-08-pdf-docx-research
