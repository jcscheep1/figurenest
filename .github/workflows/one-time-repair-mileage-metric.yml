name: One-time Mileage metric repair

on:
  push:
    branches:
      - audit/mileage-metric-support
    paths:
      - '.github/workflows/one-time-repair-mileage-metric.yml'
      - 'scripts/one-time-repair-mileage-metric.py'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/mileage-metric-support
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc -b lib/api-client-react
      - run: python scripts/one-time-repair-mileage-metric.py
      - run: pnpm --filter @workspace/calcstride typecheck
      - run: pnpm --filter @workspace/calcstride generate:seo
      - run: pnpm --filter @workspace/calcstride test
      - run: pnpm --filter @workspace/calcstride build
      - name: Commit repaired production code
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/calcstride/src/lib/phase-four.ts
          git diff --cached --quiet && exit 0
          git commit -m 'Add metric support to Mileage Calculator'
          git push origin HEAD:audit/mileage-metric-support
