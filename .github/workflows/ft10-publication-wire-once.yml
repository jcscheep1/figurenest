name: FT-10 Atomic Publication Wire Once

on:
  push:
    branches: [expansion/ft-10-xlsx-pdf-gate]
    paths:
      - '.github/workflows/ft10-publication-wire-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/ft-10-xlsx-pdf-gate
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build workspace type dependency
        run: pnpm exec tsc -b lib/api-client-react
      - name: Apply source-only FT-10 publication wiring
        run: python3 scripts/ft10-publication-wire.py
      - name: Regenerate SEO and verify exact publication candidate
        working-directory: artifacts/calcstride
        run: |
          pnpm run generate:seo
          grep -F 'https://figurenest.com/file-tools/xlsx-to-pdf/' public/sitemap.xml
          pnpm exec tsx --test src/lib/ft10-xlsx-pdf.test.ts src/lib/ft10-xlsx-pdf-spike.test.ts
          pnpm run typecheck
          pnpm run build
      - name: Commit source-only publication candidate
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add artifacts/calcstride/src/App.tsx \
                  artifacts/calcstride/src/pages/XlsxToPdfPage.tsx \
                  artifacts/calcstride/src/lib/file-tools-catalog.ts \
                  artifacts/calcstride/src/lib/units-preferences.ts \
                  artifacts/calcstride/public/sitemap.xml \
                  artifacts/calcstride/public/robots.txt
          git commit -m 'feat(file-tools): publish XLSX to PDF (FT-10)'
          git push origin HEAD:expansion/ft-10-xlsx-pdf-gate
