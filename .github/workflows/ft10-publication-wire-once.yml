name: FT-10 Atomic Publication Wire Once

on:
  push:
    branches: [expansion/ft-10-xlsx-pdf-gate]
    paths:
      - '.github/workflows/ft10-publication-wire-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/ft-10-xlsx-pdf-gate
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply FT-10 publication wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'expected marker missing in {path}: {old[:80]}')
              p.write_text(text.replace(old, new, 1))

          app = 'artifacts/calcstride/src/App.tsx'
          replace_once(app,
            "const csvXlsxPages = import.meta.env.SSR ? await import('@/pages/CsvXlsxPages') : null;\n",
            "const csvXlsxPages = import.meta.env.SSR ? await import('@/pages/CsvXlsxPages') : null;\nconst xlsxToPdfPages = import.meta.env.SSR ? await import('@/pages/XlsxToPdfPage') : null;\n")
          replace_once(app,
            "const XlsxToCsvPage = csvXlsxPages?.XlsxToCsvPage\n  ?? lazy(() => import('@/pages/CsvXlsxPages').then(({ XlsxToCsvPage: page }) => ({ default: page })));\n",
            "const XlsxToCsvPage = csvXlsxPages?.XlsxToCsvPage\n  ?? lazy(() => import('@/pages/CsvXlsxPages').then(({ XlsxToCsvPage: page }) => ({ default: page })));\nconst XlsxToPdfPage = xlsxToPdfPages?.XlsxToPdfPage\n  ?? lazy(() => import('@/pages/XlsxToPdfPage').then(({ XlsxToPdfPage: page }) => ({ default: page })));\n")
          replace_once(app,
            "        <Route path=\"/file-tools/xlsx-to-csv\" component={XlsxToCsvPage} />\n",
            "        <Route path=\"/file-tools/xlsx-to-csv\" component={XlsxToCsvPage} />\n        <Route path=\"/file-tools/xlsx-to-pdf\" component={XlsxToPdfPage} />\n")

          page = 'artifacts/calcstride/src/pages/XlsxToPdfPage.tsx'
          replace_once(page,
            "import { CheckCircle2, Download } from 'lucide-react';\n",
            "import { ArrowLeft, CheckCircle2, Download } from 'lucide-react';\nimport { Shell } from '@/components/FigureNestShell';\nimport { Link } from '@/components/PublicLink';\nimport { Seo } from '@/pages/AppPages';\n")
          replace_once(page,
            "/**\n * FT-10 implementation surface. Deliberately unrouted until publication QA exists.\n * Do not add SEO/catalog/sitemap exposure merely because this component compiles.\n */\n",
            "/** Published FT-10 XLSX → PDF browser-local conversion surface. */\n")
          replace_once(page,
            "  return <main className=\"tool-page file-tool-page\" data-testid=\"ft10-unrouted-converter\">\n    <header className=\"file-tool-hero\">\n      <p className=\"eyebrow\">FT-10 unpublished implementation</p>\n",
            "  return <Shell>\n    <Seo path=\"/file-tools/xlsx-to-pdf\" />\n    <main className=\"tool-page file-tool-page\" data-testid=\"page-xlsx-to-pdf\">\n      <nav className=\"calc-breadcrumb\" aria-label=\"Breadcrumb\">\n        <Link href=\"/\"><ArrowLeft size={15} aria-hidden=\"true\" /> Home</Link>\n        <Link href=\"/category/file-tools\">PDF &amp; File Tools</Link>\n        <span aria-current=\"page\">/ XLSX TO PDF</span>\n      </nav>\n    <header className=\"file-tool-hero\">\n      <p className=\"eyebrow\">Private browser file tool</p>\n")
          replace_once(page,
            "  </main>;\n}\n",
            "    </main>\n  </Shell>;\n}\n")

          catalog = 'artifacts/calcstride/src/lib/file-tools-catalog.ts'
          p = Path(catalog)
          text = p.read_text()
          marker = "} as const satisfies Record<string, FileToolDefinition>;"
          if "'xlsx-to-pdf': {" in text:
              raise SystemExit('xlsx-to-pdf catalog entry already exists')
          entry = """  'xlsx-to-pdf': {\n    slug: 'xlsx-to-pdf',\n    name: 'XLSX to PDF',\n    description: 'Convert a selected XLSX worksheet or bounded cell range into a searchable PDF locally in your browser.',\n    category: FILE_TOOLS_CATEGORY.name,\n    categorySlug: FILE_TOOLS_CATEGORY.slug,\n    href: '/file-tools/xlsx-to-pdf',\n    tags: ['xlsx to pdf', 'excel to pdf', 'spreadsheet to pdf', 'private spreadsheet converter', 'browser excel converter'],\n    featured: false,\n    h1: 'Convert XLSX to PDF',\n    seoTitle: 'Free XLSX to PDF Converter | Private Browser | FigureNest',\n    seoDescription: 'Convert one XLSX worksheet or cell range to a searchable PDF locally in your browser. Choose page size and orientation without uploading the spreadsheet.',\n    privacySummary: 'The XLSX workbook, filename, selected cell content and generated PDF stay in this browser tab and are not uploaded to a FigureNest conversion server.',\n    limitations: [\n      'Conversion is best-effort table rendering, not a pixel-perfect Excel print export. Workbook styles, charts, pivots, conditional formatting and exact print settings are not preserved.',\n      'Formulas and macros are never recalculated or executed. Existing displayed cell values are treated as inert spreadsheet content.',\n      'Publication limits are intentionally conservative: up to 500 rows, 25 columns, 5,000 populated cells, 40 PDF pages and 2 MiB generated PDF output for the selected range.',\n      'Only XLSX packages that pass local OOXML/ZIP resource checks are processed. Malformed, suspicious or oversized workbooks fail closed locally.'\n    ],\n    faqs: [\n      { question: 'Does FigureNest upload my spreadsheet?', answer: 'No. XLSX inspection, worksheet selection, preview and PDF creation run locally in your browser. Workbook bytes, filenames, cell contents and generated PDFs are not sent to a FigureNest conversion server.' },\n      { question: 'Will the PDF look exactly like Excel?', answer: 'No. This tool creates a clean searchable table PDF from a selected worksheet or range. It does not reproduce Excel charts, pivots, conditional formatting, formulas, macros or exact print-layout settings.' },\n      { question: 'Can I choose a worksheet or cell range?', answer: 'Yes. Select a worksheet and optionally enter an A1-style range such as A1:F40 before creating the PDF.' },\n      { question: 'Are formulas recalculated?', answer: 'No. FigureNest never executes or recalculates workbook formulas or macros. Formula-looking text remains inert.' },\n      { question: 'Can I choose portrait or landscape output?', answer: 'Yes. Choose portrait or landscape orientation and A4 or Letter page size before generating the searchable PDF.' }\n    ],\n    relatedRoutes: ['/file-tools/xlsx-to-csv', '/file-tools/csv-to-xlsx', '/file-tools/docx-to-pdf'],\n  },\n"""
          if marker not in text:
              raise SystemExit('catalog closing marker missing')
          p.write_text(text.replace(marker, entry + marker, 1))

          units = 'artifacts/calcstride/src/lib/units-preferences.ts'
          replace_once(units,
            "'csv-to-xlsx': unitless(), 'xlsx-to-csv': unitless(),",
            "'csv-to-xlsx': unitless(), 'xlsx-to-csv': unitless(), 'xlsx-to-pdf': unitless(),")

          workflow = '.github/workflows/ft10-publication-browser-qa.yml'
          p = Path(workflow)
          text = p.read_text()
          text = text.replace("      - 'artifacts/calcstride/package.json'\n", "      - 'artifacts/calcstride/package.json'\n      - 'artifacts/calcstride/src/App.tsx'\n      - 'artifacts/calcstride/src/lib/file-tools-catalog.ts'\n      - 'artifacts/calcstride/src/lib/units-preferences.ts'\n      - 'artifacts/calcstride/public/sitemap.xml'\n")
          old = """      - name: Keep public wiring closed until publication commit\n        working-directory: artifacts/calcstride\n        run: |\n          if grep -R -n \"xlsx-to-pdf\" src --exclude='*.test.ts' --exclude='XlsxToPdfPage.tsx' --exclude='ft10-publication-qa.tsx' --exclude='ft10-browser-qa.ts'; then\n            echo 'FT-10 public wiring detected before publication commit'; exit 1\n          fi\n          pnpm run build\n"""
          new = """      - name: Require atomic FT-10 publication wiring\n        working-directory: artifacts/calcstride\n        run: |\n          grep -F 'path=\"/file-tools/xlsx-to-pdf\"' src/App.tsx\n          grep -F \"'xlsx-to-pdf': {\" src/lib/file-tools-catalog.ts\n          grep -F \"'xlsx-to-pdf': unitless()\" src/lib/units-preferences.ts\n          pnpm run generate:seo\n          grep -F 'https://figurenest.com/file-tools/xlsx-to-pdf/' public/sitemap.xml\n          pnpm run build\n"""
          if old not in text:
              raise SystemExit('publication gate closing marker missing')
          p.write_text(text.replace(old, new, 1))
          PY

      - name: Regenerate SEO files and run focused verification
        working-directory: artifacts/calcstride
        run: |
          pnpm run generate:seo
          pnpm exec tsx --test src/lib/ft10-xlsx-pdf.test.ts src/lib/ft10-xlsx-pdf-spike.test.ts
          pnpm run typecheck
          pnpm run build
      - name: Commit atomic publication wiring
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'feat(file-tools): publish XLSX to PDF (FT-10)'
          git push origin HEAD:expansion/ft-10-xlsx-pdf-gate
