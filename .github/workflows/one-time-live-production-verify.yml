name: One-time live production verification

on:
  push:
    paths:
      - '.github/workflows/one-time-live-production-verify.yml'

permissions:
  contents: read

jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependency
        run: pip install 'selenium==4.35.0'
      - name: Show browser version
        run: google-chrome --version || chromium --version || true
      - name: Verify current FigureNest production
        shell: python
        run: |
          import re
          import time
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait, Select
          from selenium.webdriver.support import expected_conditions as EC

          BASE = 'https://figurenest.com'
          options = webdriver.ChromeOptions()
          options.add_argument('--headless=new')
          options.add_argument('--no-sandbox')
          options.add_argument('--disable-dev-shm-usage')
          options.add_argument('--window-size=1440,1600')
          options.add_argument('--disable-gpu')
          driver = webdriver.Chrome(options=options)
          wait = WebDriverWait(driver, 20)

          def open_path(path):
              driver.get(BASE + path)
              wait.until(lambda d: d.execute_script('return document.readyState') == 'complete')
              wait.until(EC.presence_of_element_located((By.TAG_NAME, 'body')))
              time.sleep(0.35)

          def text(css):
              return wait.until(EC.presence_of_element_located((By.CSS_SELECTOR, css))).text.strip()

          def set_input(css, value):
              el = wait.until(EC.presence_of_element_located((By.CSS_SELECTOR, css)))
              driver.execute_script("""
                const el = arguments[0], value = arguments[1];
                const proto = el instanceof HTMLTextAreaElement ? HTMLTextAreaElement.prototype : HTMLInputElement.prototype;
                const setter = Object.getOwnPropertyDescriptor(proto, 'value').set;
                setter.call(el, value);
                el.dispatchEvent(new Event('input', {bubbles:true}));
                el.dispatchEvent(new Event('change', {bubbles:true}));
              """, el, value)
              time.sleep(0.15)

          def select_value(css, value):
              el = wait.until(EC.presence_of_element_located((By.CSS_SELECTOR, css)))
              Select(el).select_by_value(value)
              time.sleep(0.15)

          def label_input(label_text):
              labels = driver.find_elements(By.TAG_NAME, 'label')
              for label in labels:
                  if label_text.lower() in label.text.lower():
                      items = label.find_elements(By.CSS_SELECTOR, 'input,select,textarea')
                      if items:
                          return items[0]
              raise AssertionError(f'Could not find field label: {label_text}')

          def set_label_input(label_text, value):
              el = label_input(label_text)
              tag = el.tag_name.lower()
              if tag == 'select':
                  Select(el).select_by_value(value)
              else:
                  driver.execute_script("""
                    const el = arguments[0], value = arguments[1];
                    const proto = el instanceof HTMLTextAreaElement ? HTMLTextAreaElement.prototype : HTMLInputElement.prototype;
                    Object.getOwnPropertyDescriptor(proto, 'value').set.call(el, value);
                    el.dispatchEvent(new Event('input', {bubbles:true}));
                    el.dispatchEvent(new Event('change', {bubbles:true}));
                  """, el, value)
              time.sleep(0.15)

          results = []
          def passed(name, detail=''):
              results.append((name, detail))
              print(f'PASS: {name}' + (f' — {detail}' if detail else ''))

          try:
              open_path('/calculators/')
              count_text = text('[data-testid="text-directory-result-count"]')
              assert count_text.startswith('162 '), count_text
              buttons = driver.find_elements(By.CSS_SELECTOR, '[data-testid^="button-directory-category-"]')
              category_buttons = [b for b in buttons if b.get_attribute('data-testid') != 'button-directory-category-all']
              assert len(category_buttons) == 14, f'expected 14 categories, found {len(category_buttons)}'
              for original in category_buttons:
                  testid = original.get_attribute('data-testid')
                  slug = testid.replace('button-directory-category-', '')
                  label = original.text.strip().casefold()
                  button = wait.until(EC.presence_of_element_located((By.CSS_SELECTOR, f'[data-testid="{testid}"]')))
                  driver.execute_script('arguments[0].click()', button)
                  wait.until(lambda d, s=slug: f'category={s}' in d.current_url)
                  time.sleep(0.15)
                  current_count = int(re.search(r'\d+', text('[data-testid="text-directory-result-count"]')).group())
                  cards = driver.find_elements(By.CSS_SELECTOR, '.calculator-directory-card')
                  assert current_count == len(cards), f'{slug}: count {current_count} != cards {len(cards)}'
                  assert current_count > 0, f'{slug}: no tools'
                  card_categories = {c.text.strip().casefold() for c in driver.find_elements(By.CSS_SELECTOR, '.calculator-directory-card-category')}
                  if slug == 'construction':
                      assert 'home & construction' in card_categories, card_categories
                      assert 'electrical' in card_categories, f'construction did not include Electrical: {card_categories}'
                      assert current_count == 25, f'construction expected 25 combined results, got {current_count}'
                  elif slug == 'electrical':
                      assert card_categories == {'electrical'}, card_categories
                      assert current_count == 4, f'electrical expected 4 results, got {current_count}'
                  else:
                      assert card_categories == {label}, f'{slug}: {card_categories} != {label}'
              passed('FN-004 directory/category filtering', '14/14 categories; construction includes 4 Electrical tools')

              open_path('/converters/shoe-size')
              group = Select(wait.until(EC.presence_of_element_located((By.CSS_SELECTOR, '[data-testid="select-shoe-group"]'))))
              option_text = {o.text.strip() for o in group.options}
              assert {'Baby / toddler', 'Children / youth', 'Women', 'Men'} <= option_text, option_text
              group.select_by_value('kids')
              time.sleep(0.2)
              shoe_result = text('.advanced-result-output')
              assert 'Children / youth' in shoe_result and 'EU' in shoe_result, shoe_result
              passed('FN-005-A Shoe Size Converter', 'baby, youth, women and men modes live')

              open_path('/calculators/date-time/time-card')
              set_label_input('Clock in', '09:00')
              set_label_input('Clock out', '17:30')
              set_label_input('Unpaid break', '30')
              set_label_input('Hourly rate', '20')
              gross = text('.advanced-result strong')
              assert '160' in gross, gross
              breakdown = driver.find_element(By.CSS_SELECTOR, '.advanced-breakdown').text
              assert 'Regular pay' in breakdown and '160' in breakdown, breakdown
              passed('FN-005-B Time Card Calculator', f'gross pay visible: {gross}')

              open_path('/calculators/business/markup')
              set_input('[data-testid="input-business-cost"]', '0')
              set_input('[data-testid="input-business-markup"]', '40')
              markup_result = text('[data-testid="business-calculator-result"]')
              detail_text = driver.find_element(By.CSS_SELECTOR, '.advanced-breakdown').text
              assert '0.00' in markup_result, markup_result
              assert 'Equivalent margin' in detail_text and 'Not defined' in detail_text, detail_text
              passed('FN-005-C Markup Calculator', 'zero-cost equivalent margin is Not defined')

              open_path('/converters/length')
              select_value('[data-testid="select-converter-from"]', 'm')
              select_value('[data-testid="select-converter-to"]', 'km')
              set_input('[data-testid="input-converter-value"]', '0.001')
              converter_result = text('[data-testid="text-calculation-result"]')
              numeric = float(converter_result.split()[0].replace(',', ''))
              assert numeric > 0 and abs(numeric - 0.000001) < 1e-12, converter_result
              passed('FN-005-D Converter precision', converter_result)

              open_path('/calculators/business/commission')
              set_input('#calculator-commission-sales', '10000')
              set_input('#calculator-commission-rate', '8')
              set_input('#calculator-commission-base', '')
              commission_panel = driver.find_element(By.CSS_SELECTOR, '.advanced-result')
              assert 'has-error' not in commission_panel.get_attribute('class'), commission_panel.text
              commission_result = text('.advanced-result-output')
              assert '800.00' in commission_result, commission_result
              passed('FN-005-E Commission Calculator', f'blank base pay accepted: {commission_result}')

              open_path('/calculators/finance/apr')
              set_input('#calculator-apr-amount', '10000')
              set_input('#calculator-apr-fees', '200')
              set_input('#calculator-apr-received', '9800')
              set_input('#calculator-apr-payment', '165')
              set_input('#calculator-apr-months', '60')
              apr_panel = driver.find_element(By.CSS_SELECTOR, '.advanced-result')
              assert 'has-error' not in apr_panel.get_attribute('class'), apr_panel.text
              apr_result = text('.advanced-result-output')
              assert apr_result.startswith('0.40% APR'), apr_result
              passed('FN-005-F APR Calculator', apr_result)

              open_path('/converters/roman-numeral')
              set_input('#calculator-roman-numeral-number', '1.5')
              roman_panel = driver.find_element(By.CSS_SELECTOR, '.advanced-result')
              assert 'has-error' in roman_panel.get_attribute('class'), roman_panel.text
              assert 'whole number' in roman_panel.text.lower(), roman_panel.text
              set_input('#calculator-roman-numeral-number', '2026')
              roman_panel = driver.find_element(By.CSS_SELECTOR, '.advanced-result')
              assert 'has-error' not in roman_panel.get_attribute('class'), roman_panel.text
              roman_result = text('.advanced-result-output')
              assert roman_result == 'MMXXVI', roman_result
              passed('FN-005-G Roman Numeral Converter', 'decimal rejected; 2026 = MMXXVI')

              open_path('/calculators/math/matrix')
              select_value('[data-testid="input-matrix-operation"]', 'determinant')
              set_input('[data-testid="input-matrix-rows"]', '2')
              set_input('[data-testid="input-matrix-columns"]', '2')
              set_input('[data-testid="input-matrix-bRows"]', '')
              set_input('[data-testid="input-matrix-bColumns"]', '')
              set_input('[data-testid="input-matrix-matrixA"]', '1,2\n3,4')
              set_input('[data-testid="input-matrix-matrixB"]', '')
              matrix_status = wait.until(EC.presence_of_element_located((By.CSS_SELECTOR, '[data-testid="status-matrix"]')))
              assert 'has-error' not in matrix_status.get_attribute('class'), matrix_status.text
              matrix_result = matrix_status.find_element(By.CSS_SELECTOR, '.advanced-result-output').text.strip()
              assert matrix_result == '-2', matrix_result
              passed('FN-005-H Matrix Calculator', 'determinant(A) works with Matrix B blank')

              open_path('/calculators/finance/percentage')
              set_input('[data-testid="input-calc-0"]', '')
              percentage_result = text('[data-testid="text-calculation-result"]')
              copy_disabled = driver.find_element(By.CSS_SELECTOR, '[data-testid="button-copy-result"]').get_attribute('disabled') is not None
              assert 'Complete every field' in percentage_result and copy_disabled, percentage_result
              set_input('[data-testid="input-calc-0"]', '25')
              set_input('[data-testid="input-calc-1"]', '80')
              percentage_result = text('[data-testid="text-calculation-result"]')
              assert percentage_result == '20', percentage_result
              set_input('[data-testid="input-calc-0"]', '0')
              percentage_result = text('[data-testid="text-calculation-result"]')
              assert percentage_result == '0', percentage_result
              passed('FN-005-I Percentage Calculator', 'blank rejected; 25% of 80 = 20; true zero valid')

              open_path('/calculators/date-time/date-difference')
              h1 = text('h1')
              assert 'Date Calculator' in h1 and 'Day Counter' in h1, h1
              passed('Date Calculator naming alignment', h1.replace('\n', ' '))

              print('\nLIVE PRODUCTION VERIFICATION COMPLETE')
              for name, detail in results:
                  print(f' - {name}: {detail}')
          finally:
              driver.quit()
