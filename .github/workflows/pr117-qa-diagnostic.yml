name: PR117 QA diagnostic

on:
  push:
    branches:
      - expansion/batch-1-business-marketing

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc -b lib/api-client-react
      - name: Focused Business growth tests
        run: pnpm --filter @workspace/calcstride exec tsx --test src/lib/business-growth-calculators.test.ts src/lib/business-growth-integration.test.ts |& tee focused-tests.log
      - name: Generate SEO files
        run: pnpm --filter @workspace/calcstride generate:seo
      - name: Full Calcstride unit suite after SEO generation
        id: fulltests
        continue-on-error: true
        run: pnpm --filter @workspace/calcstride test |& tee full-tests.log
      - name: Upload diagnostic logs
        uses: actions/upload-artifact@v4
        with:
          name: pr117-qa-diagnostic-${{ github.sha }}
          path: |
            focused-tests.log
            full-tests.log
      - name: Propagate unit-test result
        if: steps.fulltests.outcome == 'failure'
        run: exit 1
