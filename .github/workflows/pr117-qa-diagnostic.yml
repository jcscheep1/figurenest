name: PR117 QA diagnostic

on:
  push:
    branches:
      - expansion/batch-1-business-marketing

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/batch-1-business-marketing
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: python .github/pr117_qa_repair.py
      - run: pnpm exec tsc -b lib/api-client-react
      - name: Focused Business growth tests
        run: |
          set -o pipefail
          pnpm --filter @workspace/calcstride exec tsx --test src/lib/business-growth-calculators.test.ts src/lib/business-growth-integration.test.ts |& tee focused-tests.log
      - name: Full Calcstride unit suite
        continue-on-error: true
        id: fulltests
        run: |
          set -o pipefail
          pnpm --filter @workspace/calcstride test |& tee full-tests.log
      - name: Commit evidence-backed repair
        if: always()
        run: |
          rm -f .github/pr117_qa_repair.py .github/workflows/pr117-qa-diagnostic.yml .github/workflows/pr117-one-time-qa-repair.yml
          git config user.name figurenest-qa
          git config user.email actions@users.noreply.github.com
          git add -A
          git commit -m "qa: repair Business expansion integration contracts"
          git push origin HEAD:expansion/batch-1-business-marketing
      - name: Propagate full-suite result
        if: steps.fulltests.outcome == 'failure'
        run: exit 1
