name: One-time live audit Loan Calculator

on:
  push:
    paths:
      - '.github/workflows/one-time-live-audit-loan.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Selenium
        run: pip install 'selenium==4.35.0'
      - name: Audit production Loan behavior
        shell: python
        run: |
          import time
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.common.keys import Keys
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC

          options = webdriver.ChromeOptions()
          options.add_argument('--headless=new')
          options.add_argument('--no-sandbox')
          options.add_argument('--disable-dev-shm-usage')
          options.add_argument('--window-size=1440,1600')
          driver = webdriver.Chrome(options=options)
          wait = WebDriverWait(driver, 20)
          failures = []

          def type_input(css, value):
              el = wait.until(EC.presence_of_element_located((By.CSS_SELECTOR, css)))
              driver.execute_script('arguments[0].scrollIntoView({block:"center"})', el)
              driver.execute_script('arguments[0].focus()', el)
              el = driver.find_element(By.CSS_SELECTOR, css)
              el.send_keys(Keys.CONTROL, 'a')
              el.send_keys(Keys.BACKSPACE)
              if value != '': el.send_keys(value)
              el.send_keys(Keys.TAB)
              time.sleep(0.35)

          def check(name, fn):
              try:
                  fn()
                  print('PASS:', name)
              except Exception as exc:
                  failures.append(f'{name}: {exc}')
                  print('FAIL:', name, exc)

          try:
              driver.get('https://figurenest.com/calculators/finance/loan')
              wait.until(EC.presence_of_element_located((By.CSS_SELECTOR, '[data-testid="input-finance-principal"]')))
              consent = driver.find_elements(By.CSS_SELECTOR, '.consent-panel .consent-choice')
              if consent:
                  consent[0].click()
                  wait.until(EC.invisibility_of_element_located((By.CSS_SELECTOR, '.consent-panel')))
                  time.sleep(0.2)

              def normal():
                  type_input('[data-testid="input-finance-principal"]', '24000')
                  type_input('[data-testid="input-finance-rate"]', '7.2')
                  type_input('[data-testid="input-finance-years"]', '5')
                  panel = driver.find_element(By.CSS_SELECTOR, '.advanced-result')
                  assert 'has-error' not in panel.get_attribute('class'), panel.text
                  assert '$477.50' in panel.text, panel.text
                  breakdown = driver.find_element(By.CSS_SELECTOR, '.advanced-breakdown').text
                  assert '$28,649.80' in breakdown and '$4,649.80' in breakdown, breakdown
              check('normal 24000 at 7.2% for 5 years', normal)

              def zero_rate():
                  type_input('[data-testid="input-finance-principal"]', '18000')
                  type_input('[data-testid="input-finance-rate"]', '0')
                  type_input('[data-testid="input-finance-years"]', '3')
                  panel = driver.find_element(By.CSS_SELECTOR, '.advanced-result')
                  assert 'has-error' not in panel.get_attribute('class'), panel.text
                  assert '$500.00' in panel.text, panel.text
                  breakdown = driver.find_element(By.CSS_SELECTOR, '.advanced-breakdown').text
                  assert '$18,000.00' in breakdown and '$0.00' in breakdown, breakdown
              check('zero-rate boundary', zero_rate)

              def blank_principal():
                  type_input('[data-testid="input-finance-principal"]', '')
                  panel = driver.find_element(By.CSS_SELECTOR, '.advanced-result')
                  assert 'has-error' in panel.get_attribute('class'), 'blank principal produced: ' + panel.text
              check('blank required principal rejected', blank_principal)

              def blank_rate():
                  type_input('[data-testid="input-finance-principal"]', '24000')
                  type_input('[data-testid="input-finance-rate"]', '')
                  panel = driver.find_element(By.CSS_SELECTOR, '.advanced-result')
                  assert 'has-error' in panel.get_attribute('class'), 'blank rate produced: ' + panel.text
              check('blank required rate rejected', blank_rate)

              def zero_term():
                  type_input('[data-testid="input-finance-rate"]', '7.2')
                  type_input('[data-testid="input-finance-years"]', '0')
                  panel = driver.find_element(By.CSS_SELECTOR, '.advanced-result')
                  assert 'has-error' in panel.get_attribute('class'), panel.text
                  assert 'greater than zero' in panel.text.lower(), panel.text
              check('zero term rejected', zero_term)

              def fractional_term():
                  type_input('[data-testid="input-finance-years"]', '5.01')
                  panel = driver.find_element(By.CSS_SELECTOR, '.advanced-result')
                  assert 'has-error' in panel.get_attribute('class'), 'fractional-month term produced: ' + panel.text
              check('non-month-aligned term rejected', fractional_term)

              def advanced_normal():
                  type_input('[data-testid="input-finance-years"]', '5')
                  buttons = driver.find_elements(By.CSS_SELECTOR, '.calculator-mode-options button')
                  assert len(buttons) == 2
                  driver.execute_script('arguments[0].click()', buttons[1]); time.sleep(0.35)
                  body = driver.find_element(By.CSS_SELECTOR, '.decision-expansion-body')
                  assert 'Payment including extra' in body.text and '$477.50' in body.text, body.text
                  assert '5 yr 0 mo' in body.text, body.text
              check('advanced mode baseline matches Basic schedule', advanced_normal)

              if failures:
                  raise AssertionError('\n'.join(failures))
          finally:
              driver.quit()
