name: FT-09 SheetJS Fixture Spike v2

on:
  push:
    branches: [expansion/ft-09-csv-xlsx-gate]
    paths:
      - .github/workflows/ft09-sheetjs-fixture-spike-v2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  spike:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/ft-09-csv-xlsx-gate
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install exact authoritative SheetJS CE research dependency
        run: pnpm --filter @workspace/calcstride add --save-exact 'xlsx@https://cdn.sheetjs.com/xlsx-0.20.3/xlsx-0.20.3.tgz'
      - name: Write conversion/reopen research fixture
        shell: bash
        run: |
          cat > artifacts/calcstride/src/lib/ft09-sheetjs-research.test.ts <<'EOF'
          import assert from 'node:assert/strict';
          import test from 'node:test';
          import * as XLSX from 'xlsx';
          import { preflightXlsxZip } from './xlsx-zip-preflight';
          import { quoteCsvCell } from './csv-spreadsheet-safety';

          function rowsToSafeCsv(rows: unknown[][]): string {
            return rows.map((row) => row.map(quoteCsvCell).join(',')).join('\r\n');
          }

          test('round-trips CSV through XLSX and reopens deterministically', () => {
            const sourceCsv = [
              'id,name,note,amount',
              '00123,Zoë,"hello, world",-12.5',
              '00456,李,"line one\nline two",3.25',
            ].join('\r\n');
            const csvWorkbook = XLSX.read(sourceCsv, { type: 'string', raw: true });
            const sourceRows = XLSX.utils.sheet_to_json<unknown[]>(csvWorkbook.Sheets[csvWorkbook.SheetNames[0]], { header: 1, raw: true, defval: '' });
            assert.deepEqual(sourceRows, [
              ['id', 'name', 'note', 'amount'],
              ['00123', 'Zoë', 'hello, world', '-12.5'],
              ['00456', '李', 'line one\nline two', '3.25'],
            ]);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, XLSX.utils.aoa_to_sheet(sourceRows), 'Data');
            const xlsxBytes = XLSX.write(workbook, { type: 'buffer', bookType: 'xlsx', compression: true });
            const zipEvidence = preflightXlsxZip(new Uint8Array(xlsxBytes));
            assert.equal(zipEvidence.ok, true);
            if (!zipEvidence.ok) throw new Error(`Generated XLSX failed preflight: ${zipEvidence.reason}`);
            assert.ok(zipEvidence.entries > 0);
            assert.ok(zipEvidence.uncompressedBytes > 0);
            const reopened = XLSX.read(xlsxBytes, { type: 'buffer', raw: true });
            assert.deepEqual(XLSX.utils.sheet_to_json<unknown[]>(reopened.Sheets.Data, { header: 1, raw: true, defval: '' }), sourceRows);
          });

          test('keeps formula-looking values as strings and safe CSV neutralizes them', () => {
            const rows = [
              ['payload', 'negative'],
              ['=2+2', '-1'],
              ['+SUM(A1:A2)', '-0.25'],
              ['@cmd', '-1e6'],
              ['-HYPERLINK("https://example.invalid")', '-.5'],
            ];
            const sheet = XLSX.utils.aoa_to_sheet(rows);
            assert.equal(sheet.A2.t, 's');
            assert.equal(sheet.A2.f, undefined);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, sheet, 'Data');
            const xlsxBytes = XLSX.write(workbook, { type: 'buffer', bookType: 'xlsx' });
            const reopened = XLSX.read(xlsxBytes, { type: 'buffer', raw: true, cellFormula: true });
            assert.equal(reopened.Sheets.Data.A2.f, undefined);
            assert.equal(reopened.Sheets.Data.A2.v, '=2+2');
            const reopenedRows = XLSX.utils.sheet_to_json<unknown[]>(reopened.Sheets.Data, { header: 1, raw: true, defval: '' });
            const csv = rowsToSafeCsv(reopenedRows);
            assert.match(csv, /'=2\+2/);
            assert.match(csv, /'\+SUM\(A1:A2\)/);
            assert.match(csv, /'@cmd/);
            assert.match(csv, /'-HYPERLINK/);
            assert.match(csv, /,-1(?:\r?\n|$)/);
            assert.match(csv, /,-0\.25(?:\r?\n|$)/);
            assert.match(csv, /,-1e6(?:\r?\n|$)/);
            assert.match(csv, /,-\.5(?:\r?\n|$)/);
          });
          EOF
      - name: Focused FT-09 tests
        run: pnpm --filter @workspace/calcstride exec tsx --test src/lib/xlsx-zip-preflight.test.ts src/lib/csv-spreadsheet-safety.test.ts src/lib/ft09-sheetjs-research.test.ts
      - run: pnpm exec tsc -b lib/api-client-react
      - run: pnpm --filter @workspace/calcstride typecheck
      - run: pnpm --filter @workspace/calcstride test
      - run: pnpm --filter @workspace/calcstride build
      - name: Record checksum and evidence
        shell: bash
        run: |
          curl -fsSL 'https://cdn.sheetjs.com/xlsx-0.20.3/xlsx-0.20.3.tgz' -o /tmp/xlsx.tgz
          SHA256=$(sha256sum /tmp/xlsx.tgz | awk '{print $1}')
          cat >> docs/FT09_CSV_XLSX_RESEARCH_GATE.md <<EOF

          ## Executable SheetJS CE 0.20.3 fixture spike
          - authoritative source: \`https://cdn.sheetjs.com/xlsx-0.20.3/xlsx-0.20.3.tgz\`
          - observed tarball SHA-256: \`${SHA256}\`
          - deterministic CSV → XLSX → reopen: PASS
          - Unicode, quoted comma/newline and leading-zero text preservation: PASS
          - formula-looking inputs remain string cells; no generated formula field: PASS
          - safe CSV neutralization preserves genuine negative numbers: PASS
          - generated OOXML passes the dependency-independent ZIP preflight before reopen: PASS
          - repository typecheck, full unit suite and production build: PASS

          Research only: runtime CDN loading remains forbidden. Publication still requires browser privacy/storage, mobile/resource and lazy-bundle evidence plus immutable dependency disposition.
          EOF
      - name: Commit guarded evidence
        shell: bash
        run: |
          git config user.name 'FigureNest Pipeline'
          git config user.email 'actions@users.noreply.github.com'
          git add artifacts/calcstride/package.json pnpm-lock.yaml artifacts/calcstride/src/lib/ft09-sheetjs-research.test.ts docs/FT09_CSV_XLSX_RESEARCH_GATE.md
          git commit -m 'test(ft-09): prove SheetJS conversion and reopen spike'
          git push origin HEAD:expansion/ft-09-csv-xlsx-gate
