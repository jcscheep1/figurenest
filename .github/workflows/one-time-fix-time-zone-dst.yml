name: One-time Time Zone DST repair

on:
  push:
    paths:
      - '.github/workflows/one-time-fix-time-zone-dst.yml'
      - 'scripts/one-time-fix-time-zone-dst.py'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply guarded Time Zone DST repair
        run: python scripts/one-time-fix-time-zone-dst.py
      - name: Build workspace type dependency
        run: pnpm exec tsc -b lib/api-client-react
      - name: Run calculator regression suite
        run: pnpm --filter @workspace/calcstride test
      - name: Typecheck calculator app
        run: pnpm --filter @workspace/calcstride typecheck
      - name: Build calculator app
        run: pnpm --filter @workspace/calcstride build
      - name: Commit passing Time Zone repair
        run: |
          git config user.name 'FigureNest Repair Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add artifacts/calcstride/src/lib/phase-two-expansion.ts artifacts/calcstride/src/lib/time-zone-dst-regression.test.ts
          git diff --cached --quiet && exit 0
          git commit -m 'Fix Time Zone DST wall-time resolution'
          git push origin HEAD:audit/time-zone-dst-gap
