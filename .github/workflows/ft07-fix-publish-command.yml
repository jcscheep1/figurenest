name: FT-07 Repair Publish Command
on:
  push:
    branches: [expansion/ft-07-docx-pdf-gate]
    paths: ['.github/workflows/ft07-fix-publish-command.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expansion/ft-07-docx-pdf-gate
      - name: Repair publication command and clean diagnostics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('.github/workflows/ft07-publish-surface.yml')
          s=path.read_text()
          old='run: pnpm exec tsx --test artifacts/calcstride/src/lib/site-audit.test.ts'
          new='run: pnpm --filter @workspace/calcstride exec tsx --test src/lib/site-audit.test.ts'
          assert old in s, 'expected root-scoped site-audit command not found'
          path.write_text(s.replace(old,new))
          PY
          rm -f .github/workflows/ft07-site-audit-diagnostic.yml FT07_SITE_AUDIT_DIAGNOSTIC.md .github/workflows/ft07-fix-publish-command.yml
      - name: Commit repaired publication workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'FT-07: run publication audit in Calcstride package context'
          git push origin HEAD:expansion/ft-07-docx-pdf-gate
