name: One-time Interest final failure

on:
  push:
    branches:
      - fix/interest-intent-consolidation

permissions:
  contents: write

jobs:
  diagnose:
    if: ${{ !contains(github.event.head_commit.message, '[interest-final-failure]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/interest-intent-consolidation
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc -b lib/api-client-react
      - name: Capture failure summary
        shell: bash
        run: |
          set +e
          pnpm --filter @workspace/calcstride test > /tmp/full-test.txt 2>&1
          status=$?
          python <<'PY'
          from pathlib import Path
          lines = Path('/tmp/full-test.txt').read_text().splitlines()
          hits = [i for i, line in enumerate(lines) if line.startswith('not ok ')]
          out = []
          for i in hits:
              lo, hi = max(0, i - 8), min(len(lines), i + 24)
              out.append('\n'.join(lines[lo:hi]))
          Path('interest-final-failure.txt').write_text('\n\n---\n\n'.join(out) + '\n')
          PY
          echo "exit_status=$status" >> interest-final-failure.txt
          rm .github/workflows/one-time-interest-final-failure.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Capture final Interest failure [interest-final-failure]"
          git push origin HEAD:fix/interest-intent-consolidation
