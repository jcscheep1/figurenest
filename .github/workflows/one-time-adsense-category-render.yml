name: One-time AdSense category rendering remediation

on:
  push:
    branches:
      - adsense/low-value-content-gate
    paths:
      - '.github/workflows/one-time-adsense-category-render.yml'

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: adsense/low-value-content-gate
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Apply rich category destination rendering
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          page_path = Path('artifacts/calcstride/src/pages/AppPages.tsx')
          css_path = Path('artifacts/calcstride/src/index.css')
          audit_path = Path('scripts/adsense-readiness-audit.mjs')

          page = page_path.read_text()
          old = '''export function CategoryPage() {
            const [, params] = useRoute('/category/:slug');
            const { tools, categories } = useCatalog();
            const category = categories.find((item) => item.slug === params?.slug) ?? localCategories.find((item) => item.slug === params?.slug);
            const visible = tools.filter((tool) => tool.categorySlug === params?.slug);
            if (!category) return <Shell><NotFoundInner /></Shell>;
            const introduction = categoryContent[category.slug as keyof typeof categoryContent]?.introduction[0] ?? category.description;
            return <Shell><Seo path={`/category/${category.slug}`} /><section className="page-intro category-intro"><Link href="/calculators" className="back-link" data-testid="link-back-home"><ArrowLeft size={15} aria-hidden="true" /> All calculators</Link><div className="eyebrow">CATEGORY / {category.name.toUpperCase()}</div><h1>{category.name}<span>.</span></h1><p>{introduction}</p><div className="intro-meta mono">{visible.length} PUBLISHED TOOLS</div></section><section className="section-block category-results"><div className="section-heading"><h2>Tools in {category.name.toLowerCase()}</h2><span className="mono result-count">{visible.length} RESULTS</span></div>{visible.length ? <div className="tool-list-grid">{visible.map((tool) => <ToolCard tool={tool} key={tool.slug} />)}</div> : <EmptyState />}</section></Shell>;
          }
          '''
          new = '''export function CategoryPage() {
            const [, params] = useRoute('/category/:slug');
            const { tools, categories } = useCatalog();
            const category = categories.find((item) => item.slug === params?.slug) ?? localCategories.find((item) => item.slug === params?.slug);
            const visible = tools.filter((tool) => tool.categorySlug === params?.slug);
            if (!category) return <Shell><NotFoundInner /></Shell>;
            const content = categoryContent[category.slug as keyof typeof categoryContent];
            const introductions = content?.introduction?.length ? content.introduction : [category.description];
            const describedTools = content?.toolDescriptions
              .map((item) => ({ ...item, tool: visible.find((tool) => tool.slug === item.slug) }))
              .filter((item) => item.tool) ?? [];
            return <Shell><Seo path={`/category/${category.slug}`} />
              <section className="page-intro category-intro">
                <Link href="/calculators" className="back-link" data-testid="link-back-home"><ArrowLeft size={15} aria-hidden="true" /> All calculators</Link>
                <div className="eyebrow">CATEGORY / {category.name.toUpperCase()}</div>
                <h1>{category.name}<span>.</span></h1>
                <p>{introductions[0]}</p>
                <div className="intro-meta mono">{visible.length} PUBLISHED TOOLS</div>
              </section>
              <section className="section-block category-results">
                <div className="section-heading"><h2>Tools in {category.name.toLowerCase()}</h2><span className="mono result-count">{visible.length} RESULTS</span></div>
                {visible.length ? <div className="tool-list-grid">{visible.map((tool) => <ToolCard tool={tool} key={tool.slug} />)}</div> : <EmptyState />}
              </section>
              {content && <section className="section-block category-editorial" aria-label={`${category.name} calculator guidance`}>
                <div className="category-editorial-grid">
                  <article className="category-content-card category-content-card-wide">
                    <div className="eyebrow">USE THIS CATEGORY WELL</div>
                    <h2>What these {category.name.toLowerCase()} tools help you work out</h2>
                    {introductions.slice(1).map((paragraph) => <p key={paragraph}>{paragraph}</p>)}
                    <ul>{content.questionsAnswered.map((question) => <li key={question}>{question}</li>)}</ul>
                  </article>

                  <article className="category-content-card">
                    <div className="eyebrow">CHOOSING A TOOL</div>
                    <h2>Start with the question, not the calculator name</h2>
                    {content.choosingTools.map((paragraph) => <p key={paragraph}>{paragraph}</p>)}
                  </article>

                  <article className="category-content-card">
                    <div className="eyebrow">UNITS, CURRENCY &amp; INPUTS</div>
                    <h2>Keep the assumptions consistent</h2>
                    {content.unitCurrencyGuidance.map((paragraph) => <p key={paragraph}>{paragraph}</p>)}
                  </article>
                </div>

                {describedTools.length > 0 && <div className="category-content-section">
                  <div className="section-heading"><div><div className="eyebrow">TOOL GUIDE</div><h2>Which calculator should I use?</h2></div></div>
                  <div className="category-tool-guide-grid">
                    {describedTools.map(({ slug, description, tool }) => tool && <Link href={tool.href} className="category-tool-guide" key={slug}>
                      <strong>{tool.name}</strong><p>{description}</p><span>Open tool <ArrowRight size={14} aria-hidden="true" /></span>
                    </Link>)}
                  </div>
                </div>}

                {content.relatedGuides.length > 0 && <div className="category-content-section">
                  <div className="section-heading"><div><div className="eyebrow">RELATED GUIDES</div><h2>Understand the method behind the result</h2></div></div>
                  <div className="category-related-guides">
                    {content.relatedGuides.map((guide) => <Link href={guide.href} className="category-guide-card" key={guide.href}>
                      <strong>{guide.label}</strong><p>{guide.description}</p><span>Read guide <ArrowRight size={14} aria-hidden="true" /></span>
                    </Link>)}
                  </div>
                </div>}

                {content.faqs.length > 0 && <div className="category-content-section category-faq-section">
                  <div className="eyebrow">COMMON QUESTIONS</div><h2>{category.name} calculator FAQs</h2>
                  <div className="category-faq-list">{content.faqs.map((faq) => <details className="category-faq-item" key={faq.question}><summary>{faq.question}</summary><p>{faq.answer}</p></details>)}</div>
                </div>}

                <div className="category-trust-links" aria-label="FigureNest calculation standards">
                  <strong>Check how FigureNest builds and reviews results.</strong>
                  <div><Link href="/methodology">Methodology &amp; accuracy <ArrowRight size={14} aria-hidden="true" /></Link><Link href="/disclaimer">Important limitations <ArrowRight size={14} aria-hidden="true" /></Link><Link href="/about">About FigureNest <ArrowRight size={14} aria-hidden="true" /></Link></div>
                </div>
              </section>}
            </Shell>;
          }
          '''
          if old not in page:
              raise SystemExit('CategoryPage source did not match expected exact green-head block; refusing unsafe rewrite')
          page_path.write_text(page.replace(old, new, 1))

          css = css_path.read_text()
          marker = '/* AdSense category destination content */'
          if marker in css:
              raise SystemExit('Category destination styles already exist; refusing duplicate append')
          css += '''\n\n/* AdSense category destination content */
          .category-editorial { padding-top: 12px; padding-bottom: 72px; }
          .category-editorial-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
          .category-content-card { border: 1px solid var(--border); border-radius: 8px; background: var(--card); padding: clamp(22px, 3vw, 34px); box-shadow: var(--shadow-sm); }
          .category-content-card-wide { grid-column: 1 / -1; }
          .category-content-card h2, .category-content-section h2 { font: 700 clamp(24px, 3vw, 34px)/1.15 var(--app-font-sans); letter-spacing: -0.02em; margin: 10px 0 16px; color: var(--ink); }
          .category-content-card p, .category-content-card li, .category-tool-guide p, .category-guide-card p, .category-faq-item p { color: #475569; font-size: 15px; line-height: 1.7; }
          .category-content-card p + p { margin-top: 14px; }
          .category-content-card ul { margin: 18px 0 0; padding-left: 20px; display: grid; gap: 9px; }
          .category-content-section { margin-top: 56px; }
          .category-content-section .section-heading { margin-bottom: 20px; }
          .category-tool-guide-grid, .category-related-guides { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
          .category-tool-guide, .category-guide-card { display: flex; flex-direction: column; gap: 10px; min-height: 100%; border: 1px solid var(--border); border-radius: 8px; background: var(--card); padding: 20px; box-shadow: var(--shadow-xs); transition: transform .2s, box-shadow .2s, border-color .2s; }
          .category-tool-guide:hover, .category-guide-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); border-color: #9fb8ed; }
          .category-tool-guide strong, .category-guide-card strong { color: var(--ink); font-size: 16px; }
          .category-tool-guide p, .category-guide-card p { flex: 1; margin: 0; }
          .category-tool-guide span, .category-guide-card span { display: inline-flex; align-items: center; gap: 6px; color: var(--brand-blue); font-size: 13px; font-weight: 700; }
          .category-faq-section { max-width: 880px; }
          .category-faq-list { border-top: 1px solid var(--border); }
          .category-faq-item { border-bottom: 1px solid var(--border); padding: 0; }
          .category-faq-item summary { cursor: pointer; list-style-position: inside; padding: 18px 0; color: var(--ink); font-weight: 700; font-size: 16px; }
          .category-faq-item p { margin: -4px 0 18px; max-width: 760px; }
          .category-trust-links { margin-top: 54px; padding: 22px 24px; border: 1px solid #cbd5e1; border-radius: 8px; background: #f8fafc; }
          .category-trust-links strong { display: block; color: var(--ink); margin-bottom: 12px; }
          .category-trust-links > div { display: flex; flex-wrap: wrap; gap: 12px 22px; }
          .category-trust-links a { display: inline-flex; align-items: center; gap: 5px; color: var(--brand-blue); font-size: 13px; font-weight: 700; }
          @media (max-width: 900px) {
            .category-editorial-grid, .category-tool-guide-grid, .category-related-guides { grid-template-columns: 1fr; }
            .category-content-card-wide { grid-column: auto; }
          }
          @media (max-width: 640px) {
            .category-editorial { padding-top: 0; padding-bottom: 48px; }
            .category-content-card { padding: 20px; }
            .category-content-section { margin-top: 42px; }
            .category-trust-links { padding: 18px; }
            .category-trust-links > div { flex-direction: column; gap: 10px; }
          }
          '''
          css_path.write_text(css)

          audit = audit_path.read_text()
          old_audit = '''if (/introduction\\[0\\]\\s*\\?\\?\\s*category\\.description/.test(appPages)) {
            warn('CategoryPage currently renders only the first category introduction paragraph; next remediation slice must surface the richer questions, choosing guidance, unit/currency guidance, guides and FAQs already present in category-content.ts');
          } else {
            pass('CategoryPage is not limited to the first category introduction paragraph');
          }
          '''
          new_audit = '''const categoryRenderMarkers = [
            'content.questionsAnswered.map',
            'content.choosingTools.map',
            'content.unitCurrencyGuidance.map',
            'content.relatedGuides.map',
            'content.faqs.map',
            'category-tool-guide-grid',
            'category-trust-links',
          ];
          const missingCategoryRenderMarkers = categoryRenderMarkers.filter((marker) => !appPages.includes(marker));
          if (missingCategoryRenderMarkers.length) fail(`CategoryPage does not render the complete category-quality corpus: ${missingCategoryRenderMarkers.join(', ')}`);
          else pass('CategoryPage renders questions, choosing guidance, unit/currency guidance, tool guidance, related guides, FAQs and trust links');
          '''
          if old_audit not in audit:
              raise SystemExit('AdSense audit category warning block did not match expected green-head source')
          audit_path.write_text(audit.replace(old_audit, new_audit, 1))
          PY
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build workspace type dependencies
        run: pnpm exec tsc -b lib/api-client-react
      - name: Typecheck Calcstride
        run: pnpm --filter @workspace/calcstride typecheck
      - name: Run AdSense readiness audit
        run: node scripts/adsense-readiness-audit.mjs
      - name: Build public site
        run: pnpm --filter @workspace/calcstride build
      - name: Verify category remediation markers
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'content.questionsAnswered.map' artifacts/calcstride/src/pages/AppPages.tsx
          grep -Fq 'content.choosingTools.map' artifacts/calcstride/src/pages/AppPages.tsx
          grep -Fq 'content.unitCurrencyGuidance.map' artifacts/calcstride/src/pages/AppPages.tsx
          grep -Fq 'content.relatedGuides.map' artifacts/calcstride/src/pages/AppPages.tsx
          grep -Fq 'content.faqs.map' artifacts/calcstride/src/pages/AppPages.tsx
          grep -Fq 'AdSense category destination content' artifacts/calcstride/src/index.css
      - name: Commit verified remediation and remove bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/one-time-adsense-category-render.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/calcstride/src/pages/AppPages.tsx artifacts/calcstride/src/index.css scripts/adsense-readiness-audit.mjs .github/workflows/one-time-adsense-category-render.yml
          git commit -m 'AdSense: render substantial category guidance'
          git push origin HEAD:adsense/low-value-content-gate
