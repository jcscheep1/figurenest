name: One-time Interest intent consolidation

on:
  push:
    branches:
      - fix/interest-intent-consolidation

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[interest-consolidation-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/interest-intent-consolidation
          fetch-depth: 0

      - name: Consolidate duplicate simple-interest intent
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          catalog = Path('artifacts/calcstride/src/lib/catalog.ts')
          text = catalog.read_text()
          old = "const priorityOneExpansionTools = expansionTools(priorityOneCatalog);"
          new = """// The legacy /calculators/finance/interest route duplicates the core Simple Interest\n// calculator's formula and intent. Keep it out of the public catalogue so search,\n// counts, internal navigation, SEO routes, and the sitemap expose one canonical tool.\nconst priorityOneExpansionTools = expansionTools(\n  priorityOneCatalog.filter((entry) => entry.slug !== 'interest'),\n);"""
          if old not in text:
              raise SystemExit('Expected priorityOneExpansionTools declaration was not found')
          catalog.write_text(text.replace(old, new, 1))

          redirects = Path('artifacts/calcstride/src/lib/redirects.ts')
          text = redirects.read_text()
          marker = "  ['/category/construction/', '/home-construction/'],\n"
          replacement = marker + "  ['/calculators/finance/interest', '/calculators/finance/simple-interest/'],\n  ['/calculators/finance/interest/', '/calculators/finance/simple-interest/'],\n"
          if marker not in text:
              raise SystemExit('Expected redirect-map insertion point was not found')
          redirects.write_text(text.replace(marker, replacement, 1))

          test = Path('artifacts/calcstride/src/lib/interest-intent-consolidation.test.ts')
          test.write_text("""import { describe, expect, it } from 'vitest';\nimport { localTools } from './catalog';\nimport { getRequestRedirect, legacyRedirectPaths } from './redirects';\n\nconst canonicalInterestPath = '/calculators/finance/simple-interest/';\n\ndescribe('simple-interest intent consolidation', () => {\n  it('publishes only the canonical Simple Interest calculator', () => {\n    expect(localTools.some((tool) => tool.slug === 'interest')).toBe(false);\n    expect(localTools.some((tool) =>\n      tool.slug === 'simple-interest' && tool.href === '/calculators/finance/simple-interest'\n    )).toBe(true);\n  });\n\n  it('permanently routes both legacy Interest URL shapes to Simple Interest', () => {\n    for (const pathname of ['/calculators/finance/interest', '/calculators/finance/interest/']) {\n      expect(legacyRedirectPaths).toContain(pathname);\n      expect(getRequestRedirect({\n        hostname: 'figurenest.com',\n        protocol: 'https:',\n        pathname,\n        search: '?principal=1000&rate=5',\n      })).toBe(`https://figurenest.com${canonicalInterestPath}?principal=1000&rate=5`);\n    }\n  });\n});\n""")

          Path('.github/workflows/one-time-interest-consolidation.yml').unlink()
          PY

      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Consolidate duplicate interest calculator intent [interest-consolidation-applied]"
          git push origin HEAD:fix/interest-intent-consolidation
