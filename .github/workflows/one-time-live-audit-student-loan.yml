name: One-time Student Loan production audit

on:
  push:
    paths:
      - '.github/workflows/one-time-live-audit-student-loan.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install selenium
      - run: python scripts/one-time-live-audit-student-loan.py
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: student-loan-live-audit-report
          path: student-loan-audit.txt
