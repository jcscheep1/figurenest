name: One-time Percentage and Matrix repair

on:
  push:
    paths:
      - '.github/workflows/one-time-fix-apr-roman.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply guarded source repairs
        run: python scripts/one-time-fix-percentage-matrix.py
      - name: Build workspace type dependency
        run: pnpm exec tsc -b lib/api-client-react
      - name: Run calculator regression suite
        run: pnpm --filter @workspace/calcstride test
      - name: Typecheck calculator app
        run: pnpm --filter @workspace/calcstride typecheck
      - name: Commit passing repair
        run: |
          git config user.name 'FigureNest Repair Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add artifacts/calcstride/src/lib/core-calculators.ts artifacts/calcstride/src/lib/phase-three-b.ts artifacts/calcstride/src/lib/percentage-calculator-input-regression.test.ts artifacts/calcstride/src/lib/matrix-unused-inputs.test.ts
          git diff --cached --quiet && exit 0
          git commit -m 'Fix Percentage blank inputs and Matrix single-input operations'
          git push origin HEAD:main
